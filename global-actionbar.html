<!-- global-actionbar.html -->
<div id="ftg-global-actionbar-root"></div>

<style>
  :root {
    --ftg-actionbar-side: 12px;
    --ftg-actionbar-bottom: calc(12px + env(safe-area-inset-bottom));
    --ftg-ai-bottom: calc(92px + env(safe-area-inset-bottom));
    --ftg-surface: rgba(8,12,16,.74);
    --ftg-surface-strong: rgba(8,12,16,.88);
    --ftg-border: rgba(255,255,255,.12);
    --ftg-text: #fff;
    --ftg-text-soft: rgba(255,255,255,.62);
  }

  body.ftg-actionbar-enabled {
    padding-bottom: calc(116px + env(safe-area-inset-bottom));
  }

  .ftg-bottom-ai-stack {
    position: fixed;
    right: 18px;
    bottom: var(--ftg-ai-bottom);
    z-index: 60;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }

  .ftg-ai-chat-btn {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.55);
    background: rgba(255,255,255,.78);
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 18px 42px rgba(0,0,0,.24);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }
  .ftg-ai-chat-btn:active { transform: scale(.95); }
  .ftg-ai-chat-btn video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center 0%;
    transform: scale(1.22);
    pointer-events: none;
  }

  .ftg-bottom-nav {
    position: fixed;
    left: var(--ftg-actionbar-side);
    right: var(--ftg-actionbar-side);
    bottom: var(--ftg-actionbar-bottom);
    z-index: 70;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 6px;
    padding: 8px;
    border-radius: 28px;
    background: var(--ftg-surface);
    border: 1px solid var(--ftg-border);
    box-shadow: 0 20px 48px rgba(0,0,0,.28);
    backdrop-filter: blur(22px) saturate(1.16);
    -webkit-backdrop-filter: blur(22px) saturate(1.16);
  }

  .ftg-nav-item {
    min-height: 58px;
    border: 0;
    border-radius: 22px;
    background: transparent;
    color: var(--ftg-text-soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    font-size: 11px;
    line-height: 1;
    font-weight: 900;
    letter-spacing: -.01em;
    cursor: pointer;
    transition: background .22s ease, color .22s ease, transform .22s ease, opacity .22s ease;
  }
  .ftg-nav-item:active { transform: scale(.96); }
  .ftg-nav-item.active {
    background: rgba(255,255,255,.12);
    color: var(--ftg-text);
  }
  .ftg-nav-icon {
    width: 24px;
    height: 24px;
    display: grid;
    place-items: center;
    font-size: 19px;
    line-height: 1;
  }
  .ftg-nav-icon-grid {
    width: 18px;
    height: 18px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 3px;
  }
  .ftg-nav-icon-grid span {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 3px;
    background: currentColor;
  }

  .ftg-profile-drawer {
    position: fixed;
    left: var(--ftg-actionbar-side);
    right: var(--ftg-actionbar-side);
    bottom: var(--ftg-actionbar-bottom);
    z-index: 55;
    border-radius: 30px 30px 28px 28px;
    background: var(--ftg-surface-strong);
    border: 1px solid var(--ftg-border);
    box-shadow: 0 22px 56px rgba(0,0,0,.28);
    backdrop-filter: blur(24px) saturate(1.16);
    -webkit-backdrop-filter: blur(24px) saturate(1.16);
    padding: 14px 14px 0;
    display: block;
    opacity: 0;
    transform: translateY(calc(100% - 82px));
    transform-origin: bottom center;
    transition: transform .34s cubic-bezier(.2,.9,.2,1), opacity .24s ease;
    pointer-events: none;
    max-height: min(76vh, 640px);
    overflow: hidden;
  }
  .ftg-profile-drawer.open {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .ftg-profile-drawer-handle {
    display: none;
  }
  .ftg-profile-drawer-handle::before {
    display: none;
  }
  .ftg-profile-drawer-scroll {
    max-height: calc(min(76vh, 640px) - 18px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-right: 2px;
    padding-bottom: 92px;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .ftg-profile-drawer-scroll::-webkit-scrollbar { display: none; width: 0; height: 0; background: transparent; }
  .ftg-profile-drawer-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
    color: var(--ftg-text);
  }
  .ftg-profile-head-left {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .ftg-profile-primary-btn {
    min-height: 40px;
    padding: 0 14px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.94);
    color: #111;
    font-size: 13px;
    font-weight: 950;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .ftg-profile-language-menu {
    position: relative;
    display: inline-flex;
  }
  .ftg-profile-language-current {
    width: 40px;
    height: 40px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.16);
    background: rgba(255,255,255,.10);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
  }
  .ftg-profile-language-list {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    display: none;
    flex-direction: column;
    gap: 6px;
    padding: 8px;
    min-width: 112px;
    border-radius: 18px;
    background: rgba(8,12,16,.94);
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 16px 36px rgba(0,0,0,.24);
  }
  .ftg-profile-language-menu.open .ftg-profile-language-list {
    display: flex;
  }
  
  .ftg-profile-close {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 0;
    background: rgba(255,255,255,.10);
    color: var(--ftg-text);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    flex: 0 0 34px;
  }
  .ftg-profile-language-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    margin-bottom: 14px;
    padding-bottom: 2px;
  }
  .ftg-profile-language-row::-webkit-scrollbar { display: none; }
  .ftg-profile-language-btn {
    flex: 0 0 auto;
    min-height: 38px;
    padding: 8px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.08);
    color: rgba(255,255,255,.84);
    font-size: 12px;
    font-weight: 900;
    cursor: pointer;
  }
  .ftg-profile-language-btn.active {
    background: rgba(255,255,255,.94);
    color: #111;
  }
  
  .ftg-profile-links {
    display: grid;
    gap: 8px;
    margin-bottom: 14px;
  }
  .ftg-profile-link {
    width: 100%;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 14px;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.08);
    color: var(--ftg-text);
    text-decoration: none;
    font-size: 14px;
    font-weight: 850;
  }
  .ftg-profile-link span:last-child {
    color: rgba(255,255,255,.46);
    font-size: 18px;
    line-height: 1;
  }
  .ftg-profile-legal {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 2px;
  }
  .ftg-profile-legal a {
    color: rgba(255,255,255,.62);
    font-size: 12px;
    font-weight: 800;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  body.ftg-profile-drawer-open .ftg-bottom-nav {
    opacity: 1;
    visibility: visible;
    transform: none;
    pointer-events: auto;
    border-radius: 0 0 28px 28px;
  }
  body.ftg-profile-drawer-open .ftg-nav-item[data-profile-trigger] {
    background: rgba(255,255,255,.12);
    color: var(--ftg-text);
  }

  .ftg-ai-chat {
    position: fixed;
    left: 12px;
    right: 12px;
    top: calc(82px + env(safe-area-inset-top));
    bottom: calc(100px + env(safe-area-inset-bottom));
    z-index: 100;
    display: none;
    flex-direction: column;
    overflow: hidden;
    border-radius: 26px;
    border: 1px solid rgba(255,255,255,.34);
    background: rgba(255,255,255,.78);
    box-shadow: 0 24px 70px rgba(0,0,0,.28);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    color: #111;
  }
  .ftg-ai-chat.ai-open { display: flex; }
  .ftg-ai-head {
    padding: 14px 14px 12px;
    border-bottom: 1px solid rgba(0,0,0,.07);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .ftg-ai-head-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    flex: 1;
  }
  .ftg-ai-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    overflow: hidden;
    flex: 0 0 42px;
    background: rgba(255,255,255,.85);
    border: 1px solid rgba(0,0,0,.08);
    box-shadow: 0 4px 14px rgba(0,0,0,.12);
  }
  .ftg-ai-avatar video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center 0%;
    transform: scale(1.22);
  }
  .ftg-ai-title {
    font-size: 15px;
    font-weight: 900;
    letter-spacing: -.03em;
    line-height: 1.1;
    color: #111;
  }
  .ftg-ai-subtitle {
    margin-top: 3px;
    font-size: 12px;
    color: rgba(0,0,0,.52);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.15;
  }
  .ftg-ai-close {
    width: 32px;
    height: 32px;
    border: 0;
    border-radius: 50%;
    background: rgba(0,0,0,.07);
    color: #111;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
  }
  .ftg-ai-messages {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 12px;
    font-size: 14px;
    line-height: 1.35;
    -webkit-overflow-scrolling: touch;
  }
  .ftg-ai-msg {
    max-width: 84%;
    word-break: break-word;
    margin-bottom: 8px;
    padding: 10px 12px;
    border-radius: 18px;
    white-space: pre-line;
  }
  .ftg-ai-msg.user {
    margin-left: auto;
    background: #111;
    color: #fff;
    border-bottom-right-radius: 6px;
  }
  .ftg-ai-msg.bot {
    margin-right: auto;
    background: rgba(0,0,0,.07);
    color: #111;
    border-bottom-left-radius: 6px;
  }
  .ftg-ai-suggestions {
    display: flex;
    gap: 7px;
    padding: 0 12px 10px;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .ftg-ai-suggestions::-webkit-scrollbar { display: none; }
  .ftg-ai-suggestion {
    flex: 0 0 auto;
    border: 0;
    border-radius: 999px;
    padding: 8px 10px;
    background: rgba(0,0,0,.07);
    color: #111;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .ftg-ai-input-row {
    padding: 10px;
    display: flex;
    gap: 8px;
    border-top: 1px solid rgba(0,0,0,.07);
    background: rgba(255,255,255,.36);
  }
  .ftg-ai-input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    border-radius: 999px;
    background: rgba(0,0,0,.07);
    color: #111;
    padding: 11px 13px;
    font-size: 15px;
  }
  .ftg-ai-send {
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 50%;
    background: #111;
    color: #fff;
    font-weight: 900;
    cursor: pointer;
  }

  body.ftg-ai-chat-active .ftg-bottom-nav,
  body.ftg-ai-chat-active .ftg-bottom-ai-stack,
  body.ftg-ai-chat-active .ftg-profile-drawer {
    opacity: 0;
    pointer-events: none;
    visibility: hidden;
  }

  @media (min-width: 700px) {
    .ftg-bottom-nav,
    .ftg-ai-chat,
    .ftg-bottom-ai-stack,
    .ftg-profile-drawer {
      max-width: 406px;
      margin-left: auto;
      margin-right: auto;
    }
    .ftg-bottom-nav,
    .ftg-ai-chat,
    .ftg-profile-drawer {
      left: max(12px, calc(50% - 203px));
      right: max(12px, calc(50% - 203px));
    }
    .ftg-bottom-ai-stack {
      right: max(18px, calc(50% - 185px));
    }
  }
</style>

<script>
  (function () {
    'use strict';

    if (window.FTG_GLOBAL_ACTIONBAR_BOOTED) return;
    window.FTG_GLOBAL_ACTIONBAR_BOOTED = true;

    var config = window.FTG_ACTIONBAR_CONFIG || {};
    var activePage = config.activePage || 'home';
    var userName = config.userName || 'Utente';
    var isLoggedIn = Boolean(config.isLoggedIn);
    var aiTitle = config.aiTitle || 'Captain Gull';
    var aiSubtitle = config.aiSubtitle || 'Global actionbar';
    var aiWelcome = config.aiWelcome || 'Actionbar globale pronta. Ora puoi riusarla su tutte le pagine del sito.';
    var pages = config.pages || {
      map: { label: 'Mappa', emoji: '🗺️', href: 'map.html' },
      home: { label: 'Home', emoji: '🏠', href: '#home' },
      guide: { label: 'Guide', emoji: '📖', href: '#guide' },
      profile: { label: 'More', emoji: '', href: '#profile', drawer: true, iconType: 'grid' }
    };
    var profileLinks = config.profileLinks || [
      { label: 'Mi piace', href: '#likes' },
      { label: 'Le mie experience', href: '#experiences' },
      { label: 'Modifica profilo', href: '#edit-profile' },
      { label: 'Preferenze', href: '#preferences' }
    ];
    var legalLinks = config.legalLinks || [
      { label: 'Privacy', href: '#privacy' },
      { label: 'Policy', href: '#policy' }
    ];
    var languages = config.languages || [
      { code: 'it', label: '🇮🇹 Italiano' },
      { code: 'en', label: '🇬🇧 English' },
      { code: 'fr', label: '🇫🇷 Français' },
      { code: 'de', label: '🇩🇪 Deutsch' }
    ];
    var currentLanguage = config.language || (languages[0] && languages[0].code) || 'it';
    var basePath = typeof config.basePath === 'string' ? config.basePath.trim() : '';
    var root = document.getElementById('ftg-global-actionbar-root');
    var pageKeys = ['map', 'home', 'guide', 'profile'];

    if (!root) return;
    document.body.classList.add('ftg-actionbar-enabled');

    function escapeHTML(value) {
      return String(value || '').replace(/[&<>\"]/g, function (char) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[char];
      });
    }

    function resolveHref(href) {
      var value = String(href || '').trim();
      if (!value) return '';
      if (/^(https?:|mailto:|tel:|#|\/)/i.test(value)) return value;
      if (basePath) return basePath.replace(/\/+$/, '') + '/' + value.replace(/^\/+/, '');
      return '/' + value.replace(/^\/+/, '');
    }

    function buildNavItem(key) {
      var page = pages[key] || {};
      var iconHTML = page.iconType === 'grid'
        ? '<span class="ftg-nav-icon-grid"><span></span><span></span><span></span><span></span></span>'
        : escapeHTML(page.emoji || '•');
      return '<button class="ftg-nav-item' + (activePage === key ? ' active' : '') + '" type="button" data-page-target="' + escapeHTML(key) + '"' + (page.drawer ? ' data-profile-trigger="true"' : '') + '><span class="ftg-nav-icon">' + iconHTML + '</span><span>' + escapeHTML(page.label || key) + '</span></button>';
    }

    root.innerHTML = '' +
      '<div class="ftg-bottom-ai-stack">' +
        '<button class="ftg-ai-chat-btn" id="ftg-ai-chat-btn" type="button" aria-label="Open AI Guide">' +
          '<video id="ftg-ai-mascot-video" autoplay muted loop playsinline preload="auto">' +
            '<source src="https://tanzaniagetawayinfo-source.github.io/5TerreGo/mascotterelax.webm" type="video/webm">' +
            '<source src="https://raw.githubusercontent.com/tanzaniagetawayinfo-source/5TerreGo/main/mascotterelax.webm" type="video/webm">' +
          '</video>' +
        '</button>' +
      '</div>' +
      '<aside id="ftg-profile-drawer" class="ftg-profile-drawer" aria-hidden="true">' +
        '<div id="ftg-profile-drawer-handle" class="ftg-profile-drawer-handle" aria-hidden="true"></div>' +
        '<div class="ftg-profile-drawer-scroll">' +
          '<' + 'div class="ftg-profile-drawer-head">' +
            '<div class="ftg-profile-head-left">' +
              '<button id="ftg-profile-primary-btn" class="ftg-profile-primary-btn" type="button">' + (isLoggedIn ? ('Hi, ' + escapeHTML(userName)) : 'Accedi') + '</button>' +
              '<div id="ftg-profile-language-menu" class="ftg-profile-language-menu">' +
                '<button id="ftg-profile-language-current" class="ftg-profile-language-current" type="button" aria-label="Selettore lingua">' + escapeHTML((languages.find(function(lang){ return lang.code === currentLanguage; }) || languages[0] || { label: '🇮🇹' }).label.split(' ')[0]) + '</button>' +
                '<div class="ftg-profile-language-list">' +
                  languages.map(function (lang) {
                    return '<button class="ftg-profile-language-btn' + (lang.code === currentLanguage ? ' active' : '') + '" type="button" data-lang="' + escapeHTML(lang.code) + '"><span>' + escapeHTML(lang.label.split(' ')[0]) + '</span><span>' + escapeHTML(lang.label.split(' ').slice(1).join(' ')) + '</span></button>';
                  }).join('') +
                '</div>' +
              '</div>' +
            '</div>' +
            '<button id="ftg-profile-close" class="ftg-profile-close" type="button" aria-label="Chiudi area riservata">×</button>' +
          '</div>' +
          '<div class="ftg-profile-links">' +
            profileLinks.map(function (link) {
              return '<a class="ftg-profile-link" href="' + escapeHTML(link.href || '#') + '"><span>' + escapeHTML(link.label || '') + '</span><span>›</span></a>';
            }).join('') +
          '</div>' +
          '<div class="ftg-profile-legal">' +
            legalLinks.map(function (link) {
              return '<a href="' + escapeHTML(link.href || '#') + '">' + escapeHTML(link.label || '') + '</a>';
            }).join('') +
          '</div>' +
        '</div>' +
      '</aside>' +
      '<nav class="ftg-bottom-nav" aria-label="Global bottom actionbar">' +
        pageKeys.map(buildNavItem).join('') +
      '</nav>' +
      '<div id="ftg-ai-chat" class="ftg-ai-chat" aria-hidden="true">' +
        '<div class="ftg-ai-head">' +
          '<div class="ftg-ai-head-left">' +
            '<div class="ftg-ai-avatar">' +
              '<video id="ftg-ai-header-video" autoplay muted loop playsinline preload="auto">' +
                '<source src="https://tanzaniagetawayinfo-source.github.io/5TerreGo/mascotterelax.webm" type="video/webm">' +
                '<source src="https://raw.githubusercontent.com/tanzaniagetawayinfo-source/5TerreGo/main/mascotterelax.webm" type="video/webm">' +
              '</video>' +
            '</div>' +
            '<div><div class="ftg-ai-title">' + escapeHTML(aiTitle) + '</div><div class="ftg-ai-subtitle">' + escapeHTML(aiSubtitle) + '</div></div>' +
          '</div>' +
          '<button id="ftg-ai-close" class="ftg-ai-close" type="button" aria-label="Close AI">×</button>' +
        '</div>' +
        '<div id="ftg-ai-messages" class="ftg-ai-messages"></div>' +
        '<div class="ftg-ai-suggestions">' +
          '<button class="ftg-ai-suggestion" type="button">come organizziamo la barra globale?</button>' +
          '<button class="ftg-ai-suggestion" type="button">quale pagina è attiva?</button>' +
          '<button class="ftg-ai-suggestion" type="button">portiamola su tutto il sito</button>' +
        '</div>' +
        '<div class="ftg-ai-input-row">' +
          '<input id="ftg-ai-input" class="ftg-ai-input" placeholder="Ask the guide..." autocomplete="off" />' +
          '<button id="ftg-ai-send" class="ftg-ai-send" type="button">→</button>' +
        '</div>' +
      '</div>';

    var navButtons = Array.prototype.slice.call(root.querySelectorAll('.ftg-nav-item'));
    var profileDrawer = document.getElementById('ftg-profile-drawer');
    var profileClose = document.getElementById('ftg-profile-close');
    var profileHandle = document.getElementById('ftg-profile-drawer-handle');
    var profilePrimaryBtn = document.getElementById('ftg-profile-primary-btn');
    var profileLanguageMenu = document.getElementById('ftg-profile-language-menu');
    var profileLanguageCurrent = document.getElementById('ftg-profile-language-current');
    var languageButtons = Array.prototype.slice.call(root.querySelectorAll('.ftg-profile-language-btn'));
    var aiBtn = document.getElementById('ftg-ai-chat-btn');
    var aiChat = document.getElementById('ftg-ai-chat');
    var aiClose = document.getElementById('ftg-ai-close');
    var aiMessages = document.getElementById('ftg-ai-messages');
    var aiInput = document.getElementById('ftg-ai-input');
    var aiSend = document.getElementById('ftg-ai-send');
    var aiSuggestions = Array.prototype.slice.call(root.querySelectorAll('.ftg-ai-suggestion'));
    var welcomed = false;

    function syncActiveButton(pageId) {
      activePage = pageId;
      navButtons.forEach(function (button) {
        button.classList.toggle('active', button.getAttribute('data-page-target') === pageId);
      });
    }

    function closeProfileDrawer() {
      if (!profileDrawer) return;
      profileDrawer.classList.remove('open');
      profileDrawer.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('ftg-profile-drawer-open');
      if (activePage !== 'profile') syncActiveButton(activePage);
    }

    function openProfileDrawer() {
      if (!profileDrawer) return;
      profileDrawer.classList.add('open');
      profileDrawer.setAttribute('aria-hidden', 'false');
      document.body.classList.add('ftg-profile-drawer-open');
      syncActiveButton('profile');
    }

    function navigateToPage(pageId) {
      var page = pages[pageId] || {};
      var href = resolveHref(page.href || '');
      closeProfileDrawer();
      syncActiveButton(pageId);

      if (href && href !== '#' && href.charAt(0) !== '#') {
        window.location.href = href;
        return;
      }

      if (typeof config.onNavigate === 'function') {
        config.onNavigate(pageId, page);
        return;
      }

      if (href) window.location.href = href;
    }

    navButtons.forEach(function (button) {
      button.addEventListener('click', function () {
        if (button.hasAttribute('data-profile-trigger')) {
          if (profileDrawer.classList.contains('open')) closeProfileDrawer();
          else openProfileDrawer();
          return;
        }
        navigateToPage(button.getAttribute('data-page-target'));
      });
    });

    if (profileClose) profileClose.addEventListener('click', closeProfileDrawer);
    if (profileHandle) profileHandle.addEventListener('click', closeProfileDrawer);
    document.addEventListener('click', function (event) {
      if (profileLanguageMenu && profileLanguageMenu.classList.contains('open') && !profileLanguageMenu.contains(event.target)) {
        profileLanguageMenu.classList.remove('open');
      }
      if (!document.body.classList.contains('ftg-profile-drawer-open')) return;
      if (event.target.closest('[data-profile-trigger]')) return;
      if (profileDrawer && profileDrawer.contains(event.target)) {
        if (!event.target.closest('.ftg-profile-link') && !event.target.closest('.ftg-profile-language-menu') && !event.target.closest('.ftg-profile-primary-btn') && !event.target.closest('.ftg-profile-close')) {
          closeProfileDrawer();
        }
        return;
      }
      closeProfileDrawer();
    });

    if (profilePrimaryBtn) {
      profilePrimaryBtn.addEventListener('click', function () {
        if (isLoggedIn) {
          if (typeof config.onOpenPreferences === 'function') config.onOpenPreferences();
        } else {
          if (typeof config.onLoginClick === 'function') {
            config.onLoginClick();
          } else {
            window.location.href = resolveHref('login.html');
          }
        }
      });
    }

    languageButtons.forEach(function (button) {
      button.addEventListener('click', function () {
        var pieces = button.textContent.trim().split(' ');
        currentLanguage = button.getAttribute('data-lang') || currentLanguage;
        languageButtons.forEach(function (item) { item.classList.remove('active'); });
        button.classList.add('active');
        if (profileLanguageCurrent) profileLanguageCurrent.textContent = pieces[0] || '🌐';
        if (profileLanguageMenu) profileLanguageMenu.classList.remove('open');
        if (typeof config.onLanguageChange === 'function') config.onLanguageChange(currentLanguage);
      });
    });

    if (profileLanguageCurrent && profileLanguageMenu) {
      profileLanguageCurrent.addEventListener('click', function (event) {
        event.stopPropagation();
        profileLanguageMenu.classList.toggle('open');
      });
    }

    function forceMascotVideos() {
      ['ftg-ai-mascot-video', 'ftg-ai-header-video'].forEach(function (id) {
        var video = document.getElementById(id);
        if (!video) return;
        video.muted = true;
        video.loop = true;
        video.playsInline = true;
        video.setAttribute('muted', '');
        video.setAttribute('playsinline', '');
        video.setAttribute('webkit-playsinline', '');
        video.load();
        var playPromise = video.play();
        if (playPromise && typeof playPromise.catch === 'function') playPromise.catch(function () {});
      });
    }

    function addAIMessage(text, isUser) {
      var div = document.createElement('div');
      div.className = 'ftg-ai-msg ' + (isUser ? 'user' : 'bot');
      div.innerText = text;
      aiMessages.appendChild(div);
      aiMessages.scrollTop = aiMessages.scrollHeight;
    }

    function toggleAI(open) {
      var shouldOpen = typeof open === 'boolean' ? open : !aiChat.classList.contains('ai-open');
      aiChat.classList.toggle('ai-open', shouldOpen);
      aiChat.setAttribute('aria-hidden', shouldOpen ? 'false' : 'true');
      document.body.classList.toggle('ftg-ai-chat-active', shouldOpen);
      if (shouldOpen && !welcomed) {
        welcomed = true;
        addAIMessage(aiWelcome, false);
      }
    }

    function handleAISend(textFromButton) {
      var text = String(textFromButton || aiInput.value || '').trim();
      if (!text) return;
      addAIMessage(text, true);
      aiInput.value = '';
      window.setTimeout(function () {
        addAIMessage('Pagina attiva: ' + activePage + '. Questa è la base shared di global-actionbar.html.', false);
      }, 120);
    }

    if (aiBtn) aiBtn.addEventListener('click', function () { toggleAI(); });
    if (aiClose) aiClose.addEventListener('click', function () { toggleAI(false); });
    if (aiSend) aiSend.addEventListener('click', function () { handleAISend(); });
    if (aiInput) aiInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') handleAISend(); });
    aiSuggestions.forEach(function (button) {
      button.addEventListener('click', function () { handleAISend(button.innerText); });
    });

    forceMascotVideos();
    window.addEventListener('load', forceMascotVideos);
    document.addEventListener('touchstart', forceMascotVideos, { passive: true, once: true });
    document.addEventListener('click', forceMascotVideos, { passive: true, once: true });

    window.FTG_GLOBAL_ACTIONBAR = {
      navigateToPage: navigateToPage,
      openProfileDrawer: openProfileDrawer,
      closeProfileDrawer: closeProfileDrawer,
      toggleAI: toggleAI,
      getCurrentPage: function () { return activePage; },
      setActivePage: function (pageId) { syncActiveButton(pageId); activePage = pageId; }
    };
  }());
</script>
