<!-- global-actionbar-two-rows.html -->
<div id="ftg-global-actionbar-root"></div>

<style>
  :root {
    --ftg-header-height: calc(104px + env(safe-area-inset-top));

  body.ftg-actionbar-enabled {
    padding-top: var(--ftg-header-height);
    background: #fff;
  }

  body.ftg-menu-open {
    overflow: hidden;
  }

  .ftg-topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;

  .ftg-brand-title {

  .ftg-account-btn,

    color: var(--ftg-text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;

  }

  .ftg-icon-btn {
    position: relative;
    z-index: 10150;
  }

  .ftg-account-btn:active,
  .ftg-icon-btn:active {

  }

  .ftg-profile-avatar {
    width: 100%;
    height: 100%;
    display: inline-flex;
    align-items: center;
    justify-content: center;

  }

  .ftg-profile-avatar svg {
    width: 19px;
    height: 19px;
    display: block;
  }

  .ftg-hamburger {
    width: 18px;
    height: 14px;
    position: relative;
    display: inline-block;
  }

  .ftg-hamburger span {
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    border-radius: 999px;
    background: var(--ftg-text);
    transition: transform .22s ease, opacity .18s ease, top .22s ease, bottom .22s ease;
    transform-origin: center;
  }

  .ftg-hamburger span:nth-child(1) { top: 0; }
  .ftg-hamburger span:nth-child(2) { top: 6px; }
  .ftg-hamburger span:nth-child(3) { bottom: 0; }

  .ftg-icon-btn.is-open .ftg-hamburger span:nth-child(1) {
    top: 6px;
    transform: rotate(45deg);
  }

  .ftg-icon-btn.is-open .ftg-hamburger span:nth-child(2) {
    opacity: 0;
  }

  .ftg-icon-btn.is-open .ftg-hamburger span:nth-child(3) {
    bottom: 6px;
    transform: rotate(-45deg);
  }

  .ftg-topbar-row-2 {
    display: grid;
    grid-template-columns: minmax(0,1fr);
  }

  .ftg-topbar.menu-open {

    background: transparent;
    border-bottom-color: transparent;
    box-shadow: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    pointer-events: none;

  .ftg-topbar.menu-open .ftg-brand,
  .ftg-topbar.menu-open .ftg-topbar-row-2,
  .ftg-topbar.menu-open .ftg-account-btn {

  }

  .ftg-topbar.menu-open .ftg-icon-btn,
  .ftg-topbar.menu-open .ftg-topbar-actions {

  .ftg-pill-scroller {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    overflow-y: hidden;

    scrollbar-width: none;
    scroll-snap-type: x proximity;

  .ftg-pill-scroller::-webkit-scrollbar {

  .ftg-nav-pill {

    height: 18px;

    height: 22px;

  .ftg-nav-pill.active .ftg-nav-pill-emoji svg {

    height: 16px;
  }

  .ftg-nav-pill.active .ftg-nav-pill-emoji img {
    width: 16px;
    height: 16px;
  }

  .ftg-menu-panel {

    inset: 0;
    z-index: 10120;
    display: none;
    flex-direction: column;
    background: rgba(255,255,255,.985);

  }

  .ftg-menu-panel.open {
    display: flex;
  }

  .ftg-menu-panel-shell {
    width: 100%;
    max-width: 1320px;
    margin: 0 auto;
    min-height: 100vh;

  .ftg-ai-avatar-slot { position:relative; width:44px; height:44px; flex:0 0 44px; overflow:hidden; display:grid; place-items:center; border:2px solid #fff; border-radius:50%; background:#12345a; box-shadow:0 4px 14px rgba(10,34,65,.2); }
  .ftg-ai-avatar-slot video { position:absolute; inset:0; z-index:1; width:100%; height:100%; display:block; object-fit:cover; object-position:center top; transform:translateY(4px) scale(.94); }

  .ftg-ai-fab { position:fixed; right:max(16px,calc(16px + env(safe-area-inset-right))); bottom:max(16px,calc(16px + env(safe-area-inset-bottom))); z-index:10170; width:64px; height:64px; padding:0; overflow:hidden; border:2px solid #fff; border-radius:50%; background:#12345a; box-shadow:0 10px 26px rgba(10,34,65,.32); cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; transition:left .28s cubic-bezier(.2,.9,.2,1),right .28s cubic-bezier(.2,.9,.2,1),top .22s cubic-bezier(.2,.9,.2,1),transform .16s ease; }

    function updateMenuDynamicItems() {
      var languageMeta = getLanguageMeta(currentLanguage);
      if (languageMenuFlag) languageMenuFlag.innerText = languageMeta.flag || "🏳️";
      if (languageMenuLabel) languageMenuLabel.innerText = languageMeta.label || languageMeta.code || "Language";
      if (languageTitle) languageTitle.innerText = t("choose_language", "Choose language");
      if (legalTitle) legalTitle.innerText = t("legal_title", "Legal area");
      if (privacyLabel) privacyLabel.innerText = t("privacy", "Privacy Policy");
      if (termsLabel) termsLabel.innerText = t("terms", "Terms & Conditions");
      if (androidAppLabel) androidAppLabel.innerText = t("download_android", "Download the Android app");
      if (androidAppLink) {
        var isAndroid = /android/i.test(navigator.userAgent || "");
        androidAppLink.style.display = isAndroid ? "flex" : "none";
      }
    }

    function applyTranslations() {
      rebuildPills();
      rebuildLanguageList();
      updateMenuDynamicItems();
    }

    if (accountBtn) {
      accountBtn.addEventListener("click", function () {
        window.location.href = resolveHref("login.html");
      });
    }

    if (menuPanel) {
      menuPanel.addEventListener("click", function (event) {
        event.stopPropagation();
      });
    }

    if (menuTrigger && menuPanel) {
      menuTrigger.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        var isOpen = menuPanel.classList.contains("open");
        var isLanguageMode = menuPanel.classList.contains("is-language-mode");

        if (!isOpen) {
          openMenu();
          return;
        }

        if (isLanguageMode) {
          closeLanguagePanel();
          return;
        }

        closeMenu();
      });
    }

    if (languageMenuItem) {
      languageMenuItem.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        openLanguagePanel();
      });
    }

    if (aiClose) {
      aiClose.addEventListener("click", function () {
        if (aiAbortController) aiAbortController.abort();
        toggleAI(false);
      });
    }

    aiBack.addEventListener("click",function () {
      if (aiAbortController) aiAbortController.abort();
      toggleAI(false);
    });

    aiFab.addEventListener("click",function (event) {
      if (aiFabWasDragged) { aiFabWasDragged = false; event.preventDefault(); return; }
      toggleAI();
    });

    if (aiSend) {
      aiSend.addEventListener("click", function () {
        handleAISend();
      });
    }

    if (aiInput) {
      aiInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") handleAISend();
      });
    }
    if (aiIntroSend) aiIntroSend.addEventListener('click', function () { handleAISend(aiIntroInput && aiIntroInput.value); });
    if (aiIntroInput) aiIntroInput.addEventListener('keydown', function (event) { if (event.key === 'Enter') handleAISend(aiIntroInput.value); });
    if (aiIntroClose) aiIntroClose.addEventListener('click', function () { closeAI(); });

    aiSuggestions.forEach(function (button) {
      button.addEventListener("click", function () {
        handleAISend(button.innerText);
      });
    });

    window.addEventListener("scroll", maybeMarkScrolled, { passive: true });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        toggleAI(false);
        closeMenu();
      }
    });

    document.addEventListener("click", function (event) {
      if (!menuPanel || !menuTrigger) return;
      if (!menuPanel.classList.contains("open")) return;
      if (!menuPanel.contains(event.target) && !menuTrigger.contains(event.target)) {
        closeMenu();
      }
    });

    applyTranslations();
    syncMenuVisualState();
    maybeMarkScrolled();
    restoreFabPosition();

    var api = {
      navigateToPage: function (pageId) {
        var normalizedPageId = normalizePageId(pageId) || "home";
        var match = menuItems.find(function (item) { return item.id === normalizedPageId; }) || {};
        navigateTo(normalizedPageId, match.href || "");
      },
      toggleAI: toggleAI,
      getCurrentPage: function () { return activePage; },
      setActivePage: function (pageId) {
        activePage = normalizePageId(pageId) || "home";
        rebuildPills();
      },
      remount: function (nextRoot, nextConfig) { return mountGlobalActionbar(nextRoot || root, nextConfig || config); }
    };

    window.FTG_GLOBAL_ACTIONBAR = api;
    return api;
  }

  window.FTG_MOUNT_GLOBAL_ACTIONBAR = mountGlobalActionbar;

  var standaloneRoot = document.getElementById("ftg-global-actionbar-root");
  if (standaloneRoot && !standaloneRoot.childElementCount) {
    mountGlobalActionbar(standaloneRoot, window.FTG_ACTIONBAR_CONFIG || {});
  }
}());
</script>
