<!-- global-actionbar-two-rows.html -->
<div id="ftg-global-actionbar-root"></div>

<style>
  :root {
    --ftg-header-height: calc(104px + env(safe-area-inset-top));
    --ftg-safe-top: env(safe-area-inset-top);
    --ftg-text: #111827;
    --ftg-text-soft: #111827;
    --ftg-line: rgba(15, 23, 42, .08);
    --ftg-line-strong: rgba(15, 23, 42, .12);
    --ftg-pill: #f5f7fb;
    --ftg-pill-active: rgba(255,255,255,.10);
    --ftg-primary: #0b5ed7;
    --ftg-orange: #ff7a00;
    --ftg-celeste: #38bdf8;
    --ftg-white: #ffffff;
    --ftg-shadow: 0 14px 34px rgba(15, 23, 42, .08);
    --ftg-shadow-strong: 0 22px 44px rgba(15, 23, 42, .14);
  }

  body.ftg-actionbar-enabled {
    padding-top: var(--ftg-header-height);
    background: #fff;
  }

  body.ftg-menu-open {
    overflow: hidden;
  }

  .ftg-topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10080;
    padding-top: var(--ftg-safe-top);
    background: rgba(255,255,255,.96);
    backdrop-filter: blur(18px) saturate(1.08);
    -webkit-backdrop-filter: blur(18px) saturate(1.08);
    border-bottom: 1px solid var(--ftg-line);
    box-shadow: 0 8px 24px rgba(15, 23, 42, .08);
    transition: box-shadow .22s ease, background .22s ease, border-color .22s ease;
  }

  .ftg-topbar.is-scrolled {
    background: rgba(255,255,255,.99);
    border-bottom-color: var(--ftg-line-strong);
    box-shadow: var(--ftg-shadow);
  }

  .ftg-topbar-shell {
    max-width: 1320px;
    margin: 0 auto;
    padding: 10px 14px 10px;
    display: grid;
    gap: 10px;
  }

  .ftg-topbar-row-1 {
    display: grid;
    grid-template-columns: minmax(0,1fr) auto;
    gap: 12px;
    align-items: center;
  }

  .ftg-brand {
    min-width: 0;
    display: flex;
    align-items: center;
  }

  .ftg-brand-title {
    font-size: 28px;
    line-height: 1;
    letter-spacing: -.055em;
    font-weight: 950;
    color: var(--ftg-text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .ftg-brand-title .go {
    color: var(--ftg-orange);
  }

  .ftg-brand-title .dotcom {
    color: var(--ftg-text);
  }

  .ftg-topbar-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: nowrap;
    justify-content: flex-end;
    position: relative;
    z-index: 10140;
  }

  .ftg-account-btn,
  .ftg-icon-btn {
    width: 42px;
    height: 42px;
    border-radius: 999px;
    border: 1px solid var(--ftg-line);
    background: #fff;
    color: var(--ftg-text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    cursor: pointer;
    box-shadow: none;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
  }

  .ftg-icon-btn {
    position: relative;
    z-index: 10150;
  }

  .ftg-account-btn:active,
  .ftg-icon-btn:active {
    transform: scale(.98);
  }

  .ftg-profile-avatar {
    width: 100%;
    height: 100%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--ftg-text);
    background: transparent;
    border-radius: 999px;
  }

  .ftg-profile-avatar svg {
    width: 19px;
    height: 19px;
    display: block;
  }

  .ftg-hamburger {
    width: 18px;
    height: 14px;
    position: relative;
    display: inline-block;
  }

  .ftg-hamburger span {
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    border-radius: 999px;
    background: var(--ftg-text);
    transition: transform .22s ease, opacity .18s ease, top .22s ease, bottom .22s ease;
    transform-origin: center;
  }

  .ftg-hamburger span:nth-child(1) { top: 0; }
  .ftg-hamburger span:nth-child(2) { top: 6px; }
  .ftg-hamburger span:nth-child(3) { bottom: 0; }

  .ftg-icon-btn.is-open .ftg-hamburger span:nth-child(1) {
    top: 6px;
    transform: rotate(45deg);
  }

  .ftg-icon-btn.is-open .ftg-hamburger span:nth-child(2) {
    opacity: 0;
  }

  .ftg-icon-btn.is-open .ftg-hamburger span:nth-child(3) {
    bottom: 6px;
    transform: rotate(-45deg);
  }

  .ftg-topbar-row-2 {
    display: grid;
    grid-template-columns: minmax(0,1fr);
  }

  .ftg-topbar.menu-open {
    z-index: 10130;
    background: transparent;
    border-bottom-color: transparent;
    box-shadow: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    pointer-events: none;
  }

  .ftg-topbar.menu-open .ftg-brand,
  .ftg-topbar.menu-open .ftg-topbar-row-2,
  .ftg-topbar.menu-open .ftg-account-btn {
    opacity: 0;
    pointer-events: none;
  }

  .ftg-topbar.menu-open .ftg-icon-btn,
  .ftg-topbar.menu-open .ftg-topbar-actions {
    pointer-events: auto;
  }

  .ftg-pill-scroller {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    scroll-snap-type: x proximity;
    padding-bottom: 2px;
  }

  .ftg-pill-scroller::-webkit-scrollbar {
    display: none;
  }

  .ftg-nav-pill {
    flex: 0 0 auto;
    min-height: 38px;
    padding: 0 10px;
    border-radius: 999px;
    border: 2px solid transparent;
    background: transparent;
    color: var(--ftg-text);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -.02em;
    cursor: pointer;
    scroll-snap-align: start;
    white-space: nowrap;
    box-shadow: none;
    transition: background .18s ease, color .18s ease, transform .18s ease, box-shadow .18s ease, opacity .18s ease, border-color .18s ease;
    opacity: .72;
  }

  .ftg-nav-pill:hover {
    color: var(--ftg-text);
    opacity: 1;
  }

  .ftg-nav-pill:active {
    transform: scale(.985);
  }

  .ftg-nav-pill.active {
    min-height: 42px;
    padding: 0 16px;
    background: #fff;
    border: 2px solid var(--ftg-orange);
    color: var(--ftg-text);
    opacity: 1;
    box-shadow: none;
  }

  .ftg-nav-pill-emoji {
    width: 18px;
    height: 18px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: currentColor;
    background: transparent;
    box-shadow: none;
    flex: 0 0 18px;
  }

  .ftg-nav-pill-emoji svg {
    width: 18px;
    height: 18px;
    display: block;
    stroke: currentColor;
  }

  .ftg-nav-pill-emoji img {
    width: 18px;
    height: 18px;
    display: block;
    object-fit: contain;
  }

  .ftg-nav-pill.active .ftg-nav-pill-emoji {
    width: 22px;
    height: 22px;
    flex-basis: 22px;
    background: transparent;
    box-shadow: none;
  }

  .ftg-nav-pill.active .ftg-nav-pill-emoji svg {
    width: 16px;
    height: 16px;
  }

  .ftg-nav-pill.active .ftg-nav-pill-emoji img {
    width: 16px;
    height: 16px;
  }

  .ftg-menu-panel {
    position: fixed;
    inset: 0;
    z-index: 10120;
    display: none;
    flex-direction: column;
    background: rgba(255,255,255,.985);
    backdrop-filter: blur(18px) saturate(1.08);
    -webkit-backdrop-filter: blur(18px) saturate(1.08);
  }

  .ftg-menu-panel.open {
    display: flex;
  }

  .ftg-menu-panel-shell {
    width: 100%;
    max-width: 1320px;
    margin: 0 auto;
    min-height: 100vh;
    padding: calc(18px + var(--ftg-safe-top)) 16px 26px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .ftg-menu-panel-head {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 16px;
  }

  .ftg-menu-panel-title {
    min-width: 0;
    font-size: 30px;
    line-height: 1;
    letter-spacing: -.05em;
    font-weight: 950;
    color: var(--ftg-text);
  }

  .ftg-menu-panel-title .go {
    color: var(--ftg-orange);
  }

  .ftg-menu-panel-title .dotcom {
    color: var(--ftg-text);
  }

  

  .ftg-menu-list {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    width: 100%;
    max-width: 440px;
  }

  .ftg-menu-item {
    min-height: 44px;
    width: 100%;
    border: 0;
    background: transparent;
    color: var(--ftg-text);
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    padding: 0;
    font-size: 18px;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
  }

  .ftg-menu-item:hover {
    color: var(--ftg-text);
  }

  .ftg-menu-item-main {
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }

  .ftg-menu-flag {
    font-size: 18px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 20px;
    flex: 0 0 20px;
  }

  .ftg-menu-section-title {
    margin: 18px 0 6px;
    font-size: 13px;
    line-height: 1.2;
    letter-spacing: .14em;
    text-transform: uppercase;
    font-weight: 800;
    color: var(--ftg-text-soft);
  }

  .ftg-menu-main,
  .ftg-language-panel {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    width: 100%;
    max-width: 440px;
  }

  .ftg-language-panel {
    display: none;
    gap: 4px;
  }

  .ftg-menu-panel.is-language-mode .ftg-menu-main {
    display: none;
  }

  .ftg-menu-panel.is-language-mode .ftg-language-panel {
    display: flex;
  }

  

  .ftg-language-list {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    width: 100%;
  }

  .ftg-language-option {
    min-height: 46px;
    width: 100%;
    border: 0;
    background: transparent;
    color: var(--ftg-text);
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    padding: 0;
    font-size: 22px;
    line-height: 1.1;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
  }

  .ftg-language-option.active {
    color: var(--ftg-text);
    font-weight: 800;
  }

  .ftg-language-option .ftg-menu-flag {
    font-size: 22px;
  }

  .ftg-ai-panel {
    position: fixed;
    top: calc(var(--ftg-header-height) + 8px);
    right: 14px;
    width: min(380px, calc(100vw - 28px));
    max-height: min(70vh, 620px);
    z-index: 10090;
    display: none;
    flex-direction: column;
    overflow: hidden;
    border-radius: 26px;
    border: 1px solid rgba(12,24,44,.08);
    background: rgba(255,255,255,.96);
    box-shadow: var(--ftg-shadow-strong);
    backdrop-filter: blur(18px) saturate(1.08);
    -webkit-backdrop-filter: blur(18px) saturate(1.08);
  }

  .ftg-ai-panel.open {
    display: flex;
  }

  .ftg-ai-head {
    padding: 14px;
    border-bottom: 1px solid var(--ftg-line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .ftg-ai-head-copy { min-width: 0; }
  .ftg-ai-title { font-size: 15px; font-weight: 900; letter-spacing: -.03em; color: var(--ftg-text); }
  .ftg-ai-subtitle { margin-top: 3px; font-size: 12px; color: var(--ftg-text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .ftg-ai-close {
    width: 34px;
    height: 34px;
    border-radius: 999px;
    border: 1px solid var(--ftg-line);
    background: #fff;
    color: var(--ftg-text);
    font-size: 18px;
    font-weight: 900;
    cursor: pointer;
  }

  .ftg-ai-messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .ftg-ai-msg {
    max-width: 88%;
    padding: 10px 12px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.35;
    white-space: pre-line;
    word-break: break-word;
  }

  .ftg-ai-msg.user {
    margin-left: auto;
    background: var(--ftg-primary);
    color: #fff;
    border-bottom-right-radius: 8px;
  }

  .ftg-ai-msg.bot {
    margin-right: auto;
    background: #f4f7fb;
    color: var(--ftg-text);
    border-bottom-left-radius: 8px;
  }

  .ftg-ai-suggestions {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 0 12px 10px;
  }

  .ftg-ai-suggestions::-webkit-scrollbar { display: none; }

  .ftg-ai-suggestion {
    flex: 0 0 auto;
    min-height: 34px;
    padding: 0 12px;
    border-radius: 999px;
    border: 1px solid var(--ftg-line);
    background: #fff;
    color: var(--ftg-text);
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    white-space: nowrap;
  }

  .ftg-ai-input-row {
    display: flex;
    gap: 8px;
    padding: 10px;
    border-top: 1px solid var(--ftg-line);
    background: rgba(255,255,255,.88);
  }

  .ftg-ai-input {
    flex: 1;
    min-width: 0;
    min-height: 42px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.22);
    background: #fff;
    padding: 0 14px;
    color: var(--ftg-text);
    font-size: 14px;
    outline: none;
  }

  .ftg-ai-send {
    width: 42px;
    height: 42px;
    border-radius: 999px;
    border: 0;
    background: var(--ftg-primary);
    color: #fff;
    font-weight: 900;
    cursor: pointer;
  }

  @media (max-width: 760px) {
    :root {
      --ftg-header-height: calc(98px + env(safe-area-inset-top));
    }

    .ftg-topbar-shell {
      padding: 9px 12px 9px;
      gap: 8px;
    }

    .ftg-topbar-row-1 {
      grid-template-columns: minmax(0,1fr) auto;
      gap: 10px;
    }

    .ftg-brand-title {
      font-size: 24px;
    }

    .ftg-account-btn,
    .ftg-icon-btn {
      width: 40px;
      height: 40px;
    }

    .ftg-nav-pill {
      min-height: 36px;
      padding: 0 8px;
      font-size: 13px;
      color: var(--ftg-text);
    }

    .ftg-nav-pill.active {
      min-height: 40px;
      padding: 0 14px;
    }

    .ftg-menu-panel-shell {
      padding: calc(16px + var(--ftg-safe-top)) 12px 22px;
      gap: 16px;
    }

    .ftg-menu-panel-title {
      font-size: 26px;
    }

    .ftg-menu-list {
      max-width: 100%;
    }

    .ftg-menu-item {
      font-size: 17px;
    }

    .ftg-ai-panel {
      left: 12px;
      right: 12px;
      width: auto;
    }
  }
</style>

<script src="site-analytics.js?v=3"></script>

<script>
(function () {
  "use strict";

  function mountGlobalActionbar(targetRoot, passedConfig) {
    var config = passedConfig || window.FTG_ACTIONBAR_CONFIG || {};
    var activePage = config.activePage || "";
    var userName = config.userName || "Guest";
    var isLoggedIn = Boolean(config.isLoggedIn);
    var aiTitle = config.aiTitle || "Ask 5TerreGo";
    var aiSubtitle = config.aiSubtitle || "Fast travel helper";
    var aiWelcome = config.aiWelcome || "Nuova actionbar a due righe attiva.";
    var basePath = typeof config.basePath === "string" ? config.basePath.trim() : "";
    var currentLanguage = String(config.language || "en").toLowerCase();
    var androidAppHref = config.androidAppHref || "#";
    var privacyHref = config.privacyHref || "#privacy";
    var termsHref = config.termsHref || "#terms";
    var root = targetRoot || document.getElementById("ftg-global-actionbar-root");
    var welcomed = false;

    if (!root) return null;

    root.innerHTML = "";
    document.body.classList.add("ftg-actionbar-enabled");

    var languages = config.languages || [
      { code: "en", label: "English", flag: "🇬🇧" },
      { code: "it", label: "Italiano", flag: "🇮🇹" },
      { code: "fr", label: "Français", flag: "🇫🇷" },
      { code: "de", label: "Deutsch", flag: "🇩🇪" },
      { code: "zh", label: "中文", flag: "🇨🇳" }
    ];

    var menuItems = config.menuItems || [
      { id: "map", labelKey: "nav_map", label: "Map", href: "map.html" },
      { id: "stories", labelKey: "nav_stories", label: "Stories", href: "index.html" },

      { id: "weather", labelKey: "nav_weather", label: "Weather", href: "weather.html" },    ];

    activePage = resolveActivePage(activePage);

    var translations = {
      en: {
        download_android: "Download the Android app",

        privacy: "Privacy Policy",
        terms: "Terms & Conditions",

      },

      }
    };

    function escapeHTML(value) {
      return String(value || "").replace(/[&<>\"]/g, function (char) {
        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[char];
      });
    }

    function resolveHref(href) {
      var value = String(href || "").trim();
      if (!value) return "";
      if (/^(https?:|mailto:|tel:|#|\/)/i.test(value)) return value;
      return value;
    }

    function resolveActivePage(preferredPage) {
      var pathname = String(window.location.pathname || "").toLowerCase();
      var fileName = pathname.split("/").pop() || "index.html";
      var mapByFile = {
        "index.html": "stories",
        "map.html": "map",
        "sentieri.html": "sentieri",
        "discounts.html": "discounts",
        "public-transport.html": "trains",
        "weather.html": "weather",
        "updates.html": "updates"
      };
      return mapByFile[fileName] || preferredPage || "stories";
    }

    function t(key, fallback) {
      var group = translations[currentLanguage] || translations.en || {};
      return group[key] || fallback || key;
    }

    function getLanguageMeta(code) {
      var match = languages.find(function (lang) {
        return String(lang.code || "").toLowerCase() === String(code || "").toLowerCase();
      });
      return match || languages[0] || { code: "en", label: "English", flag: "🇬🇧" };
    }

    function renderIconMarkup(id) {
      if (id === "sentieri") {
        return '<img src="https://raw.githubusercontent.com/hfg-gmuend/openmoji/master/color/618x618/1F45F.png" alt="" aria-hidden="true">';
      }

      var icons = {
        map: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 4.5 15 2l6 2.5v15L15 22l-6-2.5L3 22V7z" stroke-width="1.8" stroke-linejoin="round"></path><path d="M9 4.5v15" stroke-width="1.8"></path><path d="M15 2v20" stroke-width="1.8"></path></svg>',
        stories: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="3" stroke-width="1.8"></rect><path d="M9 8h6M9 12h6M9 16h4" stroke-width="1.8" stroke-linecap="round"></path></svg>',
        discounts: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 8.5V6a2 2 0 0 1 2-2h8.8a2 2 0 0 1 1.4.6l3.2 3.2A2 2 0 0 1 20 9.2V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2.5" stroke-width="1.8" stroke-linejoin="round"></path><circle cx="8" cy="8" r="1.25" stroke-width="1.8"></circle><path d="m9.5 14.5 5-5" stroke-width="1.8" stroke-linecap="round"></path></svg>',
        trains: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="6" y="3.5" width="12" height="12" rx="3" stroke-width="1.8"></rect><path d="M8.5 18.5 7 21M15.5 18.5 17 21M8 10h8" stroke-width="1.8" stroke-linecap="round"></path><circle cx="9" cy="13" r="1" fill="currentColor" stroke="none"></circle><circle cx="15" cy="13" r="1" fill="currentColor" stroke="none"></circle></svg>',
        weather: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke-width="1.8"></circle><path d="M12 2.5v2.2M12 19.3v2.2M21.5 12h-2.2M4.7 12H2.5M18.7 5.3l-1.5 1.5M6.8 17.2l-1.5 1.5M18.7 18.7l-1.5-1.5M6.8 6.8 5.3 5.3" stroke-width="1.8" stroke-linecap="round"></path></svg>',
        updates: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4.5 5 8v4.8c0 3.4 2.2 6.6 7 8.7 4.8-2.1 7-5.3 7-8.7V8z" stroke-width="1.8" stroke-linejoin="round"></path><path d="M12 9v4M12 16h.01" stroke-width="1.8" stroke-linecap="round"></path></svg>'
      };
      return icons[id] || '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke-width="1.8"></circle></svg>';
    }

    function buildNavPill(item) {
      var active = item.id === activePage;
      var label = t(item.labelKey || "", item.label || item.id || "");
      var href = resolveHref(item.href || "");
      return '<a class="ftg-nav-pill' + (active ? ' active' : '') + '" href="' + escapeHTML(href) + '" data-page-target="' + escapeHTML(item.id) + '"><span class="ftg-nav-pill-emoji">' + renderIconMarkup(item.id) + '</span><span>' + escapeHTML(label) + '</span></a>';
    }

    function buildLanguageOptions() {
      return languages.map(function (lang) {
        var active = String(lang.code || "").toLowerCase() === currentLanguage;
        return '<button class="ftg-language-option' + (active ? ' active' : '') + '" type="button" data-language-code="' + escapeHTML(lang.code || '') + '"><span class="ftg-menu-flag">' + escapeHTML(lang.flag || '🏳️') + '</span><span>' + escapeHTML(lang.label || lang.code || '') + '</span></button>';
      }).join("");
    }

    root.innerHTML = '<header class="ftg-topbar" id="ftg-topbar"><div class="ftg-topbar-shell"><div class="ftg-topbar-row-1"><div class="ftg-brand"><div class="ftg-brand-title">5Terre<span class="go">Go</span><span class="dotcom">.com</span></div></div><div class="ftg-topbar-actions"><button class="ftg-account-btn" type="button" id="ftg-account-btn" aria-label="Open login"><span class="ftg-profile-avatar"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="4.2" stroke="currentColor" stroke-width="1.8"></circle><path d="M4.5 20c1.8-3.7 5-5.5 7.5-5.5s5.7 1.8 7.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg></span></button><button class="ftg-icon-btn" type="button" id="ftg-menu-trigger" aria-label="Open menu"><span class="ftg-hamburger"><span></span><span></span><span></span></span></button></div></div><div class="ftg-topbar-row-2"><div class="ftg-pill-scroller" id="ftg-pill-scroller"></div></div></div></header><div class="ftg-menu-panel" id="ftg-menu-panel" aria-hidden="true"><div class="ftg-menu-panel-shell"><div class="ftg-menu-panel-head"><div class="ftg-menu-panel-title">5Terre<span class="go">Go</span><span class="dotcom">.com</span></div></div><div class="ftg-menu-main"><div class="ftg-menu-list"><button class="ftg-menu-item" type="button" id="ftg-language-menu-item"><span class="ftg-menu-item-main"><span class="ftg-menu-flag" id="ftg-language-menu-flag">🇬🇧</span><span id="ftg-language-menu-label">English</span></span></button><a class="ftg-menu-item" href="' + escapeHTML(androidAppHref) + '" id="ftg-android-app-link" style="display:none"><span class="ftg-menu-item-main"><span id="ftg-android-app-label">Scarica l app per Android</span></span></a><div class="ftg-menu-section-title" id="ftg-legal-title">Area legale</div><a class="ftg-menu-item" href="' + escapeHTML(privacyHref) + '"><span class="ftg-menu-item-main"><span id="ftg-privacy-label">Informativa sulla privacy</span></span></a><a class="ftg-menu-item" href="' + escapeHTML(termsHref) + '"><span class="ftg-menu-item-main"><span id="ftg-terms-label">Terms &amp; Conditions</span></span></a></div></div><div class="ftg-language-panel"><div class="ftg-menu-section-title" id="ftg-language-title">Choose language</div><div class="ftg-language-list" id="ftg-language-list"></div></div></div></div><div class="ftg-ai-panel" id="ftg-ai-panel" aria-hidden="true"><div class="ftg-ai-head"><div class="ftg-ai-head-copy"><div class="ftg-ai-title">' + escapeHTML(aiTitle) + '</div><div class="ftg-ai-subtitle">' + escapeHTML(aiSubtitle) + '</div></div><button class="ftg-ai-close" id="ftg-ai-close" type="button" aria-label="Close AI">×</button></div><div class="ftg-ai-messages" id="ftg-ai-messages"></div><div class="ftg-ai-suggestions"><button class="ftg-ai-suggestion" type="button">best village for one day</button><button class="ftg-ai-suggestion" type="button">which trail is open today</button><button class="ftg-ai-suggestion" type="button">how do I move by train</button></div><div class="ftg-ai-input-row"><input id="ftg-ai-input" class="ftg-ai-input" placeholder="Ask something fast..." autocomplete="off"><button id="ftg-ai-send" class="ftg-ai-send" type="button">→</button></div></div>';

    var topbar = root.querySelector("#ftg-topbar");
    var pillScroller = root.querySelector("#ftg-pill-scroller");
    var accountBtn = root.querySelector("#ftg-account-btn");
    var menuTrigger = root.querySelector("#ftg-menu-trigger");
    var menuPanel = root.querySelector("#ftg-menu-panel");
    var languageMenuItem = root.querySelector("#ftg-language-menu-item");
    var languageMenuFlag = root.querySelector("#ftg-language-menu-flag");
    var languageMenuLabel = root.querySelector("#ftg-language-menu-label");
    var languageTitle = root.querySelector("#ftg-language-title");
    var languageList = root.querySelector("#ftg-language-list");
    var legalTitle = root.querySelector("#ftg-legal-title");
    var privacyLabel = root.querySelector("#ftg-privacy-label");
    var termsLabel = root.querySelector("#ftg-terms-label");
    var androidAppLink = root.querySelector("#ftg-android-app-link");
    var androidAppLabel = root.querySelector("#ftg-android-app-label");
    var aiPanel = root.querySelector("#ftg-ai-panel");
    var aiClose = root.querySelector("#ftg-ai-close");
    var aiMessages = root.querySelector("#ftg-ai-messages");
    var aiInput = root.querySelector("#ftg-ai-input");
    var aiSend = root.querySelector("#ftg-ai-send");
    var aiSuggestions = Array.prototype.slice.call(root.querySelectorAll(".ftg-ai-suggestion"));
    var pillButtons = [];

    function syncActiveButtons(pageId) {
      activePage = pageId;
      pillButtons.forEach(function (button) {
        button.classList.toggle("active", button.getAttribute("data-page-target") === pageId);
      });
    }

    function maybeMarkScrolled() {
      if (!topbar) return;
      topbar.classList.toggle("is-scrolled", window.scrollY > 10);
    }

    function syncMenuVisualState() {
      var isOpen = menuPanel && menuPanel.classList.contains("open");
      var isLanguageMode = menuPanel && menuPanel.classList.contains("is-language-mode");

      if (menuTrigger) {
        menuTrigger.classList.toggle("is-open", isOpen);
        menuTrigger.setAttribute("aria-label", isOpen ? (isLanguageMode ? "Close language selector" : "Close menu") : "Open menu");
      }

      if (topbar) {
        topbar.classList.toggle("menu-open", isOpen);
      }
    }

    function openMenu() {
      if (!menuPanel) return;
      menuPanel.classList.add("open");
      menuPanel.classList.remove("is-language-mode");
      menuPanel.setAttribute("aria-hidden", "false");
      document.body.classList.add("ftg-menu-open");
      syncMenuVisualState();
    }

    function closeMenu() {
      if (!menuPanel) return;
      menuPanel.classList.remove("open");
      menuPanel.classList.remove("is-language-mode");
      menuPanel.setAttribute("aria-hidden", "true");
      document.body.classList.remove("ftg-menu-open");
      syncMenuVisualState();
    }

    function openLanguagePanel() {
      if (!menuPanel) return;
      menuPanel.classList.add("open");
      menuPanel.classList.add("is-language-mode");
      menuPanel.setAttribute("aria-hidden", "false");
      document.body.classList.add("ftg-menu-open");
      syncMenuVisualState();
    }

    function closeLanguagePanel() {
      if (!menuPanel) return;
      menuPanel.classList.remove("is-language-mode");
      syncMenuVisualState();
    }

    function navigateTo(itemId, href) {
      var finalHref = resolveHref(href || "");
      closeMenu();
      if (finalHref) {
        window.location.href = finalHref;
      }
    }

    function addAIMessage(text, isUser) {
      if (!aiMessages) return;
      var div = document.createElement("div");
      div.className = "ftg-ai-msg " + (isUser ? "user" : "bot");
      div.innerText = text;
      aiMessages.appendChild(div);
      aiMessages.scrollTop = aiMessages.scrollHeight;
    }

    function toggleAI(forceOpen) {
      if (!aiPanel) return;
      var shouldOpen = typeof forceOpen === "boolean" ? forceOpen : !aiPanel.classList.contains("open");
      aiPanel.classList.toggle("open", shouldOpen);
      aiPanel.setAttribute("aria-hidden", shouldOpen ? "false" : "true");
      if (shouldOpen && !welcomed) {
        welcomed = true;
        addAIMessage(aiWelcome, false);
      }
    }

    function handleAISend(textFromButton) {
      var text = String(textFromButton || (aiInput && aiInput.value) || "").trim();
      if (!text) return;
      addAIMessage(text, true);
      if (aiInput) aiInput.value = "";
      window.setTimeout(function () {
        addAIMessage("Active section: " + activePage + ". Questa topbar a due righe tiene brand e controlli sopra, pillole pagina sotto.", false);
      }, 120);
    }

    function bindPillEvents() {
      pillButtons = Array.prototype.slice.call(root.querySelectorAll("[data-page-target]"));
    }

    function rebuildPills() {
      if (!pillScroller) return;
      pillScroller.innerHTML = menuItems.map(buildNavPill).join("");
      bindPillEvents();
    }

    function rebuildLanguageList() {
      if (!languageList) return;
      languageList.innerHTML = buildLanguageOptions();
      Array.prototype.slice.call(languageList.querySelectorAll("[data-language-code]")).forEach(function (button) {
        button.addEventListener("click", function (event) {
          event.preventDefault();
          event.stopPropagation();
          currentLanguage = String(button.getAttribute("data-language-code") || "en").toLowerCase();
          applyTranslations();
          closeLanguagePanel();
          if (typeof config.onLanguageChange === "function") {
            config.onLanguageChange(currentLanguage);
          }
        });
      });
    }

    function updateMenuDynamicItems() {
      var languageMeta = getLanguageMeta(currentLanguage);
      if (languageMenuFlag) languageMenuFlag.innerText = languageMeta.flag || "🏳️";
      if (languageMenuLabel) languageMenuLabel.innerText = languageMeta.label || languageMeta.code || "Language";
      if (languageTitle) languageTitle.innerText = t("choose_language", "Choose language");
      if (legalTitle) legalTitle.innerText = t("legal_title", "Legal area");
      if (privacyLabel) privacyLabel.innerText = t("privacy", "Privacy Policy");
      if (termsLabel) termsLabel.innerText = t("terms", "Terms & Conditions");
      if (androidAppLabel) androidAppLabel.innerText = t("download_android", "Download the Android app");
      if (androidAppLink) {
        var isAndroid = /android/i.test(navigator.userAgent || "");
        androidAppLink.style.display = isAndroid ? "flex" : "none";
      }
    }

    function applyTranslations() {
      rebuildPills();
      rebuildLanguageList();
      updateMenuDynamicItems();
    }

    if (accountBtn) {
      accountBtn.addEventListener("click", function () {
        window.location.href = resolveHref("login.html");
      });
    }

    if (menuPanel) {
      menuPanel.addEventListener("click", function (event) {
        event.stopPropagation();
      });
    }

    if (menuTrigger && menuPanel) {
      menuTrigger.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        var isOpen = menuPanel.classList.contains("open");
        var isLanguageMode = menuPanel.classList.contains("is-language-mode");

        if (!isOpen) {
          openMenu();
          return;
        }

        if (isLanguageMode) {
          closeLanguagePanel();
          return;
        }

        closeMenu();
      });
    }

    if (languageMenuItem) {
      languageMenuItem.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        openLanguagePanel();
      });
    }

    if (aiClose) {
      aiClose.addEventListener("click", function () {
        toggleAI(false);
      });
    }

    if (aiSend) {
      aiSend.addEventListener("click", function () {
        handleAISend();
      });
    }

    if (aiInput) {
      aiInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") handleAISend();
      });
    }

    aiSuggestions.forEach(function (button) {
      button.addEventListener("click", function () {
        handleAISend(button.innerText);
      });
    });

    window.addEventListener("scroll", maybeMarkScrolled, { passive: true });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        toggleAI(false);
        closeMenu();
      }
    });

    document.addEventListener("click", function (event) {
      if (!menuPanel || !menuTrigger) return;
      if (!menuPanel.classList.contains("open")) return;
      if (!menuPanel.contains(event.target) && !menuTrigger.contains(event.target)) {
        closeMenu();
      }
    });

    applyTranslations();
    syncMenuVisualState();
    maybeMarkScrolled();

    var api = {
      navigateToPage: function (pageId) {
        var match = menuItems.find(function (item) { return item.id === pageId; }) || {};
        navigateTo(pageId, match.href || "");
      },
      toggleAI: toggleAI,
      getCurrentPage: function () { return activePage; },
      setActivePage: function (pageId) {
        activePage = pageId;
        rebuildPills();
      },
      remount: function (nextRoot, nextConfig) { return mountGlobalActionbar(nextRoot || root, nextConfig || config); }
    };

    window.FTG_GLOBAL_ACTIONBAR = api;
    return api;
  }

  window.FTG_MOUNT_GLOBAL_ACTIONBAR = mountGlobalActionbar;

  var standaloneRoot = document.getElementById("ftg-global-actionbar-root");
  if (standaloneRoot && !standaloneRoot.childElementCount) {
    mountGlobalActionbar(standaloneRoot, window.FTG_ACTIONBAR_CONFIG || {});
  }
}());
</script>
