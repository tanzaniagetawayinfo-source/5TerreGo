*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#05070a;color:#fff}
.header{position:sticky;top:0;background:#05070a;padding:16px;display:flex;gap:10px;align-items:center;z-index:10}
.search{flex:1;min-width:0;padding:14px 16px;border-radius:16px;border:1px solid rgba(255,255,255,0.12);background:linear-gradient(180deg,rgba(255,255,255,0.12),rgba(255,255,255,0.04));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:white;outline:none;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,0.25);transition:all .2s ease}

.add-btn{padding:14px 18px;border-radius:16px;border:none;background:linear-gradient(135deg,#ffffff,#eaeaea);color:black;font-weight:800;cursor:pointer;white-space:nowrap;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,0.3);transition:all .18s ease}
.add-btn:hover{transform:translateY(-1px);box-shadow:0 12px 32px rgba(0,0,0,0.4)}

.status.error{color:#ffb4b4}
.status code{display:inline-block;color:#fff;background:rgba(255,255,255,0.08);padding:3px 6px;border-radius:6px;margin-top:4px;word-break:break-word}
.list{padding:16px}
.poi{position:relative;padding:14px;padding-right:124px;border-radius:14px;background:rgba(255,255,255,0.06);margin-bottom:10px;border:1px solid rgba(255,255,255,0.08);cursor:pointer;transition:transform .15s ease,background .15s ease}
.poi-alert{position:absolute;right:10px;max-width:112px;padding:5px 7px;border-radius:999px;font-size:9px;font-weight:800;line-height:1;text-align:center;text-transform:uppercase;letter-spacing:.01em;pointer-events:none;white-space:nowrap}
.poi-alert.desc{top:10px;background:rgba(255,204,0,0.16);border:1px solid rgba(255,204,0,0.38);color:#ffd966}
.poi-alert.coord{top:10px;background:rgba(255,59,48,0.16);border:1px solid rgba(255,59,48,0.4);color:#ff8a80}
.poi-alert.coord.has-desc{top:36px}
.poi:active{transform:scale(.99);background:rgba(255,255,255,0.09)}
.poi-title{font-weight:700;margin-bottom:4px}
.poi-meta{font-size:13px;color:rgba(255,255,255,0.65);line-height:1.35}
.empty{padding:24px;text-align:center;color:rgba(255,255,255,0.55)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal.is-open{display:flex}
.modal-content{position:relative;background:#0a0c10;border-radius:18px;padding:18px;padding-top:60px;width:100%;max-width:420px;border:1px solid rgba(255,255,255,0.12);max-height:90vh;overflow:auto}
.close-btn{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.08);color:white;font-size:18px;cursor:pointer}
input,select,textarea{width:100%;padding:12px;margin-top:10px;border-radius:12px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.08);color:white;outline:none}
textarea{min-height:90px;resize:vertical}
select option{color:#111}
button.save{width:100%;padding:14px;margin-top:14px;border-radius:12px;border:none;background:white;color:black;font-weight:800;cursor:pointer}
button.delete{width:100%;padding:14px;margin-top:10px;border-radius:12px;border:none;background:#ff3b30;color:white;font-weight:800;cursor:pointer}
.range-card{margin-top:10px;padding:13px 12px 12px;border-radius:16px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.07)}
.range-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13px;color:rgba(255,255,255,0.68)}
.range-value{min-width:46px;text-align:center;padding:5px 10px;border-radius:999px;background:white;color:black;font-weight:800;font-size:13px}
.apple-range{appearance:none;-webkit-appearance:none;width:100%;height:30px;margin:0;padding:0;border:none;background:transparent;outline:none;cursor:pointer}
.apple-range::-webkit-slider-runnable-track{height:8px;border-radius:999px;background:linear-gradient(90deg,#fff var(--range-progress,50%),rgba(255,255,255,0.18) var(--range-progress,50%))}
.apple-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;border-radius:50%;background:white;margin-top:-10px;box-shadow:0 4px 14px rgba(0,0,0,0.38);border:1px solid rgba(0,0,0,0.08)}
.apple-range::-moz-range-track{height:8px;border-radius:999px;background:rgba(255,255,255,0.18)}
.apple-range::-moz-range-progress{height:8px;border-radius:999px;background:white}
.apple-range::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:white;box-shadow:0 4px 14px rgba(0,0,0,0.38);border:1px solid rgba(0,0,0,0.08)}

/* TASK SLIDER */
.task-slider{display:flex;gap:10px;overflow-x:auto;padding:12px 16px 4px;scroll-snap-type:x mandatory}
.task-slider::-webkit-scrollbar{display:none}
.task-card{position:relative;flex:0 0 auto;min-width:140px;max-width:160px;padding:12px;padding-top:34px;border-radius:14px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);scroll-snap-align:start;cursor:pointer}
.task-card:active{transform:scale(.98)}
.task-title{font-weight:700;font-size:13px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-pill{font-size:9px;padding:4px 7px;border-radius:999px;background:rgba(255,204,0,0.16);border:1px solid rgba(255,204,0,0.38);color:#ffd966;display:inline-block;font-weight:800;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;line-height:1;margin-right:4px;margin-top:4px}
.task-coin{position:absolute;top:4px;right:8px;z-index:2;font-size:10px;padding:4px 7px;border-radius:999px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.18);font-weight:900}

.dev-game-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.dev-game-rank{font-size:18px;font-weight:900;line-height:1.15}
.dev-game-score{text-align:right;font-size:12px;color:rgba(255,255,255,0.66);white-space:nowrap}
.dev-game-score strong{display:block;color:#fff;font-size:18px;line-height:1.15}
.dev-game-bar{height:9px;border-radius:999px;background:rgba(255,255,255,0.11);overflow:hidden}
.dev-game-fill{height:100%;width:0%;border-radius:999px;background:#fff;transition:width .35s ease}
.dev-game-foot{display:flex;justify-content:space-between;gap:10px;margin-top:9px;font-size:11px;color:rgba(255,255,255,0.6)}

.dev-game-badge{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.10);font-size:10px;font-weight:800;color:rgba(255,255,255,0.75)}
.coins-button{position:absolute;top:10px;left:14px;padding:8px 12px;border-radius:10px;border:none;background:white;color:black;font-weight:800;cursor:pointer}
</style>

const DEV_LEVELS = [

  { min: 20, title: "Livello 1 · Turista a caso", badge: "Perso totale" },
  { min: 50, title: "Livello 2 · Amatoriale", badge: "Ci provi" },

function setStatus(message, isError = false){
  statusEl.innerHTML = message;
  statusEl.classList.toggle("error", Boolean(isError));
}

function getDevLevel(metric){
  let current = DEV_LEVELS[0];
  let next = null;

  for(let i = 0; i < DEV_LEVELS.length; i++){
    if(metric >= DEV_LEVELS[i].min){
      current = DEV_LEVELS[i];
      next = DEV_LEVELS[i + 1] || null;
    }
  }

  return { current, next };
}

function calculateCoins(){
  let coins = 0;

  pois.forEach(p=>{
    const missing = getMissingPoiFields(p);
    if(missing.length === 0) coins += 5;
    if(missing.length === 1) coins += 2;
    if(missing.length === 2) coins += 1;
  });

  return coins;
}

function calculateTaskCoins(){
  let taskCoins = 0;

  pois.forEach(p=>{
    const missing = getMissingPoiFields(p);
    if(missing.includes("descrizione")) taskCoins += 2;
    if(missing.includes("coordinate")) taskCoins += 2;
  });

  return taskCoins;
}

function openLevelsModal(){
  const container = document.getElementById("levelsList");
  const poiCoins = calculateCoins();
  const taskCoins = calculateTaskCoins();
  const score = poiCoins + taskCoins;

  container.innerHTML = "";

  DEV_LEVELS.forEach((l,i)=>{
    const div = document.createElement("div");
    div.style.padding = "10px 0";
    div.style.borderBottom = "1px solid rgba(255,255,255,0.1)";

    const next = DEV_LEVELS[i + 1];
    const currentMin = l.min;
    const nextMin = next ? next.min : currentMin + 100;
    const progress = Math.max(0, Math.min(100, ((score - currentMin) / (nextMin - currentMin)) * 100));

    const title = document.createElement("div");
    title.innerHTML = "<strong>" + l.title + "</strong> — " + l.min + " 🪙";

    const bar = document.createElement("div");
    bar.style.height = "6px";
    bar.style.borderRadius = "999px";
    bar.style.background = "rgba(255,255,255,0.1)";
    bar.style.marginTop = "6px";

    const fill = document.createElement("div");
    fill.style.height = "100%";
    fill.style.width = progress + "%";
    fill.style.borderRadius = "999px";
    fill.style.background = "white";

    bar.appendChild(fill);
    div.appendChild(title);
    div.appendChild(bar);
    container.appendChild(div);
  });

  document.getElementById("levelsModal").classList.add("is-open");
}

}

function closeLevelsModal(){

function updateDevGame(){
  const totalPois = Array.isArray(pois) ? pois.length : 0;
  const poiCoins = calculateCoins();
  const taskCoins = calculateTaskCoins();
  const score = poiCoins + taskCoins;
  const level = getDevLevel(score);
  const currentMin = level.current.min;
  const nextMin = level.next ? level.next.min : score;
  const range = Math.max(1, nextMin - currentMin);
  const progress = level.next ? Math.max(0, Math.min(100, ((score - currentMin) / range) * 100)) : 100;
  const remaining = level.next ? Math.max(0, nextMin - score) : 0;

  devRankEl.innerText = level.current.title;
  devScoreEl.innerText = String(score) + " 🪙";
  devFillEl.style.width = progress + "%";
  devProgressEl.innerHTML = "<strong>" + totalPois + "</strong> POI • " + poiCoins + "🪙 POI • " + taskCoins + "🪙 task";
  devNextEl.innerText = level.next ? (remaining + " 🪙 al prossimo livello") : "Livello massimo sbloccato";
  devBadgeEl.innerText = level.current.badge;
}

function getAuthSession(){
  for(const key of Object.keys(localStorage)){
    if(key.startsWith("sb-") && key.endsWith("-auth-token")){
      try{
        const parsed = JSON.parse(localStorage.getItem(key));
        if(parsed && parsed.access_token) return parsed;
        if(parsed && parsed.currentSession && parsed.currentSession.access_token) return parsed.currentSession;
      }catch(err){
        console.warn("Auth token non leggibile", err);
      }
    }
  }
  return null;
}

function getToken(){
  const session = getAuthSession();
  return session && session.access_token ? session.access_token : null;
}

function getUserEmail(){
  const session = getAuthSession();
  return String((session && session.user && session.user.email) || "").toLowerCase();
}

function clampNumber(value, min, max, fallback){
  const n = Number(value);
  if(Number.isNaN(n)) return fallback;
  return Math.max(min, Math.min(max, n));
}

function updateImportanceUI(value = importanceEl.value){
  const safeValue = clampNumber(value, 1, 100, 50);
  const progress = ((safeValue - 1) / 99) * 100;
  importanceEl.value = String(safeValue);
  importanceValueEl.innerText = String(safeValue);
  importanceEl.style.setProperty("--range-progress", progress + "%");
}

function buildHeaders({ useUserToken = false, extra = {} } = {}){
  const token = useUserToken ? getToken() : null;
  return {
    apikey: ANON_KEY,
    Authorization: "Bearer " + (token || ANON_KEY),
    Accept: "application/json",
    "Content-Type": "application/json",
    ...extra
  };
}

async function parseResponse(res){
  const text = await res.text();
  let data = null;

  try{
    data = text ? JSON.parse(text) : null;
  }catch(err){
    data = text;
  }

  if(!res.ok){
    const message = typeof data === "object" && data
      ? (data.message || data.hint || JSON.stringify(data))
      : String(data || res.statusText);
    const error = new Error(message);
    error.payload = data;
    error.status = res.status;
    throw error;
  }

  return data;
}

function isPermissionError(err){
  const text = String((err && err.message) || "") + " " + JSON.stringify((err && err.payload) || {});
  const lower = text.toLowerCase();
  return (err && (err.status === 401 || err.status === 403)) || lower.includes("42501") || lower.includes("permission denied") || lower.includes("grant select");
}

function permissionHelp(){
  return "Errore permessi Supabase.<br><br>Esegui in SQL Editor:<br>" +
    "<code>GRANT SELECT ON public.pois TO anon;</code><br>" +
    "<code>GRANT SELECT, INSERT, UPDATE, DELETE ON public.pois TO authenticated;</code>";
}

async function loadPois(){
  setStatus("Caricamento POI...");

  try{
    const hasUser = Boolean(getToken());
    const res = await fetch(SUPABASE_URL + "/rest/v1/pois?select=*&order=importance.desc.nullslast", {
      method: "GET",
      headers: buildHeaders({ useUserToken: hasUser })
    });

    pois = await parseResponse(res);
    editingPoiId = null;
    renderPois(searchEl.value);
    setStatus(String(pois.length) + " POI caricati");
  }catch(err){
    console.error("LOAD POIS ERROR", err);
    pois = [];
    renderPois(searchEl.value);

    if(isPermissionError(err)){
      setStatus(permissionHelp() + "<br><br>Se sei loggato, la lettura usa il ruolo authenticated; altrimenti usa anon.<br><br>Dettaglio: " + err.message, true);
      return;
    }

    setStatus("Errore caricamento POI: " + err.message, true);
  }
}

function getMissingPoiFields(poi){
  const missingFields = [];
  if(!String((poi && poi.description) || "").trim()) missingFields.push("descrizione");
  if(!String((poi && poi.coords) || "").trim()) missingFields.push("coordinate");
  return missingFields;
}

function hasOnlyMissingDescription(poi){
  const missing = getMissingPoiFields(poi);
  return missing.length === 1 && missing[0] === "descrizione";
}

function getPoiAlertText(poi){
  const missingFields = getMissingPoiFields(poi);
  if(missingFields.length === 0) return "";
  if(missingFields.length === 2) return "manca desc. + coord.";
  return "manca " + missingFields[0];
}

function createTaskPill(text, isRed){
  const pill = document.createElement("div");
  pill.className = isRed ? "task-pill red" : "task-pill";
  pill.innerText = text;
  return pill;
}

function normalizeName(str){
  return String(str || "").toLowerCase().trim();
}

function getMissingCorePois(){
  const existing = pois.map(p=>normalizeName(p.name));
  return REQUIRED_POIS.filter(name=>{
    const n = normalizeName(name);
    return !existing.some(e=>e.includes(n) || n.includes(e));
  });
}

function renderTaskSlider(filteredPois){
  taskSliderEl.innerHTML = "";
  const taskPois = filteredPois.filter((p) => getMissingPoiFields(p).length > 0);

  taskPois.forEach((p) => {
    const missing = getMissingPoiFields(p);
    const card = document.createElement("div");
    card.className = "task-card";
    card.addEventListener("click", () => openModal(p));

    const title = document.createElement("div");
    title.className = "task-title";
    title.innerText = p.name || "(senza nome)";
    card.appendChild(title);

    const taskValue = missing.length * 2;
    const coin = document.createElement("div");
    coin.className = "task-coin";
    coin.innerText = "+" + taskValue + "🪙";
    card.appendChild(coin);

    if(missing.includes("descrizione")) card.appendChild(createTaskPill("manca desc.", false));
    if(missing.includes("coordinate")) card.appendChild(createTaskPill("no coord.", true));
    taskSliderEl.appendChild(card);
  });

  const missingCore = getMissingCorePois();
  missingCore.forEach(name=>{
    const card = document.createElement("div");
    card.className = "task-card";
    card.addEventListener("click", () => openSuggestedPoi(name));

    const title = document.createElement("div");
    title.className = "task-title";
    title.innerText = name;

    const pill = document.createElement("div");
    pill.className = "task-pill red";
    pill.innerText = "poi mancante";

    const coin = document.createElement("div");
    coin.className = "task-coin";
    coin.innerText = "+3🪙";

    card.appendChild(title);
    card.appendChild(pill);
    card.appendChild(coin);
    taskSliderEl.appendChild(card);
  });
}

function renderPois(filter = ""){
  updateDevGame();
  listEl.innerHTML = "";

  const query = String(filter || "").trim().toLowerCase();
  const filtered = pois.filter((p) => {
    const haystack = String((p && p.name) || "") + " " + String((p && p.type) || "") + " " + String((p && p.description) || "");
    return !query || haystack.toLowerCase().includes(query);
  });

  renderTaskSlider(filtered);

  if(!filtered.length){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerText = pois.length ? "Nessun POI trovato" : "Nessun POI disponibile";
    listEl.appendChild(empty);
    return;
  }

  filtered.forEach((p) => {
    const div = document.createElement("div");
    div.className = "poi";
    const missing = getMissingPoiFields(p);

    if(missing.includes("descrizione")){
      const alertBadge = document.createElement("div");
      alertBadge.className = "poi-alert desc";
      alertBadge.innerText = "manca desc.";
      div.appendChild(alertBadge);
    }

    if(missing.includes("coordinate")){
      const alertBadge = document.createElement("div");
      alertBadge.className = missing.includes("descrizione") ? "poi-alert coord has-desc" : "poi-alert coord";
      alertBadge.innerText = "no coord.";
      div.appendChild(alertBadge);
    }

    const title = document.createElement("div");
    title.className = "poi-title";
    title.innerText = p.name || "(senza nome)";

    const meta = document.createElement("div");
    meta.className = "poi-meta";
    meta.innerText = String(p.type || "-") + " • importanza " + String(p.importance ?? "-") + " • sconto " + String(p.discount ?? 0) + "%";

    const desc = document.createElement("div");
    desc.className = "poi-meta";
    desc.innerText = p.description || "";

    div.appendChild(title);
    div.appendChild(meta);
    if(p.description) div.appendChild(desc);
    div.addEventListener("click", () => openModal(p));
    listEl.appendChild(div);
  });
}

function openSuggestedPoi(name){
  editingPoiId = null;
  openModal();
  nameEl.value = name || "";
  modalTitleEl.innerText = "Aggiungi POI";
  deleteBtn.style.display = "none";
}

function openModal(poi = null){
  deleteBtn.style.display = poi ? "block" : "none";
  if(poi){
    editingPoiId = poi.id;
    modalTitleEl.innerText = "Modifica POI";
    nameEl.value = poi.name || "";
    coordsEl.value = poi.coords || "";
    descriptionEl.value = poi.description || "";
    updateImportanceUI(poi.importance ?? 50);
    typeEl.value = poi.type || "chiesa";
    emailsEl.value = poi.emails || "";
    phoneEl.value = poi.phone || "";
    discountEl.value = poi.discount ?? "";
  }else{
    editingPoiId = null;
    modalTitleEl.innerText = "Aggiungi POI";
    clearForm(false);
  }

  modalEl.classList.add("is-open");
  modalEl.setAttribute("aria-hidden", "false");
}

function closeModal(){
  modalEl.classList.remove("is-open");
  modalEl.setAttribute("aria-hidden", "true");
}

function clearForm(resetEditing = true){
  if(resetEditing) editingPoiId = null;
  nameEl.value = "";
  coordsEl.value = "";
  descriptionEl.value = "";
  updateImportanceUI(50);
  typeEl.value = "chiesa";
  emailsEl.value = "";
  phoneEl.value = "";
  discountEl.value = "";
}

function readPoiForm(){
  return {
    name: nameEl.value.trim(),
    coords: coordsEl.value.trim(),
    description: descriptionEl.value.trim(),
    importance: clampNumber(importanceEl.value, 1, 100, 1),
    type: typeEl.value,
    emails: emailsEl.value.trim(),
    phone: phoneEl.value.trim(),
    discount: clampNumber(discountEl.value, 0, 100, 0)
  };
}

function buildPoiSaveRequest(poiId){
  const isEdit = Boolean(poiId);
  return {
    url: isEdit ? SUPABASE_URL + "/rest/v1/pois?id=eq." + encodeURIComponent(poiId) : SUPABASE_URL + "/rest/v1/pois",
    method: isEdit ? "PATCH" : "POST"
  };
}

async function savePoi(){
  const token = getToken();
  const email = getUserEmail();
  const poi = readPoiForm();
  const saveTargetId = editingPoiId;
  const request = buildPoiSaveRequest(saveTargetId);

  if(!poi.name){
    alert("Nome obbligatorio");
    return;
  }

  if(!token){
    alert("Devi essere loggato per salvare.");
    return;
  }

  if(email !== OWNER_EMAIL){
    alert("Utente non autorizzato: " + (email || "email non trovata"));
    return;
  }

  try{
    const res = await fetch(request.url, {
      method: request.method,
      headers: buildHeaders({ useUserToken: true, extra: { Prefer: "return=representation" } }),
      body: JSON.stringify(poi)
    });

    await parseResponse(res);
    clearForm();
    closeModal();
    await loadPois();
  }catch(err){
    console.error("SAVE POI ERROR", err);
    const grantMsg = "SQL richiesto se è 42501:\nGRANT SELECT, INSERT, UPDATE, DELETE ON public.pois TO authenticated;";
    alert("Errore salvataggio: " + err.message + "\n\n" + grantMsg);
  }
}

async function deletePoi(){
  if(!editingPoiId) return;
  if(!confirm("Sei sicuro di voler eliminare questo POI?")) return;

  const token = getToken();
  const email = getUserEmail();

  if(!token){
    alert("Devi essere loggato per eliminare.");
    return;
  }

  if(email !== OWNER_EMAIL){
    alert("Utente non autorizzato: " + (email || "email non trovata"));
    return;
  }

  try{
    const res = await fetch(SUPABASE_URL + "/rest/v1/pois?id=eq." + encodeURIComponent(editingPoiId), {
      method: "DELETE",
      headers: buildHeaders({ useUserToken: true })
    });

    await parseResponse(res);
    closeModal();
    await loadPois();
  }catch(err){
    console.error("DELETE POI ERROR", err);
    alert("Errore eliminazione: " + err.message);
  }
}

addBtn.addEventListener("click", () => openModal());
deleteBtn.addEventListener("click", deletePoi);
closeBtn.addEventListener("click", closeModal);
saveBtn.addEventListener("click", savePoi);
searchEl.addEventListener("input", () => renderPois(searchEl.value));
importanceEl.addEventListener("input", () => updateImportanceUI());
modalEl.addEventListener("click", (event) => { if(event.target === modalEl) closeModal(); });
document.addEventListener("keydown", (event) => {
  if(event.key === "Escape"){
    closeModal();
    closeLevelsModal();
    closeCoinsMenu();
  }
});
