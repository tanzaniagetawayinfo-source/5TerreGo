<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>POI Editor</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#05070a;color:#fff}
.header{position:sticky;top:0;background:#05070a;padding:16px;display:flex;gap:10px;align-items:center;z-index:10}
.search{flex:1;min-width:0;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.08);color:white;outline:none}
.add-btn{padding:12px 16px;border-radius:12px;border:none;background:white;color:black;font-weight:700;cursor:pointer}
.status{padding:0 16px 8px;color:rgba(255,255,255,0.65);font-size:13px}
.status.error{color:#ffb4b4}
.list{padding:16px}
.poi{padding:14px;border-radius:14px;background:rgba(255,255,255,0.06);margin-bottom:10px;border:1px solid rgba(255,255,255,0.08)}
.poi-title{font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.72);display:none;align-items:center;justify-content:center}
.modal.is-open{display:flex}
.modal-content{background:#0a0c10;border-radius:18px;padding:18px;width:100%;max-width:420px}
.close-btn{position:absolute;right:14px;top:14px}
input,select,textarea{width:100%;padding:12px;margin-top:10px;border-radius:12px;background:rgba(255,255,255,0.08);color:white}
button.save{width:100%;padding:14px;margin-top:14px;background:white;color:black;font-weight:800}
</style>
</head>
<body>

<div class="header">
  <input id="search" class="search" placeholder="Cerca POI..." />
  <button id="addBtn" class="add-btn">Aggiungi</button>
</div>

<div id="status" class="status">Caricamento POI...</div>
<div id="list" class="list"></div>

<div id="modal" class="modal">
  <div class="modal-content">
    <button id="closeBtn" class="close-btn">×</button>
    <h2>Aggiungi POI</h2>

    <input id="name" placeholder="Nome" />
    <input id="coords" placeholder="Coordinate" />
    <textarea id="description" placeholder="Descrizione"></textarea>
    <input id="importance" type="number" placeholder="Importanza" />

    <select id="type">
      <option value="chiesa">chiesa</option>
      <option value="monumento">monumento</option>
      <option value="sentiero">sentiero</option>
      <option value="spiaggia">spiaggia</option>
      <option value="ristorante">ristorante</option>
    </select>

    <input id="emails" placeholder="emails" />
    <input id="phone" placeholder="phone" />
    <input id="discount" type="number" placeholder="sconto" />

    <button class="save" id="saveBtn">Salva</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://jpflcbktcnhmlvaibzcw.supabase.co";
const ANON_KEY = "INSERISCI_QUI_ANON_KEY";

let pois = [];

function getToken(){
  for(const k of Object.keys(localStorage)){
    if(k.includes("auth-token")){
      try{
        return JSON.parse(localStorage.getItem(k)).access_token;
      }catch{}
    }
  }
  return null;
}

async function loadPois(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/pois`,{
      headers:{
        apikey:ANON_KEY
      }
    });

    pois = await res.json();
    render();
    status.innerText = pois.length + " POI";
  }catch(e){
    status.innerText = "errore";
  }
}

function render(){
  list.innerHTML = "";
  pois.forEach(p=>{
    const d=document.createElement("div");
    d.className="poi";
    d.innerHTML = `<b>${p.name}</b><br>${p.type}`;
    list.appendChild(d);
  });
}

async function savePoi(){
  const token = getToken();

  const poi = {
    name: name.value,
    coords: coords.value,
    description: description.value,
    importance: Number(importance.value)||1,
    type: type.value,
    emails: emails.value,
    phone: phone.value,
    discount: Number(discount.value)||0
  };

  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/pois`,{
      method:"POST",
      headers:{
        apikey:ANON_KEY,
        Authorization:`Bearer ${token}`,
        "Content-Type":"application/json"
      },
      body: JSON.stringify(poi)
    });

    if(!res.ok){
      const t = await res.text();
      throw new Error(t);
    }

    closeModal();
    loadPois();

  }catch(e){
    alert(e.message);
  }
}

addBtn.onclick=()=>modal.classList.add("is-open");
closeBtn.onclick=()=>modal.classList.remove("is-open");
saveBtn.onclick=savePoi;

loadPois();
</script>

</body>
</html>
