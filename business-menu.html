<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Menu attività · 5TerreGo</title><link rel="stylesheet" href="/business-dashboard.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="shell"><div class="top"><a class="back" data-page="discounteditor.html">← Dashboard</a><a class="scanner" href="/map.html">Vedi sulla mappa →</a></div><section class="hero"><div class="eyebrow">Menu pubblico</div><h1 data-business-name>Attività</h1><p>Il menu comparirà nella tendina del POI corrispondente sulla mappa.</p><div id="switcher" class="switcher hidden"><label for="activitySelect">Attività</label><select id="activitySelect"></select></div></section><div id="status" class="status">Caricamento…</div><section id="content" class="panel hidden"><div class="mode"><button id="itemsMode" class="active" type="button">Prodotti singoli</button><button id="fileMode" type="button">Foto o PDF</button></div><div id="itemsEditor"><div class="product-form"><label class="field wide"><span>Prodotto</span><input id="itemName" maxlength="100"></label><label class="field"><span>Categoria</span><input id="itemCategory" maxlength="60"></label><label class="field"><span>Prezzo € facoltativo</span><input id="itemPrice" maxlength="20"></label><button id="addItem" class="btn lime" type="button">Aggiungi</button></div><label class="field"><span>Descrizione facoltativa</span><input id="itemDescription" maxlength="240"></label><div id="productList" class="product-list"></div></div><div id="fileEditor" class="hidden"><div class="file-card"><div id="fileLabel">Nessun file caricato</div><div class="actions"><button id="uploadFile" class="btn soft" type="button">Carica foto o PDF</button><button id="removeFile" class="btn danger hidden" type="button">Rimuovi</button></div><input id="fileInput" class="hidden" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"></div></div><div class="actions"><button id="save" class="btn primary" type="button">Salva menu</button></div></section></main><script src="/business-dashboard-common.js"></script><script>
(async function(){var api=window.FTGBusiness,ctx,poi,profile,items=[],menuFile=null,mode='items';function setMode(value){mode=value;document.getElementById('itemsMode').classList.toggle('active',mode==='items');document.getElementById('fileMode').classList.toggle('active',mode==='file');document.getElementById('itemsEditor').classList.toggle('hidden',mode!=='items');document.getElementById('fileEditor').classList.toggle('hidden',mode!=='file')}function renderItems(){document.getElementById('productList').innerHTML=items.map(function(item,i){return '<div class="product"><div><strong>'+api.esc(item.name)+'</strong>'+(item.price?' · € '+api.esc(item.price):'')+'<br><small>'+api.esc(item.category||'Altro')+(item.description?' · '+api.esc(item.description):'')+'</small></div><button class="btn danger" data-remove="'+i+'">Rimuovi</button></div>'}).join('')||'<div>Nessun prodotto.</div>'}function renderFile(){var has=menuFile&&menuFile.url;document.getElementById('fileLabel').innerHTML=has?'<strong>'+api.esc(menuFile.name||'Menu')+'</strong><br><a href="'+api.esc(menuFile.url)+'" target="_blank">Apri file</a>':'Nessun file caricato';document.getElementById('removeFile').classList.toggle('hidden',!has)}try{ctx=await api.init();if(!ctx)return;poi=ctx.poi;profile=api.safeProfile(poi.partner_profile);items=Array.isArray(profile.menu&&profile.menu.items)?profile.menu.items:[];menuFile=profile.menu&&profile.menu.file||null;setMode(profile.menu&&profile.menu.mode==='file'?'file':'items');renderItems();renderFile();document.getElementById('content').classList.remove('hidden');document.getElementById('itemsMode').onclick=function(){setMode('items')};document.getElementById('fileMode').onclick=function(){setMode('file')};document.getElementById('addItem').onclick=function(){var name=document.getElementById('itemName').value.trim();if(!name){api.setStatus('Inserisci il nome del prodotto.','error');return}items.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name:name,category:document.getElementById('itemCategory').value.trim(),price:document.getElementById('itemPrice').value.trim(),description:document.getElementById('itemDescription').value.trim()});['itemName','itemCategory','itemPrice','itemDescription'].forEach(function(id){document.getElementById(id).value=''});renderItems()};document.getElementById('productList').onclick=function(e){var b=e.target.closest('[data-remove]');if(b){items.splice(Number(b.getAttribute('data-remove')),1);renderItems()}};document.getElementById('uploadFile').onclick=function(){document.getElementById('fileInput').click()};document.getElementById('fileInput').onchange=async function(){var file=this.files&&this.files[0];if(!file)return;try{var result=await api.uploadAsset(poi,file,false);menuFile={url:result.url,name:file.name,mime_type:result.mime_type};renderFile();api.setStatus('File caricato. Premi Salva menu.','ok')}catch(e){api.setStatus(e.message,'error')}this.value=''};document.getElementById('removeFile').onclick=function(){menuFile=null;renderFile()};document.getElementById('save').onclick=async function(){this.disabled=true;try{profile.menu={mode:mode,items:items.slice(0,100),file:menuFile};var result=await api.saveBusiness(poi,poi.description||'',poi.phone||'',api.parseImages(poi.images),profile);poi.partner_profile=result.partner_profile;api.setStatus('Menu salvato: ora compare nella tendina del POI.','ok')}catch(e){api.setStatus(e.message,'error')}finally{this.disabled=false}}}catch(e){api.setStatus(e.message,'error')}})();
</script></body></html>
