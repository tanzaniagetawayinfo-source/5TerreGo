name: Generate trail pages

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-trail-pages.mjs'
      - '.github/workflows/generate-trail-pages.yml'
  schedule:
    - cron: '27 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate pages from public trail data
        env:
          SUPABASE_URL: https://jpflcbktcnhmlvaibzcw.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_vWugAbu_xtetgvrCh6yKYw_iA8bAXBa
        run: node scripts/generate-trail-pages.mjs
      - name: Commit refreshed pages
        run: |
          if git diff --quiet -- trails sitemap.xml; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trails sitemap.xml
          git commit -m "Refresh SEO trail pages"
          git push origin main
