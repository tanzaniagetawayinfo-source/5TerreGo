name: Fix trail 3D camera

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-trail-3d-camera.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply trail camera fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('map.html')
          source = path.read_text(encoding='utf-8')

          replacement = r'''  function focusTrailReliefView(latLngs) {
    var bounds;
    var padding;
    var camera;
    var mobile;
    var routeBearing;
    var targetBearing;
    var targetCenter;
    var targetPitch;
    var targetZoom;
    var startPoint;
    var endPoint;
    if (!latLngs || latLngs.length < 2 || !currentTrail) return;
    if (!turnNavigationMap || !turnNavigationMapLoaded) {
      startTurnNavigationMap();
      window.setTimeout(function() {
        if (currentTrail && trailCard && trailCard.classList.contains('open')) focusTrailReliefView(getTrailLatLngs(currentTrail));
      }, 220);
      return;
    }
    stopTrailPreviewOrbit();
    stopAmbientOrbit();
    normalGyroTracking = false;
    normalGyroSuspendedByGesture = true;
    mobile = window.innerWidth <= 700;
    padding = mobile
      ? { top:84, right:24, bottom:Math.max(150, Math.round(window.innerHeight - trailCard.getBoundingClientRect().top + 24)), left:24 }
      : { top:96, right:Math.max(180, Math.round(window.innerWidth - trailCard.getBoundingClientRect().left + 28)), bottom:42, left:42 };
    startPoint = latLngs[0];
    endPoint = latLngs[latLngs.length - 1];
    routeBearing = getBearingDegrees(startPoint, endPoint);
    targetBearing = normalizeDegrees(routeBearing + 90);
    targetPitch = mobile ? 67 : 72;
    bounds = new window.maplibregl.LngLatBounds();
    latLngs.forEach(function(point) { bounds.extend([point[1], point[0]]); });
    try {
      mapPerspective = '3d';
      applyMapFixedCopy();
      turnNavigationMap.resize();
      turnNavigationMap.setTerrain({ source:'terrainDem', exaggeration:1.55 });
      turnNavigationMap.setLayoutProperty('3d-buildings', 'visibility', 'none');
      turnNavigationMap.setLayoutProperty('terrain-hillshade', 'visibility', 'none');
      updateNormalMapLibreLines();
      camera = turnNavigationMap.cameraForBounds(bounds, { padding:padding, maxZoom:mobile ? 15.1 : 16 });
      targetCenter = camera && camera.center ? camera.center : bounds.getCenter();
      targetZoom = camera && Number.isFinite(camera.zoom) ? camera.zoom : 13;
      targetZoom = Math.max(turnNavigationMap.getMinZoom(), targetZoom - (mobile ? .85 : .55));
      turnNavigationMap.easeTo({ center:targetCenter, zoom:targetZoom, pitch:0, bearing:targetBearing, duration:600 });
    } catch (error) {
      console.warn('Trail relief camera unavailable', error);
      return;
    }
    window.setTimeout(function() {
      if (!currentTrail || !trailCard || !trailCard.classList.contains('open')) return;
      turnNavigationMap.easeTo({ center:targetCenter, zoom:targetZoom, pitch:targetPitch, bearing:targetBearing, duration:820 });
      window.setTimeout(function() {
        if (!currentTrail || !trailCard.classList.contains('open')) return;
        trailPreviewOrbitTimer = window.setInterval(function() {
          if (!currentTrail || !trailCard.classList.contains('open') || !turnNavigationMap || !turnNavigationMapLoaded) {
            stopTrailPreviewOrbit();
            return;
          }
          turnNavigationMap.easeTo({
            center:targetCenter,
            zoom:targetZoom,
            pitch:targetPitch,
            bearing:turnNavigationMap.getBearing() + (mobile ? 2.4 : 3),
            duration:1450,
            easing:function(t) { return t; }
          });
        }, 1500);
      }, 860);
    }, 640);
  }'''

          source, count = re.subn(
              r"  function focusTrailReliefView\(latLngs\) \{.*?\n  async function ensureTrailElevationProfile",
              replacement + "\n  async function ensureTrailElevationProfile",
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('focusTrailReliefView not found')

          old_call = "if (isTrailPreviewMode) focusTrailReliefView(latLngs);"
          new_call = "window.setTimeout(function() { if (currentTrail === trail) focusTrailReliefView(latLngs); }, 80);"
          if old_call not in source:
              raise SystemExit('trail focus call not found')
          source = source.replace(old_call, new_call, 1)

          old_layer = "      turnNavigationMap.addLayer({ id:'normal-trails-line',type:'line',source:'normal-trails',paint:{'line-color':['get','color'],'line-width':4,'line-opacity':.9},layout:{'line-cap':'round','line-join':'round'} });"
          new_layer = "      turnNavigationMap.addLayer({ id:'normal-trails-casing',type:'line',source:'normal-trails',paint:{'line-color':'#ffffff','line-width':11,'line-opacity':.9},layout:{'line-cap':'round','line-join':'round'} });\n      turnNavigationMap.addLayer({ id:'normal-trails-line',type:'line',source:'normal-trails',paint:{'line-color':['get','color'],'line-width':7,'line-opacity':1},layout:{'line-cap':'round','line-join':'round'} });"
          if old_layer not in source:
              raise SystemExit('selected trail layer not found')
          source = source.replace(old_layer, new_layer, 1)

          path.write_text(source, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map.html
          git rm .github/workflows/fix-trail-3d-camera.yml
          git commit -m "Fix mobile trail 3D camera"
          git push origin main
