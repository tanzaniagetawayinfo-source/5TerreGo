      pointer-events: auto;

    #read-more {
      display: none;
      position: absolute;
      left: 18px;
      bottom: 13px;
      margin-top: 0;
      padding: 7px 0;
      font-size: 13px;
      font-weight: 800;
      color: #1e9bff;
      cursor: pointer;

      z-index: 4;
      border-radius: 999px;
      opacity: 0;
      transform: scale(0.92);

    #poi-close {
      top: 12px;
      right: 12px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;

      color: #111;
      font-weight: 300;
      font-size: 30px;
      line-height: 1;
      cursor: pointer;

    #poi-directions {

      -webkit-backdrop-filter: blur(10px);

    #poi-card.open #poi-close,
    #poi-card.open #poi-ai {

    }

      right: auto;
      left: 18px;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: none;
    }

    body.poi-panel-active #ai-chat-btn video {
      transform: scale(1.22) scaleX(-1);
    }
  </style>
</head>

  function escapeHTML(value) {
    return String(value || '').replace(/[&<>\"]/g, function (char) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[char];

  }

  function readValue(value, fallback) {

  function isIOSDevice() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  function getPOIEmoji(type, fallback) {
    switch (String(type || '').toLowerCase()) {
      case 'chiesa': return '⛪';

      default: return fallback || '📌';
    }
  }

  function parseCoords(raw) {
    var lat;
    var lng;
    var str;
    var parts;

    raw = raw || {};

    if (typeof raw.coords === 'string') {
      str = raw.coords.trim();
      parts = str.split(',');

      if (parts.length > 2) {
        lat = Number(String(parts[0]).trim() + '.' + String(parts[1]).trim());

        lat = Number(String(parts[0]).trim());
        lng = Number(String(parts[1]).trim());
      }

      return { lat: lat, lng: lng };
    }

    lng = Number(readValue(raw.lng, raw.longitude));

    var symbol;

    parsed = parseCoords(raw);
    symbol = raw.symbol || getPOIEmoji(raw.type || raw.tipo, '📍');

    return {
      id: raw.id || raw._id || 'local-' + Date.now() + '-' + Math.random().toString(16).slice(2),
      name: String(raw.name || raw.title || 'POI'),
      symbol: symbol,
      coords: [parsed.lat, parsed.lng],
      lat: parsed.lat,
      lng: parsed.lng,
      image: raw.image || raw.photo_url || raw.img || '',
      description: raw.description || raw.descrizione || '',
      type: raw.type || raw.tipo || '',
      owner_email: raw.owner_email || raw.email || '',
      phone: raw.phone || raw.telephone || '',
      relevance: Number(raw.importance || raw.relevance || raw.score || 0)
    };
  }

  function isValidPOI(poi) {
    return Boolean(poi && Number.isFinite(poi.lat) && Number.isFinite(poi.lng) && poi.name.length > 0);
  }

  function getMinZoomForImportance(importance) {
    var n = Number(importance || 0);
    if (n >= 95) return 11;
    if (n >= 85) return 12;
    if (n >= 75) return 13;
    if (n >= 65) return 14;
    if (n >= 55) return 15;
    if (n >= 40) return 16;
    return 17;
  }

  function getYouTubeEmbedUrl(videoId) {
    if (!videoId) return '';
    return 'https://www.youtube.com/embed/' + encodeURIComponent(videoId) + '?autoplay=1&mute=1&playsinline=1&controls=0&rel=0&modestbranding=1&iv_load_policy=3&fs=0&disablekb=1&enablejsapi=1&origin=' + encodeURIComponent(window.location.origin);
  }

  function speakText(text) {
    var utter;

    if (!text) return;
    if (!('speechSynthesis' in window) || typeof window.SpeechSynthesisUtterance === 'undefined') {
      alert(text);
      return;
    }

    utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.rate = 0.94;
    utter.pitch = 1;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  }

  function generateAIText(item, type) {
    var name = item && item.name ? item.name : '';
    var description = item && item.description ? item.description : '';

    if (type === 'poi') {
      if (description) return name + '. ' + description;
      return name + '. This point of interest has no description yet, but it is saved on your Cinque Terre map.';
    }

    if (description) return 'Quick guide to ' + name + ': ' + description;
    return 'Quick guide to ' + name + '. This is one of the five villages of the Cinque Terre.';
  }

  function initMap() {
    if (!window.L) {
      throw new Error('Leaflet non caricato. Controlla la connessione o il CDN Leaflet.');
    }

    map = L.map('map', {
      minZoom: 11,
      maxZoom: 20,
      zoomControl: false,
      preferCanvas: true,
      inertia: true,
      zoomSnap: 0.25,
      zoomDelta: 0.25,
      wheelPxPerZoomLevel: 80
    }).setView([44.12, 9.71], 12);

    satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      detectRetina: false,
      keepBuffer: 8,
      noWrap: true
    }).addTo(map);

    roadsLayer = L.tileLayer('https://stamen-tiles.a.ssl.fastly.net/toner-lines/{z}/{x}/{y}.png', {
      maxZoom: 20,
      opacity: 0.82,
      noWrap: true
    }).addTo(map);

    whiteLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
      maxZoom: 20,
      opacity: 0,
      subdomains: 'abcd',
      noWrap: true
    }).addTo(map);

    labelsLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', {
      maxZoom: 20,
      opacity: 0,
      subdomains: 'abcd',
      noWrap: true
    }).addTo(map);

    ferryRoutesLayer = L.layerGroup().addTo(map);
    trailsLayer = L.layerGroup().addTo(map);
    poiLayer = L.layerGroup().addTo(map);

    map.setMaxBounds(L.latLngBounds([44.07, 9.58], [44.17, 9.80]));
  }

  function updateMapVisualByZoom() {
    var z;
    var raw;
    var t;

    if (!map || !satelliteLayer || !roadsLayer || !whiteLayer || !labelsLayer) return;

    z = map.getZoom();
    raw = Math.min(1, Math.max(0, (z - 14.75) / 3.75));
    t = raw * raw * (3 - 2 * raw);

    satelliteLayer.setOpacity(Math.max(0.08, 1 - t));
    roadsLayer.setOpacity(0.82 * (1 - t * 0.72));
    whiteLayer.setOpacity(t);
    labelsLayer.setOpacity(Math.max(0, (t - 0.18) / 0.82));
  }

  function preloadImages() {
    places.forEach(function (place) {
      var img = new Image();
      img.src = place.image;
    });
  }

  function createCityMarkers() {
    places.forEach(function (place, index) {
      L.marker(place.coords, {
        title: place.name,
        icon: L.divIcon({
          className: 'custom-label',
          html: '<div class="label">' + escapeHTML(place.name) + '</div>'
        })
      }).addTo(map).on('click', function (event) {
        if (event && event.originalEvent) {
          L.DomEvent.stopPropagation(event.originalEvent);
          L.DomEvent.preventDefault(event.originalEvent);
        }
        cityCardManuallyClosed = false;
        showCityByIndex(index, true);
      });
    });
  }

  function centerCity(place) {
    var zoomLevel;

    if (!place) return;
    isProgrammaticMove = true;
    zoomLevel = place.name === 'Monterosso' ? 14 : 15;
    map.flyTo(place.coords, zoomLevel, { duration: 1.2 });

    window.setTimeout(function () {
      isProgrammaticMove = false;
    }, 1400);
  }

  function resetCardLive() {
    cardMedia.classList.remove('live-ready');
    cardMedia.classList.remove('live-visible');
    cardLive.removeAttribute('src');
  }

  function postYouTubeCommand(command) {
    if (!cardLive || !cardLive.contentWindow) return;

    try {
      cardLive.contentWindow.postMessage(JSON.stringify({
        event: 'command',
        func: command,
        args: []
      }), '*');
    } catch (error) {}
  }

  function forceYouTubeAutoplay() {
    postYouTubeCommand('mute');
    postYouTubeCommand('playVideo');

    window.setTimeout(function () {
      postYouTubeCommand('mute');
      postYouTubeCommand('playVideo');
    }, 350);

    window.setTimeout(function () {
      postYouTubeCommand('mute');
      postYouTubeCommand('playVideo');
    }, 900);
  }

  function loadCardLive(videoId) {
    var src = getYouTubeEmbedUrl(videoId);
    resetCardLive();
    if (!src) return;

    cardLive.onload = function () {
      cardMedia.classList.add('live-ready');
      cardMedia.classList.remove('live-visible');
      forceYouTubeAutoplay();

      window.setTimeout(function () {
        if (cardLive.src === src) {
          forceYouTubeAutoplay();
          cardMedia.classList.add('live-visible');
        }
      }, 5200);
    };

    forceYouTubeAutoplay();

  function setCardContent(item) {
    cardTitle.innerText = item.name;
    cardImg.src = item.image || 'https://images.pexels.com/photos/632522/pexels-photo-632522.jpeg';
    cardImg.alt = item.name;

  function showCityCard(item) {
    closePOICard(true);
    setCardContent(item);
    card.style.display = 'block';
    card.setAttribute('aria-hidden', 'false');

    window.requestAnimationFrame(function () {
      card.classList.add('is-visible');
      card.style.transform = 'translateY(0)';
    });

  function hideCard(manual) {
    if (manual) cityCardManuallyClosed = true;
    if (card.getAttribute('aria-hidden') === 'true') return;

    card.classList.remove('is-visible');
    card.setAttribute('aria-hidden', 'true');
    card.style.transform = 'translateY(40px)';

    window.setTimeout(function () {
      if (card.getAttribute('aria-hidden') === 'true') {
        card.style.display = 'none';
        resetCardLive();
      }
    }, 300);

  function showCityByIndex(index, shouldCenter) {
    var place;

    if (shouldCenter === undefined) shouldCenter = true;
    if (index < 0 || index >= places.length) return;

    currentDataset = 'places';
    currentIndex = index;
    currentPOI = null;
    place = places[index];

    if (shouldCenter) centerCity(place);
    showCityCard(place);
  }

  function slideToIndex(nextIndex, direction) {
    var place;
    var exitX;
    var enterX;

    if (currentDataset !== 'places') return;

    if (nextIndex < 0 || nextIndex >= places.length || nextIndex === currentIndex) {
      card.style.transition = 'transform 0.2s ease';
      card.style.transform = 'translateX(0)';
      return;
    }

    place = places[nextIndex];
    exitX = direction === 'next' ? '-110%' : '110%';
    enterX = direction === 'next' ? '110%' : '-110%';

    card.style.transition = 'transform 0.25s ease';
    card.style.transform = 'translateX(' + exitX + ')';

    window.setTimeout(function () {
      card.style.transition = 'none';
      card.style.transform = 'translateX(' + enterX + ')';
      currentIndex = nextIndex;
      setCardContent(place);

      window.requestAnimationFrame(function () {
        card.style.transition = 'transform 0.3s ease';
        card.style.transform = 'translateX(0)';
      });

      centerCity(place);
    }, 250);
  }

  function getClosestCity() {
    var center = map.getCenter();
    var minDist = Infinity;
    var closestIndex = -1;

    places.forEach(function (place, index) {
      var distance = center.distanceTo(L.latLng(place.coords));
      if (distance < minDist) {
        minDist = distance;
        closestIndex = index;
      }
    });

    return { index: closestIndex, distance: minDist };
  }

  function evaluateAutoCard() {
    var zoom;
    var closest;

    if (isProgrammaticMove || poiCard.getAttribute('aria-hidden') === 'false') return;

    zoom = map.getZoom();
    closest = getClosestCity();

    if (cityCardManuallyClosed && closest.index === currentIndex) return;
    if (cityCardManuallyClosed && closest.index !== currentIndex) cityCardManuallyClosed = false;

    if (zoom >= AUTO_OPEN_ZOOM && closest.distance < AUTO_OPEN_DISTANCE) {
      if (currentDataset !== 'places' || currentIndex !== closest.index || card.getAttribute('aria-hidden') === 'true') {
        showCityByIndex(closest.index, false);
      }
      return;
    }

    if (zoom < AUTO_CLOSE_ZOOM || closest.distance > AUTO_CLOSE_DISTANCE) {
      hideCard(false);
    }
  }

    L.tileLayer('https://stamen-tiles.a.ssl.fastly.net/toner-lines/{z}/{x}/{y}.png', {

  function openPOIWithMapMove(poi, sourceEvent) {
    if (!poi || !isValidPOI(poi)) return;

    if (sourceEvent && sourceEvent.originalEvent) {
      L.DomEvent.stopPropagation(sourceEvent.originalEvent);
      L.DomEvent.preventDefault(sourceEvent.originalEvent);
    }

    isProgrammaticMove = true;

    if (isIOSDevice()) {
      map.setView(poi.coords, 17, { animate: true });
      window.setTimeout(function () {
        showPOICard(poi);
        isProgrammaticMove = false;
      }, 300);
    } else {
      map.flyTo(poi.coords, 17, { duration: 1.2 });
      window.setTimeout(function () {
        showPOICard(poi);
        isProgrammaticMove = false;
      }, 400);
    }
  }

  function updatePOIVisibility() {
    var zoom;

    if (!map || !poiLayer) return;

    zoom = map.getZoom();
    poiLayer.clearLayers();

    poiMarkers.forEach(function (item) {
      if (zoom >= getMinZoomForImportance(item.importance)) {
        item.marker.addTo(poiLayer);
      }
    });
  }

  function getFerryPOIs() {
    return poiMarkers
      .map(function (m) { return m.poi; })
      .filter(function (p) {
        return p && isValidPOI(p) && String(p.type || '').toLowerCase() === 'ferry';
      })
      .sort(function (a, b) {
        if (a.lng === b.lng) return b.lat - a.lat;
        return a.lng - b.lng;
      });
  }

  function createSeaArc(p1, p2, segments) {
    var lat1 = p1[0];
    var lng1 = p1[1];
    var lat2 = p2[0];
    var lng2 = p2[1];
    var midLat = (lat1 + lat2) / 2;
    var midLng = (lng1 + lng2) / 2;
    var distance = Math.abs(lng2 - lng1);
    var offset = 0.018 + distance * 0.45;
    var control = [midLat - 0.003, midLng - offset];
    var points = [];
    var i;
    var t;
    var lat;
    var lng;

    for (i = 0; i <= segments; i += 1) {
      t = i / segments;
      lat = (1 - t) * (1 - t) * lat1 + 2 * (1 - t) * t * control[0] + t * t * lat2;
      lng = (1 - t) * (1 - t) * lng1 + 2 * (1 - t) * t * control[1] + t * t * lng2;
      points.push([lat, lng]);
    }

    return points;
  }

  function addFerryRoutes() {
    var i;
    var fromPort;
    var toPort;
    var arc;

    if (!ferryRoutesLayer) return;

    ferryRoutesLayer.clearLayers();
    ferryPorts = getFerryPOIs();

    if (ferryPorts.length < 2) return;

    for (i = 0; i < ferryPorts.length - 1; i += 1) {
      fromPort = ferryPorts[i];
      toPort = ferryPorts[i + 1];
      arc = createSeaArc(fromPort.coords, toPort.coords, 32);

      L.polyline(arc, {
        color: '#00e0ff',
        weight: 1,
        opacity: 0.95,
        dashArray: '8, 10',
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(ferryRoutesLayer);
    }
  }

  function readLocalPOIs() {
    try {
      return JSON.parse(localStorage.getItem(LOCAL_POI_KEY) || '[]');
    } catch (error) {
      return [];
    }
  }

  function saveLocalPOI(poi) {
    var current = readLocalPOIs();
    current.push(poi);
    localStorage.setItem(LOCAL_POI_KEY, JSON.stringify(current));
  }

  async function loadPOIs() {
    var response;
    var rows = [];

    poiLayer.clearLayers();
    poiMarkers = [];

    if (SUPABASE_READY && supabaseClient) {
      response = await supabaseClient
        .from('pois')
        .select('*')
        .order('importance', { ascending: false, nullsFirst: false });

      if (response.error) {
        console.warn('Supabase POI load failed:', response.error.message);
      } else {
        rows = response.data || [];
      }
    } else {
      rows = readLocalPOIs();
    }

    rows.map(normalizePOI).filter(isValidPOI).forEach(function (poi) {
      var marker = L.marker(poi.coords, {
        title: poi.name,
        icon: L.divIcon({
          className: 'custom-poi',
          html: '<div class="poi-label">' + escapeHTML(poi.symbol) + '</div>',
          iconSize: [32, 32],
          iconAnchor: [16, 16]
        })
      }).on('click', function (event) {
        openPOIWithMapMove(poi, event);
      });

      poiMarkers.push({ marker: marker, importance: poi.relevance || 0, poi: poi });
    });

    updatePOIVisibility();
    addFerryRoutes();
    renderSearchSuggestions(searchInput.value);
  }

  async function updateWeather(lat, lng) {
    try {
      var response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=' + encodeURIComponent(lat) + '&longitude=' + encodeURIComponent(lng) + '&current_weather=true');
      var data = await response.json();
      var temperature = data && data.current_weather ? data.current_weather.temperature : undefined;
      document.getElementById('weather').innerText = temperature === undefined ? '--' : '🌤️ ' + temperature + '°';
    } catch (error) {
      document.getElementById('weather').innerText = '--';
    }
  }

  function getUserDisplayName(user) {
    var meta;

    if (!user) return 'User';
    meta = user.user_metadata || {};
    if (meta.username) return meta.username;
    if (meta.name) return meta.name;
    if (user.email) return user.email.split('@')[0];
    return 'User';
  }

  async function readCurrentUser() {
    var sessionResponse;
    var session;
    var userResponse;

    if (!supabaseClient) return null;

    sessionResponse = await supabaseClient.auth.getSession();
    session = sessionResponse && sessionResponse.data ? sessionResponse.data.session : null;

    if (session && session.user) return session.user;

    userResponse = await supabaseClient.auth.getUser();
    return userResponse && userResponse.data ? userResponse.data.user : null;
  }

  async function checkUser() {
    var user = await readCurrentUser();
    currentUser = user;

    if (!user) {
      loginBtn.innerText = 'Accedi';
      return false;
    }

    loginBtn.innerText = 'Hi, ' + getUserDisplayName(user);
    return true;
  }

  function startUserPolling() {
    var tries = 0;

    if (userCheckTimer) {
      clearInterval(userCheckTimer);
      userCheckTimer = null;
    }

    userCheckTimer = setInterval(async function () {
      tries += 1;
      await checkUser();

      if (currentUser || tries >= 12) {
        clearInterval(userCheckTimer);
        userCheckTimer = null;
      }
    }, 250);
  }

  function getSearchResults(query) {
    var q = String(query || '').trim().toLowerCase();
    var results = [];

    if (!q) return results;

    places.forEach(function (place, index) {
      if (place.name.toLowerCase().indexOf(q) !== -1) {
        results.push({ type: 'city', name: place.name, index: index });
      }
    });

    poiMarkers.forEach(function (item) {
      if (item.poi && item.poi.name.toLowerCase().indexOf(q) !== -1) {
        results.push({ type: 'poi', name: item.poi.name });
      }
    });

    return results;
  }

  function renderSearchSuggestions(value) {
    var results = getSearchResults(value);

    if (!value || results.length === 0) {
      searchResults.style.display = 'none';
      searchResults.innerHTML = '';
      return;
    }

    searchResults.innerHTML = results.slice(0, 8).map(function (result) {
      var label = result.type === 'city' ? 'Village' : 'POI';
      return '<div class="search-item" data-name="' + escapeHTML(result.name) + '">' + escapeHTML(result.name) + ' · ' + label + '</div>';
    }).join('');

    searchResults.style.display = 'flex';
  }

  function selectSearchResult(name) {
    var cityIndex = places.findIndex(function (place) { return place.name === name; });
    var poiItem;

    if (cityIndex !== -1) {
      cityCardManuallyClosed = false;
      showCityByIndex(cityIndex, true);
      return true;
    }

    poiItem = poiMarkers.find(function (item) {
      return item.poi && item.poi.name === name;
    });

    if (poiItem && poiItem.poi) {
      openPOIWithMapMove(poiItem.poi, null);
      return true;
    }

    return false;
  }

  async function geocodeSearch(query) {
    try {
      var response = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(query));
      var data = await response.json();

      if (data && data[0]) {
        var lat = parseFloat(data[0].lat);
        var lon = parseFloat(data[0].lon);
        map.setView([lat, lon], 13);
        updateWeather(lat, lon);
        return true;
      }
    } catch (error) {
      console.warn('Search failed:', error);
    }

    return false;
  }

  function handlePOIAI(event) {
    if (event) event.stopPropagation();
    if (!currentPOI) return;
    speakText(generateAIText(currentPOI, 'poi'));
  }

  function setupCardSwipe(target) {
    target.addEventListener('touchstart', function (event) {
      if (event.touches.length !== 1) return;
      event.preventDefault();
      startX = event.touches[0].clientX;
      startY = event.touches[0].clientY;
      currentX = startX;
      currentY = startY;
      isDragging = true;
      hasMoved = false;
      dragAxis = null;
      card.style.transition = 'none';
    }, { passive: false });

    target.addEventListener('touchmove', function (event) {
      var deltaX;
      var deltaY;
      var pullDown;
      var blockedRight;
      var blockedLeft;

      if (!isDragging || event.touches.length !== 1) return;
      event.preventDefault();

      currentX = event.touches[0].clientX;
      currentY = event.touches[0].clientY;
      deltaX = currentX - startX;
      deltaY = currentY - startY;

      if (!dragAxis && (Math.abs(deltaX) > 8 || Math.abs(deltaY) > 8)) {
        dragAxis = Math.abs(deltaY) > Math.abs(deltaX) ? 'y' : 'x';
      }

      if (!dragAxis) return;
      hasMoved = true;

      if (dragAxis === 'y') {
        pullDown = Math.max(0, deltaY);
        card.style.transform = 'translateY(' + pullDown + 'px)';
        card.style.opacity = String(Math.max(0.35, 1 - pullDown / 260));
        return;
      }

      blockedRight = currentIndex === 0 && deltaX > 0;
      blockedLeft = currentIndex === places.length - 1 && deltaX < 0;
      if (blockedRight || blockedLeft) deltaX = 0;
      card.style.transform = 'translateX(' + deltaX + 'px)';
    }, { passive: false });

    target.addEventListener('touchend', function (event) {
      var deltaX;
      var deltaY;
      var blockedRight;
      var blockedLeft;

      if (!isDragging) return;

      if (event && event.changedTouches && event.changedTouches.length) {
        currentX = event.changedTouches[0].clientX;
        currentY = event.changedTouches[0].clientY;
      }

      deltaX = currentX - startX;
      deltaY = currentY - startY;
      isDragging = false;
      card.style.opacity = '';

      if (dragAxis === 'y') {
        if (deltaY > 55) {
          hideCard(true);
          dragAxis = null;
          return;
        }
        card.style.transition = 'transform 0.22s ease, opacity 0.22s ease';
        card.style.transform = 'translateY(0)';
        dragAxis = null;
        return;
      }

      blockedRight = currentIndex === 0 && deltaX > 0;
      blockedLeft = currentIndex === places.length - 1 && deltaX < 0;

      if (!hasMoved || blockedRight || blockedLeft || Math.abs(deltaX) < 80) {
        card.style.transition = 'transform 0.2s ease';
        card.style.transform = 'translateX(0)';
        dragAxis = null;
        return;
      }

      if (deltaX < -80) {
        slideToIndex(currentIndex + 1, 'next');
        dragAxis = null;
        return;
      }

      if (deltaX > 80) {
        slideToIndex(currentIndex - 1, 'prev');
      }

      dragAxis = null;
    }, { passive: false });

    target.addEventListener('touchcancel', function (event) {
      if (event) event.preventDefault();
      isDragging = false;
      dragAxis = null;
      card.style.opacity = '';
      card.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
      card.style.transform = 'translateX(0) translateY(0)';
    }, { passive: false });
  }

  function setupEvents() {
    if (isIOSDevice()) {
      searchInput.addEventListener('focus', function () {
        document.body.style.position = 'fixed';
      });

      searchInput.addEventListener('blur', function () {
        document.body.style.position = 'fixed';
      });
    }

    document.getElementById('btn-experiences').addEventListener('click', function () {
      window.location.href = 'experiences.html';
    });

    document.getElementById('btn-stories').addEventListener('click', function () {
      window.location.href = 'blog.html';
    });

    cardStoriesBtn.addEventListener('click', function (event) {
      event.stopPropagation();
      window.location.href = 'blog.html';
    });

    cardExperiencesBtn.addEventListener('click', function (event) {
      event.stopPropagation();
      window.location.href = 'experiences.html';
    });

    poiAiBtn.addEventListener('click', handlePOIAI);

    poiClose.addEventListener('click', function () {
      closePOICard(false);
    });

    readMoreBtn.addEventListener('click', function () {
      if (!currentPOI) return;

      if (typeof window.openCaptainGullForPOI === 'function') {
        window.openCaptainGullForPOI(currentPOI);
        closePOICard(false);
      }
    });

    loginBtn.addEventListener('click', function () {
      var baseOrigin = window.location.origin;
      window.location.href = baseOrigin + '/login.html';
    });

    searchInput.addEventListener('input', function () {
      renderSearchSuggestions(searchInput.value);
    });

    searchInput.addEventListener('keydown', function (event) {
      var query;
      var first;

      if (event.key !== 'Enter') return;
      query = searchInput.value.trim();
      if (!query) return;

      first = getSearchResults(query)[0];
      if (first && selectSearchResult(first.name)) {
        searchResults.style.display = 'none';
        searchInput.blur();
        return;
      }

      geocodeSearch(query).then(function () {
        searchResults.style.display = 'none';
        searchInput.blur();
      });
    });

    searchResults.addEventListener('click', function (event) {
      var item = event.target.closest('.search-item');
      if (!item) return;
      selectSearchResult(item.getAttribute('data-name'));
      searchResults.style.display = 'none';
      searchInput.blur();
    });

    document.addEventListener('click', function (event) {
      if (!searchResults.contains(event.target) && event.target !== searchInput) {
        searchResults.style.display = 'none';
      }
    });

    map.on('zoom zoomend moveend', function () {
      updateMapVisualByZoom();
    });

    map.on('moveend zoomend', function () {
      evaluateAutoCard();
      updatePOIVisibility();
    });

    setupCardSwipe(card);
    setupCardSwipe(cardLiveTouchLayer);
  }

  function runTests() {
    var sample;
    var arc;
    var aiText;

    console.assert(Array.isArray(places), 'places must be an array');
    console.assert(places.length === 5, '5 cities expected');
    console.assert(places[4].name === 'Riomaggiore', 'Riomaggiore must stay fifth');
    console.assert(places[4].image === RIOMAGGIORE_IMAGE, 'Riomaggiore fixed image expected');
    console.assert(typeof setupEvents === 'function', 'setupEvents exists');
    console.assert(typeof handlePOIAI === 'function', 'AI POI handler exists');
    console.assert(typeof generateAIText === 'function', 'AI text generator exists');
    console.assert(typeof speakText === 'function', 'speech function exists');
    console.assert(window.fiveTerreGoAI && typeof window.fiveTerreGoAI.getPlaces === 'function', 'Floating AI can read places');
    console.assert(window.fiveTerreGoAI && typeof window.fiveTerreGoAI.getPOIs === 'function', 'Floating AI can read POIs');
    console.assert(document.getElementById('poi-ai') !== null, 'AI button exists on POI card');
    console.assert(document.getElementById('card-experiences') !== null, 'Experiences button exists');
    console.assert(document.getElementById('card-stories') !== null, 'Stories button exists');
    console.assert(document.getElementById('card-experiences') !== null, 'Experiences button is present');

    sample = normalizePOI({ name: 'Ferry Test', coords: '44.2,9.8', type: 'ferry', description: 'A ferry stop.' });
    console.assert(sample.symbol === '⛴️', 'Ferry emoji supported');
    console.assert(sample.description === 'A ferry stop.', 'Description is preserved');
    console.assert(isValidPOI(sample) === true, 'Normalized sample POI is valid');
    console.assert(normalizePOI({ name: 'EU', coords: '44,1004926, 9,7396095' }).lat === 44.1004926, 'European decimal coords supported');
    console.assert(getMinZoomForImportance(100) <= getMinZoomForImportance(10), 'Importance controls visibility zoom');
    console.assert(getMinZoomForImportance(60) >= 15, 'Importance 60 does not appear too early');

    arc = createSeaArc([44.1461, 9.6548], [44.1350, 9.6847], 8);
    console.assert(Array.isArray(arc) && arc.length === 9, 'Sea arc returns segments + 1 points');

    aiText = generateAIText(sample, 'poi');
    console.assert(aiText.indexOf('Ferry Test') !== -1, 'AI text includes POI name');
    console.assert(getYouTubeEmbedUrl('abc123').indexOf('autoplay=1') !== -1, 'YouTube autoplay enabled');
    console.assert(getSearchResults('ver').some(function (result) { return result.name === 'Vernazza'; }), 'Search finds Vernazza');
  }

  function start() {
    initMap();
    createCityMarkers();
    preloadImages();
    updateWeather(44.12, 9.71);
    setupEvents();
    updateMapVisualByZoom();
    runTests();
    loadPOIs();

    window.setTimeout(function () {
      checkUser();
      startUserPolling();
    }, 250);

    if (supabaseClient) {
      supabaseClient.auth.onAuthStateChange(function () {
        checkUser();
        startUserPolling();
      });
    }
  }

  start();
}());
</script>

<script>
(function(){
  var btn = document.getElementById('ai-chat-btn');
  var panel = document.getElementById('ai-chat');
  var input = document.getElementById('ai-input');
  var send = document.getElementById('ai-send');
  var closeBtn = document.getElementById('ai-close');
  var messages = document.getElementById('ai-messages');
  var suggestions = Array.prototype.slice.call(document.querySelectorAll('.ai-suggestion'));
  var hasWelcomed = false;
  var AI_TRAINING_KEY = '5terrego_ai_training';
  var AI_REMOTE_TRAINING = [];

  var AI_TRAINING = [
    {
      q: 'monterosso vernazza piedi sentiero',
      a: 'Sì, da Monterosso a Vernazza puoi andare a piedi sul Sentiero Azzurro. Calcola circa 1h30–2h, scarpe comode e controlla sempre che il tratto sia aperto.'
    },
    {
      q: 'vernazza monterosso piedi sentiero',
      a: 'Sì, puoi farlo anche da Vernazza a Monterosso. È un tratto panoramico ma con salite: porta acqua e verifica apertura del sentiero.'
    },
    {
      q: 'manarola tramonto sunset',
      a: 'Per il tramonto a Manarola vai verso il viewpoint sopra il porticciolo. È uno dei punti più belli delle Cinque Terre.'
    },
    {
      q: 'riomaggiore manarola piedi via dell amore',
      a: "Tra Riomaggiore e Manarola il percorso storico e la Via dell'Amore. Controlla sempre apertura e ticket prima di partire."
    },
    {
      q: 'corniglia mare spiaggia',
      a: 'Corniglia non è direttamente sul mare come gli altri borghi: è più alta e panoramica. Per il bagno sono più comodi Monterosso o alcune calette raggiungibili a piedi.'
    },
    {
      q: 'miglior borgo prima volta cinque terre',
      a: 'Per una prima visita scegli Vernazza o Manarola: sono scenografiche, facili da capire e perfette per foto e passeggiata.'
    }
  ];

  function toggleChat(open){
    var shouldOpen = typeof open === 'boolean' ? open : !panel.classList.contains('ai-open');
    panel.classList.toggle('ai-open', shouldOpen);
    panel.setAttribute('aria-hidden', shouldOpen ? 'false' : 'true');
    document.body.classList.toggle('ai-chat-active', shouldOpen);

    if (shouldOpen) {
      if (!hasWelcomed) {
        hasWelcomed = true;
        addMessage("Ciao, sono Captain Gull. Conosco scogli, sentieri e borghi meglio di qualsiasi gabbiano. Dimmi dove sei o cosa cerchi e ti guido io.", false, true);
      }
    }
  }

  window.openCaptainGullForPOI = function(poi){
    var name = poi && poi.name ? String(poi.name) : 'POI';
    var description = poi && poi.description && String(poi.description).trim().length > 0
      ? String(poi.description).trim()
      : 'No description available.';

    panel.classList.add('ai-open');
    panel.setAttribute('aria-hidden', 'false');
    document.body.classList.add('ai-chat-active');
    messages.innerHTML = '';
    hasWelcomed = true;
    addMessage(name + String.fromCharCode(10) + String.fromCharCode(10) + description, false, true);
  };

  function addMessage(text, isUser, keepTop){
    var div = document.createElement('div');
    div.className = 'ai-msg ' + (isUser ? 'user' : 'bot');
    div.innerText = text;
    messages.appendChild(div);

    if (keepTop) {
      requestAnimationFrame(function(){
        messages.scrollTop = 0;
      });
      return;
    }

    messages.scrollTop = messages.scrollHeight;
  }

  function normalizeText(value){
    var text = String(value || '').toLowerCase().normalize('NFD');
    var output = '';
    var lastWasSpace = false;
    var i;
    var code;
    var ch;

    for (i = 0; i < text.length; i += 1) {
      ch = text.charAt(i);
      code = text.charCodeAt(i);

      if (code >= 768 && code <= 879) continue;

      if ((code >= 97 && code <= 122) || (code >= 48 && code <= 57)) {
        output += ch;
        lastWasSpace = false;
      } else if (!lastWasSpace) {
        output += ' ';
        lastWasSpace = true;
      }
    }

    return output.trim();
  }

  function readSavedTraining(){
    try {
      return JSON.parse(localStorage.getItem(AI_TRAINING_KEY) || '[]');
    } catch (error) {
      return [];
    }
  }

  async function saveTrainingPair(question, answer){
    var saved;

    if (window.supabase && window.fiveTerreSupabaseClient) {
      try {
        await window.fiveTerreSupabaseClient
          .from('ai_training')
          .insert([{ q: question, a: answer, priority: 10, enabled: true }]);

        AI_REMOTE_TRAINING.push({ q: question, a: answer });
        return 'remote';
      } catch (error) {
        console.warn('Remote AI training save failed:', error.message || error);
      }
    }

    saved = readSavedTraining();
    saved.push({ q: question, a: answer });
    localStorage.setItem(AI_TRAINING_KEY, JSON.stringify(saved));
    return 'local';
  }

  function getAllTraining(){
    return AI_TRAINING.concat(AI_REMOTE_TRAINING).concat(readSavedTraining());
  }

  async function loadRemoteTraining(){
    var response;

    if (!window.supabase || !window.fiveTerreSupabaseClient) return;

    try {
      response = await window.fiveTerreSupabaseClient
        .from('ai_training')
        .select('q,a,priority,enabled')
        .eq('enabled', true)
        .order('priority', { ascending: false });

      if (!response.error && Array.isArray(response.data)) {
        AI_REMOTE_TRAINING = response.data
          .filter(function(item){ return item && item.q && item.a; })
          .map(function(item){ return { q: item.q, a: item.a }; });
      }
    } catch (error) {
      console.warn('AI remote training not available:', error.message || error);
    }
  }

  function countTrainingScore(question, trainingQuestion){
    var q = normalizeText(question);
    var tq = normalizeText(trainingQuestion);
    var words = tq.split(' ');
    var score = 0;

    words.forEach(function(word){
      if (word.length >= 3 && q.indexOf(word) !== -1) score += 1;
    });

    return score;
  }

  function findTrainingAnswer(question){
    var all = getAllTraining();
    var best = null;
    var bestScore = 0;

    all.forEach(function(item){
      var score = countTrainingScore(question, item.q);
      if (score > bestScore) {
        bestScore = score;
        best = item;
      }
    });

    if (best && bestScore >= 2) return best.a;
    return '';
  }

  function handleLearningCommand(text){
    var raw = String(text || '').trim();
    var lower = raw.toLowerCase();
    var body;
    var parts;

    if (lower.indexOf('impara:') !== 0) return '';

    body = raw.slice(7).trim();
    parts = body.split('=>');

    if (parts.length < 2 || !parts[0].trim() || !parts.slice(1).join('=>').trim()) {
      return 'Scrivi così: impara: domanda => risposta';
    }

    saveTrainingPair(parts[0].trim(), parts.slice(1).join('=>').trim()).then(function(mode){
      if (mode === 'remote') {
        addMessage("Perfetto, ho salvato questa risposta per tutti gli utenti.", false);
      } else {
        addMessage('Salvato su questo dispositivo. Per renderlo globale crea la tabella ai_training su Supabase.', false);
      }
    });

    return 'Sto salvando questa risposta...';
  }

  function distanceMeters(a, b){
    var R = 6371000;
    var lat1 = a[0] * Math.PI / 180;
    var lat2 = b[0] * Math.PI / 180;
    var dLat = (b[0] - a[0]) * Math.PI / 180;
    var dLng = (b[1] - a[1]) * Math.PI / 180;
    var x = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
  }

  function getAIData(){
    var api = window.fiveTerreGoAI;
    return {
      places: api && typeof api.getPlaces === 'function' ? api.getPlaces() : [],
      pois: api && typeof api.getPOIs === 'function' ? api.getPOIs() : []
    };
  }

  function findMentionedPlaces(question, places){
    var q = normalizeText(question);
    var found = [];

    places.forEach(function(place){
      var name = normalizeText(place.name);
      if (name && q.indexOf(name) !== -1) found.push(place);
    });

    return found;
  }

  function findMentionedPlace(question, places){
    var found = findMentionedPlaces(question, places);
    return found.length ? found[0] : null;
  }

  function getNearbyPOIs(place, pois){
    if (!place || !place.coords) return [];

    return pois
      .filter(function(poi){
        return poi && Array.isArray(poi.coords) && Number.isFinite(poi.coords[0]) && Number.isFinite(poi.coords[1]);
      })
      .map(function(poi){
        return { poi: poi, distance: distanceMeters(place.coords, poi.coords) };
      })
      .filter(function(item){ return item.distance <= 1600; })
      .sort(function(a, b){ return a.distance - b.distance; })
      .slice(0, 4)
      .map(function(item){ return item.poi; });
  }

  function shortText(text, maxLen){
    text = String(text || '').trim();
    if (text.length <= maxLen) return text;
    return text.slice(0, maxLen) + '...';
  }

  function isDoingQuestion(q){
    return q.indexOf('fare') !== -1 || q.indexOf('do') !== -1 || q.indexOf('see') !== -1 || q.indexOf('visit') !== -1 || q.indexOf('vedere') !== -1;
  }

  function isWhereQuestion(q){
    return q.indexOf('dove') !== -1 || q.indexOf('where') !== -1 || q.indexOf('near') !== -1 || q.indexOf('vicino') !== -1;
  }

  function isSunsetQuestion(q){
    return q.indexOf('tramonto') !== -1 || q.indexOf('sunset') !== -1;
  }

  function formatPlaceAnswer(place, pois, question){
    var q = normalizeText(question);
    var nearby = getNearbyPOIs(place, pois).slice(0, 3);
    var names = nearby.map(function(poi){ return poi.name; }).filter(Boolean);

    if (isSunsetQuestion(q)) {
      if (place.name === 'Manarola') return 'Per il tramonto, Manarola è perfetta: vai verso il viewpoint sopra il porticciolo.';
      return 'Per il tramonto guarda i punti panoramici sul mare. Manarola di solito è la scelta più scenografica.';
    }

    if (isDoingQuestion(q)) {
      if (names.length > 0) return 'A ' + place.name + ' partirei da: ' + names.join(', ') + '.';
      return 'A ' + place.name + ' fai così: borgo, porticciolo, viewpoint e una pausa vista mare.';
    }

    if (isWhereQuestion(q)) {
      if (names.length > 0) return 'Vicino a ' + place.name + ' trovi: ' + names.join(', ') + '.';
      return 'Vicino a ' + place.name + ' non ho ancora POI salvate. Aggiungile e le suggerirò qui.';
    }

    return place.name + ': ' + shortText(place.description || 'borgo delle Cinque Terre.', 105);
  }

  function formatRouteAnswer(fromPlace, toPlace, question){
    var from = fromPlace.name;
    var to = toPlace.name;
    var pair = normalizeText(from + ' ' + to);

    if ((pair.indexOf('monterosso') !== -1 && pair.indexOf('vernazza') !== -1)) {
      return 'Sì, puoi andare a piedi da Monterosso a Vernazza: è il sentiero azzurro più famoso. Calcola circa 1h30–2h, scarpe comode e controlla che il sentiero sia aperto.';
    }

    return 'Puoi spostarti da ' + from + ' a ' + to + ' a piedi solo se il sentiero è aperto. In alternativa il treno è la scelta più semplice e veloce.';
  }

  function buildGuideContext(){
    var data = getAIData();

    return {
      places: data.places.map(function(place){
        return {
          name: place.name || '',
          description: place.description || '',
          coords: place.coords || []
        };
      }).slice(0, 5),
      pois: data.pois.map(function(poi){
        return {
          name: poi.name || '',
          description: poi.description || '',
          type: poi.type || '',
          coords: poi.coords || []
        };
      }).slice(0, 80)
    };
  }

  async function callOpenRouterGuide(question){
    var client = window.fiveTerreSupabaseClient;
    var response;

    if (!client || !client.functions || typeof client.functions.invoke !== 'function') return '';

    try {
      response = await client.functions.invoke('ai', {
        body: {
          question: question,
          language: navigator.language || 'it',
          context: buildGuideContext()
        }
      });

      if (response.error) {
        console.warn('OpenRouter guide error:', response.error.message || response.error);
        return '';
      }

      if (response.data && response.data.reply) return String(response.data.reply);
    } catch (error) {
      console.warn('OpenRouter guide unavailable:', error.message || error);
    }

    return '';
  }

  function simpleAI(question){
    var data = getAIData();
    var q = normalizeText(question);
    var learnedReply = handleLearningCommand(question);
    var trainedReply = findTrainingAnswer(question);
    var mentionedPlaces = findMentionedPlaces(question, data.places);
    var mentionedPlace = mentionedPlaces.length ? mentionedPlaces[0] : null;
    var stopWords = {
      cosa: true, posso: true, fare: true, alla: true, allo: true, alle: true, agli: true, del: true, della: true, delle: true, degli: true,
      con: true, per: true, una: true, uno: true, che: true, dove: true, come: true, sono: true, vorrei: true, consigliami: true,
      what: true, can: true, do: true, see: true, visit: true, near: true, nearby: true, the: true, and: true, for: true, with: true, about: true
    };
    var words = q.split(' ').filter(function(word){ return word.length >= 3 && !stopWords[word]; });
    var matches = [];

    if (learnedReply) return learnedReply;
    if (trainedReply) return trainedReply;

    if (mentionedPlaces.length >= 2) return formatRouteAnswer(mentionedPlaces[0], mentionedPlaces[1], question);
    if (mentionedPlace) return formatPlaceAnswer(mentionedPlace, data.pois, question);

    if (isSunsetQuestion(q)) {
      return 'Per il tramonto scegli Manarola: viewpoint sopra il porticciolo, meglio arrivare un po’ prima.';
    }

    data.pois.forEach(function(poi){
      var searchable = normalizeText((poi.name || '') + ' ' + (poi.description || '') + ' ' + (poi.type || ''));
      var score = 0;
      words.forEach(function(word){ if (searchable.indexOf(word) !== -1) score += 1; });
      if (score > 0) matches.push({ score: score, text: poi.name + (poi.description ? ': ' + shortText(poi.description, 80) : '') });
    });

    data.places.forEach(function(place){
      var searchable = normalizeText((place.name || '') + ' ' + (place.description || ''));
      var score = 0;
      words.forEach(function(word){ if (searchable.indexOf(word) !== -1) score += 1; });
      if (score > 0) matches.push({ score: score, text: place.name + ': ' + shortText(place.description || '', 90) });
    });

    matches.sort(function(a, b){ return b.score - a.score; });

    if(matches.length > 0){
      return matches.slice(0,2).map(function(match){ return match.text; }).join(String.fromCharCode(10));
    }

    return "Ti aiuto volentieri. Scrivimi un borgo o una domanda semplice, tipo: cosa fare a Manarola?";
  }

  async function handleSend(textFromButton){
    var text = String(textFromButton || input.value || '').trim();
    var reply;

    if(!text) return;

    addMessage(text, true);
    input.value = '';

    addMessage('Sta scrivendo...', false);

    reply = await callOpenRouterGuide(text);
    if (!reply) reply = simpleAI(text);

    if (messages.lastChild && messages.lastChild.innerText === 'Sta scrivendo...') {
      messages.removeChild(messages.lastChild);
    }

    window.setTimeout(function(){
      addMessage(reply, false);
    }, 120);
  }

  btn.addEventListener('click', function(){
    if (window.currentFiveTerrePOI && typeof window.openCaptainGullForPOI === 'function') {
      window.openCaptainGullForPOI(window.currentFiveTerrePOI);
      return;
    }

    toggleChat();
  });
  closeBtn.addEventListener('click', function(){ toggleChat(false); });
  send.addEventListener('click', function(){ handleSend(); });
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter') handleSend();
  });

  suggestions.forEach(function(button){
    button.addEventListener('click', function(){
      handleSend(button.innerText);
    });
  });

  loadRemoteTraining();
}());
</script>
