<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>5TerreGo | Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #cfe5f2;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }

    .top-bar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      border-radius: 20px;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .center-brand {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-weight: 800;
      font-size: 14px;
      text-decoration: none;
      white-space: nowrap;
      pointer-events: auto;
      cursor: pointer;
    }

    #weather {
      color: white;
      font-weight: 600;
      padding: 6px 10px;
      white-space: nowrap;
    }

    #search {
      width: 100%;
      padding: 8px 12px;
      border-radius: 999px;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.1);
      color: white;
    }

    #search::placeholder { color: rgba(255,255,255,0.75); }

    #search-results {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 6px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 14px;
      overflow: hidden;
      display: none;
      flex-direction: column;
      z-index: 1001;
      box-shadow: 0 14px 34px rgba(0,0,0,0.25);
    }

    .search-item {
      padding: 11px 12px;
      color: white;
      font-size: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
    }

    .search-item:last-child { border-bottom: none; }

    .search-item:hover { background: rgba(255,255,255,0.1); }

    #login {
      padding: 8px 12px;
      border-radius: 999px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: white;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .blue { color: #1e9bff; }
    .orange { color: #ff8a1d; }

    .label {
      color: white;
      font-weight: 700;
      font-size: 14px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    .poi-label {
      min-width: 30px;
      min-height: 30px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(0,0,0,0.55);
      color: white;
      font-size: 17px;
      border: 1px solid rgba(255,255,255,0.28);
      box-shadow: 0 8px 22px rgba(0,0,0,0.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .leaflet-div-icon {
      background: transparent !important;
      border: none !important;
    }

    .leaflet-tile {
      margin: -1px;
      outline: none;
      border: none;
    }

    .leaflet-pane img {
      image-rendering: auto;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    .leaflet-container {
      background: #f6f1e8 !important;
      transform: translateZ(0);
      will-change: transform;
    }

    .leaflet-control-zoom,
    .leaflet-control-attribution {
      display: none !important;
    }

    .mode-bar { display: flex; gap: 8px; }

    .mode-btn {
      flex: 1;
      padding: 10px;
      border-radius: 999px;
      border: none;
      background: rgba(0,0,0,0.35);
      color: #fff;
      font-weight: 700;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
    }

    .mode-btn.active { background: rgba(0,0,0,0.6); }

    #owner-panel {
      display: none;
      position: fixed;
      bottom: 86px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      padding: 12px;
      border-radius: 18px;
      background: rgba(0,0,0,0.62);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 18px 45px rgba(0,0,0,0.28);
    }

    #owner-panel[aria-hidden="false"] { display: block; }

    #owner-panel input,
    #owner-panel button {
      width: 100%;
      margin-bottom: 7px;
      padding: 10px 12px;
      border: 0;
      border-radius: 12px;
      outline: none;
      font: inherit;
    }

    #owner-panel button {
      margin-bottom: 0;
      font-weight: 800;
      cursor: pointer;
    }

    .bottom-card {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 1000;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      touch-action: pan-y;
      will-change: transform;
    }

    .bottom-card.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .bottom-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
      background: rgba(255,255,255,0.08);
      pointer-events: none;
    }

    .bottom-card .title {
      color: white;
      font-weight: 700;
      padding: 10px;
      pointer-events: none;
    }

    #poi-card {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: #f6f1e8;
      overflow: hidden;
      opacity: 0;
      transform: scale(0.985);
      transition: opacity 0.34s ease, transform 0.34s ease;
    }

    #poi-card.open {
      opacity: 1;
      transform: scale(1);
    }

    #poi-map-preview {
      position: absolute;
      inset: 0;
      background: #f6f1e8;
    }

    #poi-circle {
      position: absolute;
      top: 28%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.88);
      width: min(60vw, 240px);
      height: min(60vw, 240px);
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid rgba(255,255,255,0.9);
      box-shadow: 0 18px 55px rgba(0,0,0,0.22);
      background: #f6f1e8;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.46s ease, transform 0.46s cubic-bezier(.2,.9,.2,1);
    }

    #poi-card.open #poi-circle {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    #poi-circle .leaflet-container {
      width: 100% !important;
      height: 100% !important;
      border-radius: 50%;
      overflow: hidden;
    }

    .poi-content {
      position: absolute;
      top: 49%;
      left: 0;
      right: 0;
      z-index: 3;
      padding: 20px 28px;
      background: transparent;
      color: #000;
      box-shadow: none;
      text-align: center;
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.48s ease, transform 0.48s cubic-bezier(.2,.9,.2,1);
    }

    #poi-card.open .poi-content {
      opacity: 1;
      transform: translateY(0);
    }

    #poi-title {
      font-size: 26px;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 14px;
      letter-spacing: -0.04em;
      text-align: center;
    }

    #poi-desc {
      font-size: 16px;
      line-height: 1.6;
      color: rgba(0,0,0,0.7);
      margin-top: 6px;
      text-align: center;
      max-width: 320px;
      margin-left: auto;
      margin-right: auto;
      max-height: 72px;
      overflow: hidden;
      position: relative;
    }

    #poi-desc.expanded {
      max-height: 220px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    #read-more {
      display: none;
      margin-top: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #1e9bff;
      cursor: pointer;
    }

    #poi-close {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 4;
      width: 42px;
      height: 42px;
      border-radius: 999px;
      background: rgba(0,0,0,0.52);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 22px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 0.34s ease, transform 0.34s ease;
    }

    #poi-directions {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 4;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(0,0,0,0.52);
      color: white;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 0.34s ease, transform 0.34s ease;
    }

    #poi-card.open #poi-directions,
    #poi-card.open #poi-close {
      opacity: 1;
      transform: scale(1);
    }
  </style>
</head>
<body>

<div id="map"></div>

<div class="top-bar">
  <div class="top-row">
    <div id="weather">--</div>

    <a href="https://www.5terrego.com" class="center-brand" target="_blank" rel="noopener noreferrer" aria-label="Apri 5TerreGo.com">
      <span class="blue">5Terre</span><span class="orange">Go</span><span class="blue">.com</span>
    </a>

    <button id="login" type="button">Accedi</button>
  </div>

  <div style="position:relative;">
    <input id="search" placeholder="Search location..." autocomplete="off" />
    <div id="search-results"></div>
  </div>

  <div class="mode-bar">
    <button class="mode-btn active" id="btn-experiences" type="button">Experiences</button>
    <button class="mode-btn" id="btn-stories" type="button">Stories</button>
  </div>
</div>

<div id="owner-panel" aria-hidden="true">
  <input id="poi-name" placeholder="Nome POI" />
  <input id="poi-symbol" placeholder="Simbolo / emoji" maxlength="3" />
  <input id="poi-lat" placeholder="Latitudine" inputmode="decimal" />
  <input id="poi-lng" placeholder="Longitudine" inputmode="decimal" />
  <input id="poi-img" placeholder="URL foto" />
  <input id="poi-email" placeholder="Email owner" inputmode="email" />
  <input id="poi-phone" placeholder="Telefono" inputmode="tel" />
  <input id="poi-description" placeholder="Descrizione POI" />
  <input id="poi-relevance" placeholder="Punteggio rilevanza 1-100" inputmode="numeric" />
  <button id="add-poi" type="button">Aggiungi POI</button>
</div>

<div class="bottom-card" id="card" aria-hidden="true">
  <img id="card-img" src="" alt="" />
  <div class="title" id="card-title"></div>
  <div class="desc" id="card-desc" style="color: rgba(255,255,255,0.8); padding: 0 10px 12px; font-size: 13px; line-height: 1.4;"></div>
</div>

<div id="poi-card" aria-hidden="true">
  <div id="poi-map-preview"></div>
  <div id="poi-circle"></div>
  <div class="poi-content">
    <div id="poi-title"></div>
    <div id="poi-desc"></div>
    <div id="read-more">Read more</div>
  </div>
  <div id="poi-close">←</div>
  <a id="poi-directions" target="_blank" rel="noopener noreferrer">Directions</a>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function () {
  'use strict';

  var SUPABASE_URL = 'https://jpflcbktcnhmlvaibzcw.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_vWugAbu_xtetgvrCh6yKYw_iA8bAXBa';
  var RIOMAGGIORE_IMAGE = 'https://images.pexels.com/photos/11518065/pexels-photo-11518065.jpeg';
  var LOCAL_POI_KEY = '5terrego_pois_backup';
  var AUTO_OPEN_ZOOM = 13;
  var AUTO_OPEN_DISTANCE = 500;
  var AUTO_CLOSE_ZOOM = 12;
  var AUTO_CLOSE_DISTANCE = 800;
  var poiCloseTimer = null;

  var SUPABASE_READY = Boolean(
    window.supabase &&
    SUPABASE_URL &&
    SUPABASE_ANON_KEY &&
    SUPABASE_URL.indexOf('YOUR_PROJECT') === -1 &&
    SUPABASE_ANON_KEY.indexOf('YOUR_PUBLIC') === -1
  );

  var supabaseClient = SUPABASE_READY ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }) : null;

  var places = [
    { name: 'Monterosso', coords: [44.1461, 9.6548], image: 'https://images.pexels.com/photos/15570483/pexels-photo-15570483.jpeg' },
    { name: 'Vernazza', coords: [44.1350, 9.6847], image: 'https://images.pexels.com/photos/31386736/pexels-photo-31386736.jpeg' },
    { name: 'Corniglia', coords: [44.1197, 9.7089], image: 'https://images.pexels.com/photos/164407/pexels-photo-164407.jpeg' },
    { name: 'Manarola', coords: [44.1076, 9.7290], image: 'https://images.pexels.com/photos/632522/pexels-photo-632522.jpeg' },
    { name: 'Riomaggiore', coords: [44.0990, 9.7378], image: RIOMAGGIORE_IMAGE }
  ];

  if (!window.L) {
    throw new Error('Leaflet non caricato. Controlla la connessione o il CDN Leaflet.');
  }

  var map = L.map('map', {
    minZoom: 11,
    zoomControl: false,
    preferCanvas: true,
    inertia: true,
    inertiaDeceleration: 2500,
    inertiaMaxSpeed: 2000,
    easeLinearity: 0.2,
    zoomAnimation: true,
    fadeAnimation: true,
    markerZoomAnimation: true,
    zoomSnap: 0.25,
    zoomDelta: 0.25,
    wheelPxPerZoomLevel: 80,
    wheelDebounceTime: 20,
    updateWhenIdle: false
  }).setView([44.12, 9.71], 12);

  var satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    detectRetina: false,
    keepBuffer: 8,
    updateWhenZooming: false,
    updateWhenIdle: false,
    noWrap: true
  }).addTo(map);

  var roadsLayer = L.tileLayer('https://stamen-tiles.a.ssl.fastly.net/toner-lines/{z}/{x}/{y}.png', {
    maxZoom: 20,
    opacity: 0.82,
    noWrap: true
  }).addTo(map);

  map.setMaxBounds(L.latLngBounds([44.07, 9.58], [44.17, 9.80]));

  var card = document.getElementById('card');
  var cardTitle = document.getElementById('card-title');
  var cardDesc = document.getElementById('card-desc');
  var cardImg = document.getElementById('card-img');
  var ownerPanel = document.getElementById('owner-panel');
  var poiCard = document.getElementById('poi-card');
  var poiTitle = document.getElementById('poi-title');
  var poiDesc = document.getElementById('poi-desc');
  var readMoreBtn = document.getElementById('read-more');
  var poiClose = document.getElementById('poi-close');
  var poiDirections = document.getElementById('poi-directions');
  var poiCircle = document.getElementById('poi-circle');
  var poiMapPreview = document.getElementById('poi-map-preview');
  var loginBtn = document.getElementById('login');
  var addPoiBtn = document.getElementById('add-poi');
  var searchInput = document.getElementById('search');
  var searchResults = document.getElementById('search-results');

  var currentIndex = -1;
  var currentDataset = 'places';
  var poiLayer = L.layerGroup().addTo(map);
  var poiMarkers = [];
  var isProgrammaticMove = false;
  var startX = 0;
  var currentX = 0;
  var isDragging = false;
  var hasMoved = false;
  var currentUser = null;
  var userCheckTimer = null;
  var poiMiniMap = null;

  function readValue(value, fallback) {
    return value === undefined || value === null ? fallback : value;
  }

  function escapeHTML(value) {
    return String(value || '').replace(/[&<>"]/g, function (char) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[char];
    });
  }

  function getPOIEmoji(type, fallback) {
    switch (String(type || '').toLowerCase()) {
      case 'chiesa': return '⛪';
      case 'monumento': return '🏛️';
      case 'sentiero': return '🥾';
      case 'spiaggia': return '🏖️';
      case 'stazione': return '🚉';
      case 'ristorante': return '🍽️';
      case 'bar': return '🍸';
      case 'punto panoramico': return '📍';
      default: return fallback || '📌';
    }
  }

  function parseCoords(raw) {
    var lat;
    var lng;

    if (raw && typeof raw.coords === 'string') {
      var str = raw.coords.trim();
      var parts = str.split(',');

      if (parts.length > 2) {
        lat = Number(String(parts[0]).trim() + '.' + String(parts[1]).trim());
        lng = Number(String(parts[2]).trim() + '.' + String(parts[3]).trim());
      } else {
        lat = Number(String(parts[0]).trim());
        lng = Number(String(parts[1]).trim());
      }

      return { lat: lat, lng: lng };
    }

    lat = Number(readValue(raw.lat, raw.latitude));
    lng = Number(readValue(raw.lng, raw.longitude));

    return { lat: lat, lng: lng };
  }

  function normalizePOI(raw) {
    var parsed;
    var symbol;

    raw = raw || {};
    parsed = parseCoords(raw);
    symbol = raw.symbol || getPOIEmoji(raw.type, '📍');

    return {
      id: raw.id || 'local-' + Date.now() + '-' + Math.random().toString(16).slice(2),
      name: String(raw.name || raw.title || 'POI'),
      symbol: symbol,
      coords: [parsed.lat, parsed.lng],
      lat: parsed.lat,
      lng: parsed.lng,
      image: raw.image || raw.photo_url || raw.img || '',
      description: raw.description || raw.descrizione || '',
      type: raw.type || raw.tipo || '',
      owner_email: raw.owner_email || raw.email || '',
      phone: raw.phone || raw.telephone || '',
      relevance: Number(raw.importance || raw.relevance || raw.score || 0)
    };
  }

  function isValidPOI(poi) {
    return Boolean(poi && Number.isFinite(poi.lat) && Number.isFinite(poi.lng) && poi.name.length > 0);
  }

  function getMinZoomForImportance(importance) {
    var n = Number(importance || 0);
    if (n >= 95) return 11;
    if (n >= 85) return 12;
    if (n >= 75) return 13;
    if (n >= 65) return 14;
    if (n >= 55) return 15;
    if (n >= 40) return 16;
    return 17;
  }

  function updatePOIVisibility() {
    var zoom = map.getZoom();
    poiLayer.clearLayers();

    poiMarkers.forEach(function (item) {
      if (zoom >= getMinZoomForImportance(item.importance)) {
        item.marker.addTo(poiLayer);
      }
    });
  }

  function centerCity(place) {
    isProgrammaticMove = true;
    var zoomLevel = place.name === 'Monterosso' ? 14 : 15;
    map.flyTo(place.coords, zoomLevel, { duration: 1.2 });

    window.setTimeout(function () {
      isProgrammaticMove = false;
    }, 1400);
  }

  function preloadImages() {
    places.forEach(function (place) {
      var img = new Image();
      img.src = place.image;
    });
  }

  function setCardContent(item) {
    cardTitle.innerText = item.name;
    cardImg.src = item.image || 'https://images.pexels.com/photos/632522/pexels-photo-632522.jpeg';
    cardImg.alt = item.name;

    if (item.description && item.description.trim().length > 0) {
      cardDesc.style.display = 'block';
      cardDesc.innerText = item.description;
    } else {
      cardDesc.style.display = 'none';
      cardDesc.innerText = '';
    }
  }

  function destroyPoiMiniMap() {
    if (poiMiniMap) {
      try { poiMiniMap.remove(); } catch (error) {}
      poiMiniMap = null;
    }
    poiCircle.innerHTML = '';
  }

  function closePOICard(immediate) {
    if (poiCloseTimer) {
      window.clearTimeout(poiCloseTimer);
      poiCloseTimer = null;
    }

    poiCard.classList.remove('open');
    poiCard.setAttribute('aria-hidden', 'true');

    if (immediate || poiCard.style.display === 'none') {
      poiCard.style.display = 'none';
      destroyPoiMiniMap();
      return;
    }

    poiCloseTimer = window.setTimeout(function () {
      poiCard.style.display = 'none';
      destroyPoiMiniMap();
      poiCloseTimer = null;
    }, 360);
  }

  function showCityCard(item) {
    closePOICard(true);
    setCardContent(item);
    card.style.display = 'block';
    card.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
    card.setAttribute('aria-hidden', 'false');

    window.requestAnimationFrame(function () {
      card.classList.add('is-visible');
      card.style.transform = 'translateY(0)';
    });
  }

  function hideCard() {
    if (card.getAttribute('aria-hidden') === 'true') return;

    card.classList.remove('is-visible');
    card.setAttribute('aria-hidden', 'true');
    card.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
    card.style.transform = 'translateY(40px)';

    window.setTimeout(function () {
      if (card.getAttribute('aria-hidden') === 'true') {
        card.style.display = 'none';
      }
    }, 300);
  }

  function showCityByIndex(index, shouldCenter) {
    if (shouldCenter === undefined) shouldCenter = true;
    if (index < 0 || index >= places.length) return;

    currentDataset = 'places';
    currentIndex = index;
    var place = places[index];

    if (shouldCenter) centerCity(place);
    showCityCard(place);
  }

  function getClosestCity() {
    var center = map.getCenter();
    var minDist = Infinity;
    var closestIndex = -1;

    places.forEach(function (place, index) {
      var distance = center.distanceTo(L.latLng(place.coords));
      if (distance < minDist) {
        minDist = distance;
        closestIndex = index;
      }
    });

    return { index: closestIndex, distance: minDist };
  }

  function evaluateAutoCard() {
    if (isProgrammaticMove || poiCard.getAttribute('aria-hidden') === 'false') return;

    var zoom = map.getZoom();
    var closest = getClosestCity();

    if (zoom >= AUTO_OPEN_ZOOM && closest.distance < AUTO_OPEN_DISTANCE) {
      if (currentDataset !== 'places' || currentIndex !== closest.index || card.getAttribute('aria-hidden') === 'true') {
        showCityByIndex(closest.index, false);
      }
      return;
    }

    if (zoom < AUTO_CLOSE_ZOOM || closest.distance > AUTO_CLOSE_DISTANCE) {
      hideCard();
    }
  }

  function slideToIndex(nextIndex, direction) {
    if (currentDataset !== 'places') return;

    if (nextIndex < 0 || nextIndex >= places.length || nextIndex === currentIndex) {
      card.style.transition = 'transform 0.2s ease';
      card.style.transform = 'translateX(0)';
      return;
    }

    var place = places[nextIndex];
    var exitX = direction === 'next' ? '-110%' : '110%';
    var enterX = direction === 'next' ? '110%' : '-110%';

    card.style.transition = 'transform 0.25s ease';
    card.style.transform = 'translateX(' + exitX + ')';

    window.setTimeout(function () {
      card.style.transition = 'none';
      card.style.transform = 'translateX(' + enterX + ')';
      currentIndex = nextIndex;
      setCardContent(place);

      window.requestAnimationFrame(function () {
        card.style.transition = 'transform 0.3s ease';
        card.style.transform = 'translateX(0)';
      });

      centerCity(place);
    }, 250);
  }

  function showPOICard(poi) {
    hideCard();
    currentDataset = 'pois';
    currentIndex = -1;

    if (poiCloseTimer) {
      window.clearTimeout(poiCloseTimer);
      poiCloseTimer = null;
    }

    poiCard.classList.remove('open');
    poiCard.style.display = 'block';
    poiCard.setAttribute('aria-hidden', 'false');
    poiTitle.innerText = poi.name;

    var fullText = poi.description && poi.description.trim().length > 0 ? poi.description : 'No description available';
    poiDesc.innerText = fullText;
    poiDesc.classList.remove('expanded');
    poiDesc.style.display = 'block';

    window.setTimeout(function () {
      if (poiDesc.scrollHeight > poiDesc.clientHeight + 10) {
        readMoreBtn.style.display = 'block';
        readMoreBtn.innerText = 'Read more';
      } else {
        readMoreBtn.style.display = 'none';
      }
    }, 50);

    poiMapPreview.style.background = '#f6f1e8';
    destroyPoiMiniMap();

    poiMiniMap = L.map(poiCircle, {
      zoomControl: false,
      attributionControl: false,
      dragging: false,
      scrollWheelZoom: false,
      doubleClickZoom: false,
      touchZoom: false,
      boxZoom: false,
      keyboard: false
    });

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      noWrap: true
    }).addTo(poiMiniMap);

    L.tileLayer('https://stamen-tiles.a.ssl.fastly.net/toner-lines/{z}/{x}/{y}.png', {
      maxZoom: 20,
      opacity: 0.9,
      noWrap: true
    }).addTo(poiMiniMap);

    L.marker(poi.coords, {
      icon: L.divIcon({
        className: 'custom-poi',
        html: '<div class="poi-label">' + escapeHTML(poi.symbol) + '</div>',
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      })
    }).addTo(poiMiniMap);

    poiMiniMap.setView(poi.coords, 18);

    var lat = poi.coords[0];
    var lng = poi.coords[1];
    poiDirections.href = 'https://www.google.com/maps/dir/?api=1&destination=' + lat + ',' + lng;

    window.requestAnimationFrame(function () {
      poiCard.classList.add('open');
    });

    window.setTimeout(function () {
      if (poiMiniMap) {
        poiMiniMap.invalidateSize(true);
        poiMiniMap.setView(poi.coords, 18, { animate: false });
      }
    }, 90);
  }

  function createCityMarkers() {
    places.forEach(function (place, index) {
      L.marker(place.coords, {
        icon: L.divIcon({
          className: 'custom-label',
          html: '<div class="label">' + escapeHTML(place.name) + '</div>'
        })
      }).addTo(map).on('click', function () {
        showCityByIndex(index, true);
      });
    });
  }

  async function loadPOIs() {
    var response;
    var rows = [];

    poiLayer.clearLayers();
    poiMarkers = [];

    if (SUPABASE_READY && supabaseClient) {
      response = await supabaseClient
        .from('pois')
        .select('*')
        .order('importance', { ascending: false, nullsFirst: false });

      if (response.error) {
        console.warn('Supabase POI load failed:', response.error.message);
      } else {
        rows = response.data || [];
      }
    } else {
      rows = JSON.parse(localStorage.getItem(LOCAL_POI_KEY) || '[]');
    }

    rows.map(normalizePOI).filter(isValidPOI).forEach(function (poi) {
      var marker = L.marker(poi.coords, {
        title: poi.name,
        icon: L.divIcon({
          className: 'custom-poi',
          html: '<div class="poi-label">' + escapeHTML(poi.symbol) + '</div>',
          iconSize: [32, 32],
          iconAnchor: [16, 16]
        })
      }).on('click', function () {
        // 🔥 FIX: zoom + center on POI
        isProgrammaticMove = true;
        map.flyTo(poi.coords, 17, { duration: 1.2 });

        setTimeout(function () {
          isProgrammaticMove = false;
        }, 1400);

        showPOICard(poi);
      });

      poiMarkers.push({ marker: marker, importance: poi.relevance || 0, poi: poi });
    });

    updatePOIVisibility();
    renderSearchSuggestions(searchInput.value);
  }

  function saveLocalPOI(poi) {
    var current = JSON.parse(localStorage.getItem(LOCAL_POI_KEY) || '[]');
    current.push(poi);
    localStorage.setItem(LOCAL_POI_KEY, JSON.stringify(current));
  }

  async function addPOI() {
    var name = document.getElementById('poi-name').value.trim();
    var symbol = document.getElementById('poi-symbol').value.trim() || '📍';
    var lat = Number(document.getElementById('poi-lat').value);
    var lng = Number(document.getElementById('poi-lng').value);
    var image = document.getElementById('poi-img').value.trim();
    var ownerEmail = document.getElementById('poi-email').value.trim();
    var phone = document.getElementById('poi-phone').value.trim();
    var description = document.getElementById('poi-description').value.trim();
    var relevance = Number(document.getElementById('poi-relevance').value || 0);

    var poi = normalizePOI({
      name: name,
      symbol: symbol,
      lat: lat,
      lng: lng,
      image: image,
      owner_email: ownerEmail,
      phone: phone,
      description: description,
      relevance: relevance,
      importance: relevance
    });

    if (!isValidPOI(poi)) {
      alert('Dati non validi: nome, latitudine e longitudine sono obbligatori');
      return;
    }

    if (SUPABASE_READY && supabaseClient) {
      var insertResponse = await supabaseClient
        .from('pois')
        .insert([{ name: name, symbol: symbol, lat: lat, lng: lng, image: image, owner_email: ownerEmail, phone: phone, description: description, relevance: relevance, importance: relevance }]);

      if (insertResponse.error) {
        alert('Errore salvataggio: ' + insertResponse.error.message);
        return;
      }
    } else {
      saveLocalPOI(poi);
    }

    await loadPOIs();
    alert('POI salvato');
  }

  function latLngToTile(lat, lng, zoom) {
    var z = Math.round(zoom);
    var n = Math.pow(2, z);
    var x = Math.floor((lng + 180) / 360 * n);
    var y = Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n);
    return { x: x, y: y, z: z };
  }

  function preloadTiles() {
    var center = map.getCenter();
    var tile = latLngToTile(center.lat, center.lng, map.getZoom());

    for (var dx = -2; dx <= 2; dx += 1) {
      for (var dy = -2; dy <= 2; dy += 1) {
        var img = new Image();
        img.src = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/' + tile.z + '/' + (tile.y + dy) + '/' + (tile.x + dx);
      }
    }
  }

  async function updateWeather(lat, lng) {
    try {
      var response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=' + encodeURIComponent(lat) + '&longitude=' + encodeURIComponent(lng) + '&current_weather=true');
      var data = await response.json();
      var temperature = data && data.current_weather ? data.current_weather.temperature : undefined;
      document.getElementById('weather').innerText = temperature === undefined ? '--' : '🌤️ ' + temperature + '°';
    } catch (error) {
      document.getElementById('weather').innerText = '--';
    }
  }

  function setOwnerPanelVisible(visible) {
    ownerPanel.setAttribute('aria-hidden', visible ? 'false' : 'true');
    ownerPanel.style.display = visible ? 'block' : 'none';
  }

  function getUserDisplayName(user) {
    if (!user) return 'User';
    var meta = user.user_metadata || {};
    if (meta.username) return meta.username;
    if (meta.name) return meta.name;
    if (user.email) return user.email.split('@')[0];
    return 'User';
  }

  async function readCurrentUser() {
    try {
      var raw = localStorage.getItem('supabase.auth.token');
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.currentSession && parsed.currentSession.user) {
          return parsed.currentSession.user;
        }
      }
    } catch (error) {}

    if (!supabaseClient) return null;

    var sessionResponse = await supabaseClient.auth.getSession();
    var session = sessionResponse && sessionResponse.data ? sessionResponse.data.session : null;

    if (session && session.user) {
      return session.user;
    }

    var userResponse = await supabaseClient.auth.getUser();
    var user = userResponse && userResponse.data ? userResponse.data.user : null;
    return user || null;
  }

  async function checkUser() {
    var user = await readCurrentUser();
    currentUser = user;

    if (!user) {
      loginBtn.innerText = 'Accedi';
      setOwnerPanelVisible(false);
      return false;
    }

    loginBtn.innerText = 'Hi, ' + getUserDisplayName(user);
    return true;
  }

  function startUserPolling() {
    var tries = 0;

    if (userCheckTimer) {
      clearInterval(userCheckTimer);
      userCheckTimer = null;
    }

    userCheckTimer = setInterval(async function () {
      tries += 1;
      await checkUser();

      if (currentUser || tries >= 12) {
        clearInterval(userCheckTimer);
        userCheckTimer = null;
      }
    }, 250);
  }

  function getSearchResults(query) {
    var q = String(query || '').trim().toLowerCase();
    var results = [];

    if (!q) return results;

    places.forEach(function (p, index) {
      if (p.name.toLowerCase().includes(q)) {
        results.push({ type: 'city', name: p.name, index: index });
      }
    });

    poiMarkers.forEach(function (item) {
      var title = item.marker.options.title || '';
      if (title.toLowerCase().includes(q)) {
        results.push({ type: 'poi', name: title, poiName: title });
      }
    });

    return results;
  }

  function renderSearchSuggestions(value) {
    var results = getSearchResults(value);

    if (!value || results.length === 0) {
      searchResults.style.display = 'none';
      searchResults.innerHTML = '';
      return;
    }

    searchResults.innerHTML = results.slice(0, 8).map(function (r) {
      var label = r.type === 'city' ? 'Village' : 'POI';
      return '<div class="search-item" data-type="' + escapeHTML(r.type) + '" data-name="' + escapeHTML(r.name) + '">' + escapeHTML(r.name) + ' · ' + label + '</div>';
    }).join('');

    searchResults.style.display = 'flex';
  }

  function selectSearchResult(name) {
    var cityIndex = places.findIndex(function (p) { return p.name === name; });
    var poi;
    var latlng;

    if (cityIndex !== -1) {
      showCityByIndex(cityIndex, true);
      return true;
    }

    poi = poiMarkers.find(function (m) {
      return m.marker.options.title === name;
    });

    if (poi) {
      latlng = poi.marker.getLatLng();

      // 🔥 FIX: animated zoom like native maps
      isProgrammaticMove = true;
      map.flyTo(latlng, 17, { duration: 1.2 });

      setTimeout(function () {
        isProgrammaticMove = false;
      }, 1400);

      if (poi.poi) showPOICard(poi.poi);
      return true;
    }

    return false;
  }

  async function geocodeSearch(query) {
    try {
      var response = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(query));
      var data = await response.json();

      if (data && data[0]) {
        var lat = parseFloat(data[0].lat);
        var lon = parseFloat(data[0].lon);
        map.setView([lat, lon], 13);
        updateWeather(lat, lon);
        return true;
      }
    } catch (error) {
      console.warn('Search failed:', error);
    }

    return false;
  }

  function setupEvents() {
    readMoreBtn.addEventListener('click', function () {
      if (poiDesc.classList.contains('expanded')) {
        poiDesc.classList.remove('expanded');
        readMoreBtn.innerText = 'Read more';
      } else {
        poiDesc.classList.add('expanded');
        readMoreBtn.innerText = 'Read less';
      }
    });

    loginBtn.addEventListener('click', function () {
      var baseOrigin = window.location.origin;
      fetch(baseOrigin + '/login.html', { method: 'HEAD' })
        .then(function (res) {
          if (res && res.ok) {
            window.location.href = baseOrigin + '/login.html';
          } else {
            window.location.href = baseOrigin + '/login/index.html';
          }
        })
        .catch(function () {
          window.location.href = baseOrigin + '/login/index.html';
        });
    });

    poiClose.addEventListener('click', function () {
      closePOICard(false);
    });

    addPoiBtn.addEventListener('click', addPOI);

    searchInput.addEventListener('input', function () {
      renderSearchSuggestions(searchInput.value);
    });

    searchInput.addEventListener('keydown', function (event) {
      var query;
      var first;

      if (event.key !== 'Enter') return;
      query = searchInput.value.trim();
      if (!query) return;

      first = getSearchResults(query)[0];
      if (first && selectSearchResult(first.name)) {
        searchResults.style.display = 'none';
        searchInput.blur();
        return;
      }

      geocodeSearch(query).then(function () {
        searchResults.style.display = 'none';
        searchInput.blur();
      });
    });

    searchResults.addEventListener('click', function (e) {
      var item = e.target.closest('.search-item');
      if (!item) return;

      selectSearchResult(item.getAttribute('data-name'));
      searchResults.style.display = 'none';
      searchInput.blur();
    });

    document.addEventListener('click', function (event) {
      if (!searchResults.contains(event.target) && event.target !== searchInput) {
        searchResults.style.display = 'none';
      }
    });

    map.on('moveend zoomend', function () {
      evaluateAutoCard();
      preloadTiles();
      updatePOIVisibility();
    });

    card.addEventListener('touchstart', function (event) {
      if (event.touches.length !== 1) return;
      startX = event.touches[0].clientX;
      currentX = startX;
      isDragging = true;
      hasMoved = false;
      card.style.transition = 'none';
    }, { passive: true });

    card.addEventListener('touchmove', function (event) {
      var delta;
      var blockedRight;
      var blockedLeft;

      if (!isDragging || event.touches.length !== 1) return;

      currentX = event.touches[0].clientX;
      delta = currentX - startX;
      blockedRight = currentIndex === 0 && delta > 0;
      blockedLeft = currentIndex === places.length - 1 && delta < 0;

      if (blockedRight || blockedLeft) delta = 0;
      if (Math.abs(delta) > 4) hasMoved = true;

      card.style.transform = 'translateX(' + delta + 'px)';
    }, { passive: true });

    card.addEventListener('touchend', function () {
      var delta;
      var blockedRight;
      var blockedLeft;

      if (!isDragging) return;

      delta = currentX - startX;
      isDragging = false;
      blockedRight = currentIndex === 0 && delta > 0;
      blockedLeft = currentIndex === places.length - 1 && delta < 0;

      if (!hasMoved || blockedRight || blockedLeft || Math.abs(delta) < 80) {
        card.style.transition = 'transform 0.2s ease';
        card.style.transform = 'translateX(0)';
        return;
      }

      if (delta < -80) {
        slideToIndex(currentIndex + 1, 'next');
        return;
      }

      if (delta > 80) {
        slideToIndex(currentIndex - 1, 'prev');
      }
    });

    card.addEventListener('touchcancel', function () {
      isDragging = false;
      card.style.transition = 'transform 0.2s ease';
      card.style.transform = 'translateX(0)';
    });
  }

  function runTests() {
    console.assert(Array.isArray(places), 'places must be an array');
    console.assert(places.length === 5, '5 cities expected');
    console.assert(places.every(function (place) { return typeof place.name === 'string'; }), 'Each city needs a name');
    console.assert(places.every(function (place) { return Array.isArray(place.coords) && place.coords.length === 2; }), 'Each city needs coords [lat, lng]');
    console.assert(places.every(function (place) { return typeof place.image === 'string' && place.image.indexOf('https://') === 0; }), 'Each city needs a stable image URL');
    console.assert(places[4].name === 'Riomaggiore', 'Riomaggiore must stay as the fifth city');
    console.assert(places[4].image === RIOMAGGIORE_IMAGE, 'Riomaggiore must use the fixed Pexels image');
    console.assert(currentIndex === -1, 'Initial index should be -1');
    console.assert(typeof getClosestCity === 'function', 'getClosestCity function exists');
    console.assert(typeof evaluateAutoCard === 'function', 'evaluateAutoCard function exists');
    console.assert(typeof slideToIndex === 'function', 'slideToIndex function exists');
    console.assert(typeof setCardContent === 'function', 'setCardContent function exists');
    console.assert(typeof normalizePOI === 'function', 'normalizePOI function exists');
    console.assert(typeof loadPOIs === 'function', 'loadPOIs function exists');
    console.assert(typeof updatePOIVisibility === 'function', 'zoom visibility function exists');
    console.assert(typeof getMinZoomForImportance === 'function', 'getMinZoomForImportance function exists');
    console.assert(getMinZoomForImportance(100) <= getMinZoomForImportance(10), 'importance affects zoom');
    console.assert(getMinZoomForImportance(60) >= 15, 'importance 60 should not appear early');
    console.assert(typeof addPOI === 'function', 'addPOI function exists');
    console.assert(typeof setupEvents === 'function', 'setupEvents function exists');
    console.assert(typeof checkUser === 'function', 'checkUser function exists');
    console.assert(typeof readCurrentUser === 'function', 'readCurrentUser function exists');
    console.assert(typeof startUserPolling === 'function', 'startUserPolling function exists');
    console.assert(typeof setOwnerPanelVisible === 'function', 'setOwnerPanelVisible function exists');
    console.assert(typeof showPOICard === 'function', 'showPOICard function exists');
    console.assert(typeof closePOICard === 'function', 'closePOICard function exists');
    console.assert(typeof destroyPoiMiniMap === 'function', 'destroyPoiMiniMap function exists');
    console.assert(typeof renderSearchSuggestions === 'function', 'renderSearchSuggestions function exists');
    console.assert(typeof selectSearchResult === 'function', 'selectSearchResult function exists');
    console.assert(typeof geocodeSearch === 'function', 'geocodeSearch function exists');
    console.assert(document.getElementById('poi-circle') !== null, 'POI circle exists');
    console.assert(document.getElementById('poi-description') !== null, 'POI description input exists');
    console.assert(document.getElementById('search-results') !== null, 'Search results box exists');
    console.assert(document.documentElement.innerHTML.indexOf('await fetch(\'https://nominatim') === -1, 'No top-level await fragment in setupEvents');
    console.assert((supabaseClient && supabaseClient.auth && typeof supabaseClient.auth.getSession === 'function') || supabaseClient === null, 'Supabase client is either ready or safely null');
    console.assert(document.querySelector('.center-brand').href === 'https://www.5terrego.com/', 'Logo links to 5TerreGo.com');
    console.assert(loginBtn.textContent.trim() === 'Accedi', 'Login button starts as Accedi before auth check');
    console.assert(ownerPanel.getAttribute('aria-hidden') === 'true', 'Owner panel starts hidden');
    console.assert(getUserDisplayName({ email: 'test@example.com', user_metadata: {} }) === 'test', 'Display name falls back to email prefix');
    console.assert(normalizePOI({ name: 'X', latitude: '44.1', longitude: '9.7' }).lat === 44.1, 'normalizePOI supports latitude fallback');
    console.assert(normalizePOI({ name: 'Y', coords: '44.2,9.8', type: 'chiesa' }).symbol === '⛪', 'normalizePOI supports coords string and church emoji');
    console.assert(normalizePOI({ name: 'Z', coords: '44.2,9.8', type: 'ristorante' }).symbol === '🍽️', 'normalizePOI supports restaurant emoji');
    console.assert(normalizePOI({ name: 'EU', coords: '44,1004926, 9,7396095' }).lat === 44.1004926, 'normalizePOI supports european decimal coords');
    console.assert(normalizePOI({ name: 'D', coords: '44.2,9.8', description: 'Testo' }).description === 'Testo', 'normalizePOI keeps description');
    console.assert(getSearchResults('ver').some(function (r) { return r.name === 'Vernazza'; }), 'Search suggestions find Vernazza');
    console.assert(roadsLayer && satelliteLayer, 'Satellite and roads overlay are both loaded');
  }

  createCityMarkers();
  preloadImages();
  preloadTiles();
  updateWeather(44.12, 9.71);
  setupEvents();
  runTests();

  setTimeout(function () {
    checkUser();
    startUserPolling();
  }, 250);

  if (supabaseClient) {
    supabaseClient.auth.onAuthStateChange(function () {
      checkUser();
      startUserPolling();
    });
  }

  loadPOIs();
}());
</script>
