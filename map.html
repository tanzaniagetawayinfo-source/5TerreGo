<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>5TerreGo | Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #cfe5f2;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }

    /* ===== SINGLE TOP BAR ===== */
    .top-bar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      border-radius: 20px;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(12px);
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .center-brand {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-weight: 800;
      font-size: 14px;
      pointer-events: none;
    }

    #weather {
      color: white;
      font-weight: 600;
      padding: 6px 10px;
      white-space: nowrap;
    }

    #search {
      width: 100%;
      padding: 8px 12px;
      border-radius: 999px;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.1);
      color: white;
    }

    #search::placeholder {
      color: rgba(255,255,255,0.75);
    }

    #login {
      padding: 8px 12px;
      border-radius: 999px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .blue { color: #1e9bff; }
    .orange { color: #ff8a1d; }

    .label {
      color: white;
      font-weight: 700;
      font-size: 14px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    /* remove white squares from divIcon */
    .leaflet-div-icon {
      background: transparent !important;
      border: none !important;
    }

    /* tile seam fix */
    .leaflet-tile { margin: -0.5px; }
    .leaflet-container { background: #000; }

    /* hide zoom buttons + leaflet attribution */
    .leaflet-control-zoom,
    .leaflet-control-attribution {
      display: none !important;
    }

    .mode-bar {
      display: flex;
      gap: 8px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px;
      border-radius: 999px;
      border: none;
      background: rgba(0,0,0,0.35);
      color: #fff;
      font-weight: 700;
      backdrop-filter: blur(10px);
      cursor: pointer;
    }

    .mode-btn.active { background: rgba(0,0,0,0.6); }

    /* bottom card */
    .bottom-card {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 1000;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
      display: none;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .bottom-card.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .bottom-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
      background: rgba(255,255,255,0.08);
    }

    .bottom-card .title {
      color: white;
      font-weight: 700;
      padding: 10px;
    }
  </style>
</head>
<body>

<div id="map"></div>

<!-- SINGLE ACTION BAR -->
<div class="top-bar">
  <!-- ROW 1: weather - brand - login -->
  <div class="top-row">
    <div id="weather">--</div>

    <a href="https://www.5terrego.com" class="center-brand" target="_blank" style="text-decoration:none;">
      <span class="blue">5Terre</span><span class="orange">Go</span><span class="blue">.com</span>
    </a>

    <button id="login" type="button">Accedi</button>
  </div>

  <!-- ROW 2: search -->
  <input id="search" placeholder="Search location..." />

  <!-- ROW 3: modes -->
  <div class="mode-bar">
    <button class="mode-btn active" id="btn-experiences" type="button">Experiences</button>
    <button class="mode-btn" id="btn-stories" type="button">Stories</button>
  </div>
</div>

<!-- BOTTOM CARD -->
<div class="bottom-card" id="card" aria-hidden="true">
  <img id="card-img" src="" alt="" />
  <div class="title" id="card-title"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const map = L.map('map', {
    minZoom: 11,
    zoomControl: false
  }).setView([44.12, 9.71], 12);

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    detectRetina: true
  }).addTo(map);

  map.setMaxBounds(L.latLngBounds([44.07, 9.58], [44.17, 9.80]));

  const places = [
    { name: 'Monterosso', coords: [44.1461, 9.6548] },
    { name: 'Vernazza', coords: [44.1350, 9.6847] },
    { name: 'Corniglia', coords: [44.1197, 9.7089] },
    { name: 'Manarola', coords: [44.1076, 9.7290] },
    { name: 'Riomaggiore', coords: [44.0990, 9.7378] }
  ];

  const images = [
    'https://cdn.pixabay.com/photo/2016/11/29/05/45/beach-1867271_1280.jpg',
    'https://cdn.pixabay.com/photo/2016/03/27/22/22/italy-1283699_1280.jpg',
    'https://cdn.pixabay.com/photo/2017/06/20/19/22/sea-2424780_1280.jpg',
    'https://cdn.pixabay.com/photo/2016/11/18/15/16/manarola-1838448_1280.jpg',
    'https://cdn.pixabay.com/photo/2015/09/25/10/44/houses-957111_1280.jpg'
  ];

  const card = document.getElementById('card');
  const cardTitle = document.getElementById('card-title');
  const cardImg = document.getElementById('card-img');

  let currentIndex = -1;
  let isProgrammaticMove = false;

  function centerCity(place) {
    isProgrammaticMove = true;
    map.flyTo(place.coords, 14, { duration: 1.2 });
    setTimeout(() => { isProgrammaticMove = false; }, 1300);
  }

  function showCityCard(place, imageUrl) {
    cardTitle.innerText = place.name;
    cardImg.src = imageUrl;
    cardImg.alt = place.name;

    card.style.display = 'block';
    card.setAttribute('aria-hidden', 'false');

    requestAnimationFrame(() => {
      card.classList.add('is-visible');
    });
  }

  function hideCard() {
    if (card.getAttribute('aria-hidden') === 'true') return;

    card.classList.remove('is-visible');
    card.setAttribute('aria-hidden', 'true');

    setTimeout(() => {
      if (card.getAttribute('aria-hidden') === 'true') {
        card.style.display = 'none';
      }
    }, 300);
  }

  function showCityByIndex(index, fromAuto = false) {
    if (index < 0 || index >= places.length) return;

    if (currentIndex === index && card.getAttribute('aria-hidden') === 'false') return;

    currentIndex = index;
    const place = places[index];

    if (!fromAuto) centerCity(place);
    showCityCard(place, images[index % images.length]);
  }

  // MARKERS
  places.forEach((place, index) => {
    const marker = L.marker(place.coords, {
      icon: L.divIcon({
        className: 'custom-label',
        html: `<div class="label">${place.name}</div>`
      })
    }).addTo(map);

    marker.on('click', () => {
      showCityByIndex(index);
    });
  });

  // AUTO OPEN / CLOSE LOGIC
  function getClosestCity() {
    const center = map.getCenter();
    let minDist = Infinity;
    let closestIndex = -1;

    places.forEach((p, i) => {
      const d = center.distanceTo(p.coords);
      if (d < minDist) {
        minDist = d;
        closestIndex = i;
      }
    });

    return { index: closestIndex, distance: minDist };
  }

  map.on('moveend zoomend', () => {
    if (isProgrammaticMove) return;

    const zoom = map.getZoom();
    const { index, distance } = getClosestCity();

    // OPEN when zoomed in AND close to city
    if (zoom >= 13 && distance < 500) {
      showCityByIndex(index, true);
      return;
    }

    // CLOSE when zoomed out OR far
    if (zoom < 12 || distance > 800) {
      hideCard();
    }
  });

  /* ===== SWIPE LOGIC ===== */
  let startX = 0;
  let currentX = 0;
  let isDragging = false;

  card.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX;
    isDragging = true;
  });

  card.addEventListener('touchmove', (e) => {
    if (!isDragging) return;

    currentX = e.touches[0].clientX;
    const delta = currentX - startX;

    card.style.transform = `translateX(${delta}px)`;
  });

  card.addEventListener('touchend', () => {
    if (!isDragging) return;

    const delta = currentX - startX;
    isDragging = false;

    card.style.transition = 'transform 0.3s ease';

    if (delta < -80 && currentIndex < places.length - 1) {
      const next = currentIndex + 1;
      card.style.transform = 'translateX(-100%)';

      setTimeout(() => {
        card.style.transition = 'none';
        card.style.transform = 'translateX(100%)';
        showCityByIndex(next);

        requestAnimationFrame(() => {
          card.style.transition = 'transform 0.3s ease';
          card.style.transform = 'translateX(0)';
        });
      }, 200);

    } else if (delta > 80 && currentIndex > 0) {
      const prev = currentIndex - 1;
      card.style.transform = 'translateX(100%)';

      setTimeout(() => {
        card.style.transition = 'none';
        card.style.transform = 'translateX(-100%)';
        showCityByIndex(prev);

        requestAnimationFrame(() => {
          card.style.transition = 'transform 0.3s ease';
          card.style.transform = 'translateX(0)';
        });
      }, 200);

    } else {
      card.style.transform = 'translateX(0)';
    }
  });

  async function updateWeather(lat, lng) {
    try {
      const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`);
      const data = await response.json();
      const temperature = data.current_weather?.temperature;
      document.getElementById('weather').innerText = temperature === undefined ? '--' : `🌤️ ${temperature}°`;
    } catch {
      document.getElementById('weather').innerText = '--';
    }
  }

  updateWeather(44.12, 9.71);

  document.getElementById('search').addEventListener('keydown', async (event) => {
    if (event.key !== 'Enter') return;

    const query = event.target.value.trim();
    if (!query) return;

    try {
      const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
      const data = await response.json();

      if (data[0]) {
        const lat = parseFloat(data[0].lat);
        const lon = parseFloat(data[0].lon);
        map.setView([lat, lon], 12);
        updateWeather(lat, lon);
      }
    } catch (error) {
      console.warn('Search failed:', error);
    }
  });

  // TESTS
  console.assert(typeof getClosestCity === 'function', 'Closest city fn exists');
  console.assert(Array.isArray(places) && places.length === 5, '5 cities expected');
  console.assert(currentIndex === -1, 'Initial index should be -1');
</script>

</body>
</html>
