<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>5TerreGo | Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #cfe5f2;
      position: fixed;
      inset: 0;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
    }

    .top-bar {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      border-radius: 20px;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .center-brand {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-weight: 800;
      font-size: 14px;
      text-decoration: none;
      white-space: nowrap;
      pointer-events: auto;
      cursor: pointer;
    }

    #weather {
      color: white;
      font-weight: 600;
      padding: 6px 10px;
      white-space: nowrap;
    }

    #search {
      width: 100%;
      padding: 8px 12px;
      border-radius: 999px;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 16px;
    }

    #search::placeholder { color: rgba(255,255,255,0.75); }

    #search-results {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 6px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 14px;
      overflow: hidden;
      display: none;
      flex-direction: column;
      z-index: 1001;
      box-shadow: 0 14px 34px rgba(0,0,0,0.25);
    }

    .search-item {
      padding: 11px 12px;
      color: white;
      font-size: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
    }

    .search-item:last-child { border-bottom: none; }
    .search-item:hover { background: rgba(255,255,255,0.1); }

    #login {
      padding: 8px 12px;
      border-radius: 999px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: white;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .blue { color: #1e9bff; }
    .orange { color: #ff8a1d; }

    .label {
      color: white;
      font-weight: 700;
      font-size: 14px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    .poi-label {
      min-width: 30px;
      min-height: 30px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(0,0,0,0.55);
      color: white;
      font-size: 17px;
      border: 1px solid rgba(255,255,255,0.28);
      box-shadow: 0 8px 22px rgba(0,0,0,0.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .leaflet-div-icon {
      background: transparent !important;
      border: none !important;
    }

    .leaflet-tile {
      margin: -1px;
      outline: none;
      border: none;
    }

    .leaflet-pane img {
      image-rendering: auto;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    .leaflet-layer {
      transition: opacity 0.75s cubic-bezier(.22,.61,.36,1);
      will-change: opacity;
    }

    .leaflet-container {
      background: #f6f1e8 !important;
      transform: translateZ(0);
      will-change: transform;
    }

    .leaflet-control-zoom,
    .leaflet-control-attribution {
      display: none !important;
    }

    .mode-bar { display: flex; gap: 8px; }

    .mode-btn {
      flex: 1;
      padding: 10px;
      border-radius: 999px;
      border: none;
      background: rgba(0,0,0,0.35);
      color: #fff;
      font-weight: 700;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
    }

    .mode-btn.active { background: rgba(0,0,0,0.6); }

    #owner-panel {
      display: none;
      position: fixed;
      bottom: 86px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      padding: 12px;
      border-radius: 18px;
      background: rgba(0,0,0,0.62);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 18px 45px rgba(0,0,0,0.28);
    }

    #owner-panel[aria-hidden="false"] { display: block; }

    #owner-panel input,
    #owner-panel button {
      width: 100%;
      margin-bottom: 7px;
      padding: 10px 12px;
      border: 0;
      border-radius: 12px;
      outline: none;
      font: inherit;
    }

    #owner-panel button {
      margin-bottom: 0;
      font-weight: 800;
      cursor: pointer;
    }

    .bottom-card {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 1000;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      will-change: transform, opacity;
    }

    .bottom-card.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .card-media {
      position: relative;
      width: 100%;
      height: 140px;
      overflow: hidden;
      background: rgba(255,255,255,0.08);
    }

    .bottom-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: rgba(255,255,255,0.08);
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .card-live-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: calc((100vw - 24px) * 9 / 16);
      min-width: 100%;
      min-height: 100%;
      border: 0;
      opacity: 0;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1.18);
      transform-origin: center center;
      transition: opacity 0.35s ease;
    }

    .card-media.live-ready img {
      opacity: 0;
    }

    .card-media.live-ready .card-live-frame {
      opacity: 1;
    }

    .card-live-touch-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      background: transparent;
      touch-action: none;
    }

    .card-live-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 4;
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(0,0,0,0.58);
      color: white;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.04em;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.28s ease, transform 0.28s ease;
      pointer-events: none;
    }

    .card-media.live-ready .card-live-badge {
      opacity: 1;
      transform: translateY(0);
    }

    .bottom-card .title {
      color: white;
      font-weight: 700;
      padding: 10px;
      pointer-events: none;
    }

    #poi-card {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: #f6f1e8;
      overflow: hidden;
      opacity: 0;
      transform: scale(0.985);
      transition: opacity 0.34s ease, transform 0.34s ease;
    }

    #poi-card.open {
      opacity: 1;
      transform: scale(1);
    }

    #poi-map-preview {
      position: absolute;
      inset: 0;
      background: #f6f1e8;
    }

    #poi-circle {
      position: absolute;
      top: 28%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.88);
      width: min(60vw, 240px);
      height: min(60vw, 240px);
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid rgba(255,255,255,0.9);
      box-shadow: 0 18px 55px rgba(0,0,0,0.22);
      background: #f6f1e8;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.46s ease, transform 0.46s cubic-bezier(.2,.9,.2,1);
    }

    #poi-card.open #poi-circle {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    #poi-circle .leaflet-container {
      width: 100% !important;
      height: 100% !important;
      border-radius: 50%;
      overflow: hidden;
    }

    .poi-content {
      position: absolute;
      top: 49%;
      left: 0;
      right: 0;
      z-index: 3;
      padding: 20px 28px;
      background: transparent;
      color: #000;
      box-shadow: none;
      text-align: center;
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.48s ease, transform 0.48s cubic-bezier(.2,.9,.2,1);
    }

    #poi-card.open .poi-content {
      opacity: 1;
      transform: translateY(0);
    }

    #poi-title {
      font-size: 26px;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 14px;
      letter-spacing: -0.04em;
      text-align: center;
    }

    #poi-desc {
      font-size: 16px;
      line-height: 1.6;
      color: rgba(0,0,0,0.7);
      margin-top: 6px;
      text-align: center;
      max-width: 320px;
      margin-left: auto;
      margin-right: auto;
      max-height: 72px;
      overflow: hidden;
      position: relative;
    }

    #poi-desc.expanded {
      max-height: 220px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    #read-more {
      display: none;
      margin-top: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #1e9bff;
      cursor: pointer;
    }

    #poi-close {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 4;
      width: 42px;
      height: 42px;
      border-radius: 999px;
      background: rgba(0,0,0,0.52);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 22px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 0.34s ease, transform 0.34s ease;
    }

    #poi-directions {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 4;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(0,0,0,0.52);
      color: white;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 0.34s ease, transform 0.34s ease;
    }

    #poi-card.open #poi-directions,
    #poi-card.open #poi-close {
      opacity: 1;
      transform: scale(1);
    }
  </style>
</head>
<body>

<div id="map"></div>

<div class="top-bar">
  <div class="top-row">
    <div id="weather">--</div>

    <a href="https://www.5terrego.com" class="center-brand" target="_blank" rel="noopener noreferrer" aria-label="Apri 5TerreGo.com">
      <span class="blue">5Terre</span><span class="orange">Go</span><span class="blue">.com</span>
    </a>

    <button id="login" type="button">Accedi</button>
  </div>

  <div style="position:relative;">
    <input id="search" placeholder="Search location..." autocomplete="off" />
    <div id="search-results"></div>
  </div>

  <div class="mode-bar">
    <button class="mode-btn active" id="btn-experiences" type="button">Experiences</button>
    <button class="mode-btn" id="btn-stories" type="button">Stories</button>
  </div>
</div>

<div id="owner-panel" aria-hidden="true">
  <input id="poi-name" placeholder="Nome POI" />
  <input id="poi-symbol" placeholder="Simbolo / emoji" maxlength="3" />
  <input id="poi-lat" placeholder="Latitudine" inputmode="decimal" />
  <input id="poi-lng" placeholder="Longitudine" inputmode="decimal" />
  <input id="poi-img" placeholder="URL foto" />
  <input id="poi-email" placeholder="Email owner" inputmode="email" />
  <input id="poi-phone" placeholder="Telefono" inputmode="tel" />
  <input id="poi-description" placeholder="Descrizione POI" />
  <input id="poi-relevance" placeholder="Punteggio rilevanza 1-100" inputmode="numeric" />
  <button id="add-poi" type="button">Aggiungi POI</button>
</div>

<div class="bottom-card" id="card" aria-hidden="true">
  <div class="card-media" id="card-media">
    <img id="card-img" src="" alt="" />
    <iframe id="card-live" class="card-live-frame" title="Live webcam" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    <div id="card-live-touch-layer" class="card-live-touch-layer" aria-hidden="true"></div>
    <div class="card-live-badge">LIVE</div>
  </div>
  <div class="title" id="card-title"></div>
  <div class="desc" id="card-desc" style="color: rgba(255,255,255,0.8); padding: 0 10px 12px; font-size: 13px; line-height: 1.4;"></div>
</div>

<div id="poi-card" aria-hidden="true">
  <div id="poi-map-preview"></div>
  <div id="poi-circle"></div>
  <div class="poi-content">
    <div id="poi-title"></div>
    <div id="poi-desc"></div>
    <div id="read-more">Read more</div>
  </div>
  <div id="poi-close">←</div>
  <a id="poi-directions" target="_blank" rel="noopener noreferrer">Directions</a>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function () {
  'use strict';

  var SUPABASE_URL = 'https://jpflcbktcnhmlvaibzcw.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_vWugAbu_xtetgvrCh6yKYw_iA8bAXBa';
  var RIOMAGGIORE_IMAGE = 'https://images.pexels.com/photos/11518065/pexels-photo-11518065.jpeg';
  var LOCAL_POI_KEY = '5terrego_pois_backup';
  var AUTO_OPEN_ZOOM = 13;
  var AUTO_OPEN_DISTANCE = 500;
  var AUTO_CLOSE_ZOOM = 12;
  var AUTO_CLOSE_DISTANCE = 800;
  var poiCloseTimer = null;
  var cityCardManuallyClosed = false;
  var cityCardHasSwitchedOnce = false;
  var cityCardNudgeTimers = [];
  var cityCardNudgeInterval = null;

  var SUPABASE_READY = Boolean(
    window.supabase &&
    SUPABASE_URL &&
    SUPABASE_ANON_KEY &&
    SUPABASE_URL.indexOf('YOUR_PROJECT') === -1 &&
    SUPABASE_ANON_KEY.indexOf('YOUR_PUBLIC') === -1
  );

  var supabaseClient = SUPABASE_READY ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }) : null;

  var places = [
    { name: 'Monterosso', coords: [44.1461, 9.6548], image: 'https://images.pexels.com/photos/15570483/pexels-photo-15570483.jpeg', liveVideoId: 'Mjrd1nmlW5s' },
    { name: 'Vernazza', coords: [44.1350, 9.6847], image: 'https://images.pexels.com/photos/31386736/pexels-photo-31386736.jpeg', liveVideoId: 'YfKWbnMCNZ8' },
    { name: 'Corniglia', coords: [44.1197, 9.7089], image: 'https://images.pexels.com/photos/164407/pexels-photo-164407.jpeg', liveVideoId: 'BhPxgJ3w8Ag' },
    { name: 'Manarola', coords: [44.1076, 9.7290], image: 'https://images.pexels.com/photos/632522/pexels-photo-632522.jpeg', liveVideoId: 'Xmv0LbyZPVU' },
    { name: 'Riomaggiore', coords: [44.0990, 9.7378], image: RIOMAGGIORE_IMAGE, liveVideoId: 'A7oGJdUmVkg' }
  ];

  var ferryPorts = [];

  if (!window.L) {
    throw new Error('Leaflet non caricato. Controlla la connessione o il CDN Leaflet.');
  }

  var map = L.map('map', {
    minZoom: 11,
    zoomControl: false,
    preferCanvas: true,
    inertia: true,
    inertiaDeceleration: 2500,
    inertiaMaxSpeed: 2000,
    easeLinearity: 0.2,
    zoomAnimation: true,
    fadeAnimation: true,
    markerZoomAnimation: true,
    zoomSnap: 0.25,
    zoomDelta: 0.25,
    wheelPxPerZoomLevel: 80,
    wheelDebounceTime: 20,
    updateWhenIdle: false
  }).setView([44.12, 9.71], 12);

  var satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    detectRetina: false,
    keepBuffer: 8,
    updateWhenZooming: false,
    updateWhenIdle: false,
    noWrap: true
  }).addTo(map);

  var roadsLayer = L.tileLayer('https://stamen-tiles.a.ssl.fastly.net/toner-lines/{z}/{x}/{y}.png', {
    maxZoom: 20,
    opacity: 0.82,
    noWrap: true
  }).addTo(map);

  var whiteLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
    maxZoom: 20,
    opacity: 0,
    subdomains: 'abcd',
    noWrap: true
  }).addTo(map);

  var labelsLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', {
    maxZoom: 20,
    opacity: 0,
    subdomains: 'abcd',
    noWrap: true
  }).addTo(map);

  var ferryRoutesLayer = L.layerGroup().addTo(map);
  var trailsLayer = L.layerGroup().addTo(map);
  var TRAILS_ENDPOINTS = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter',
    'https://overpass.openstreetmap.ru/api/interpreter'
  ];
  var TRAILS_CACHE_KEY = '5terrego_osm_important_trails_cache_v2';
  var IMPORTANT_TRAIL_KEYWORDS = [
    'sentiero azzurro',
    'blue path',
    'sva',
    'av5t',
    '592',
    '593',
    '590',
    '591',
    '531',
    '506',
    '507',
    'monterosso',
    'vernazza',
    'corniglia',
    'manarola',
    'riomaggiore'
  ];
  var TRAILS_BBOX = {
    south: 44.085,
    west: 9.625,
    north: 44.158,
    east: 9.755
  };

  var trails = [];

  function bringLayerGroupToFront(group) {
    if (!group || typeof group.eachLayer !== 'function') return;

    group.eachLayer(function (layer) {
      if (layer && typeof layer.bringToFront === 'function') {
        layer.bringToFront();
      }
    });
  }

  function getTrailStyle() {
    return {
      color: '#000000',
      weight: 1,
      opacity: map.getZoom() >= 12 ? 0.78 : 0,
      dashArray: null,
      lineCap: 'round',
      lineJoin: 'round'
    };
  }

  function getTrailName(tags) {
    tags = tags || {};
    return tags.name || tags.ref || tags.operator || 'Trail';
  }

  function getTrailSearchText(tags) {
    tags = tags || {};
    return [
      tags.name,
      tags.ref,
      tags.operator,
      tags.description,
      tags.route,
      tags.network,
      tags.sac_scale
    ].filter(Boolean).join(' ').toLowerCase();
  }

  function isImportantTrail(tags) {
    var text = getTrailSearchText(tags);

    if (!text) return false;

    return IMPORTANT_TRAIL_KEYWORDS.some(function (keyword) {
      return text.indexOf(keyword) !== -1;
    });
  }

  function isTrailPOI(poi) {
    return Boolean(poi && isValidPOI(poi) && String(poi.type || '').toLowerCase() === 'sentiero');
  }

  function getTrailPOIs() {
    return poiMarkers
      .map(function (item) { return item.poi; })
      .filter(isTrailPOI);
  }

  function distancePointToTrail(point, trailCoords) {
    var minDistance = Infinity;
    var i;
    var distance;

    if (!point || !Array.isArray(trailCoords)) return minDistance;

    for (i = 0; i < trailCoords.length; i += 1) {
      distance = map.distance(point, trailCoords[i]);
      if (distance < minDistance) minDistance = distance;
    }

    return minDistance;
  }

  function getConnectedTrailPOIs(trail) {
    var maxDistanceMeters = 120;

    if (!trail || !Array.isArray(trail.coords)) return [];

    return getTrailPOIs().filter(function (poi) {
      return distancePointToTrail(poi.coords, trail.coords) <= maxDistanceMeters;
    });
  }

  function canShowTrail(trail) {
    return getConnectedTrailPOIs(trail).length >= 2;
  }

  function addTrails() {
    trailsLayer.clearLayers();

    trails.forEach(function (trail) {
      var connectedPOIs;
      var popupHtml;

      if (!trail || !Array.isArray(trail.coords) || trail.coords.length < 2) return;

      connectedPOIs = getConnectedTrailPOIs(trail);
      if (connectedPOIs.length < 2) return;

      popupHtml = '<strong>' + escapeHTML(trail.name || 'Trail') + '</strong>' +
        '<br><span>' + connectedPOIs.map(function (poi) {
          return escapeHTML(poi.name);
        }).join(' → ') + '</span>';

      L.polyline(trail.coords, getTrailStyle()).addTo(trailsLayer).bindTooltip(trail.name || 'Trail', {
        permanent: false,
        direction: 'top',
        className: 'trail-tooltip'
      }).bindPopup(popupHtml);
    });

    bringLayerGroupToFront(trailsLayer);
  }

  function buildTrailsOverpassQuery() {
    var bbox = TRAILS_BBOX.south + ',' + TRAILS_BBOX.west + ',' + TRAILS_BBOX.north + ',' + TRAILS_BBOX.east;

    return '[out:json][timeout:25];' +
      '(' +
      'way["highway"~"path|footway|steps|track"]["foot"!="no"]["name"](' + bbox + ');' +
      'way["highway"~"path|footway|steps|track"]["foot"!="no"]["ref"](' + bbox + ');' +
      'way["sac_scale"]["name"](' + bbox + ');' +
      'way["trail_visibility"]["name"](' + bbox + ');' +
      ');' +
      'out geom;';
  }

  function parseOverpassTrails(data) {
    var parsed = [];

    if (!data || !Array.isArray(data.elements)) return parsed;

    data.elements.forEach(function (element) {
      var coords;

      if (element.type !== 'way') return;

      if (Array.isArray(element.geometry)) {
        coords = element.geometry.map(function (point) {
          return [point.lat, point.lon];
        }).filter(function (point) {
          return Number.isFinite(point[0]) && Number.isFinite(point[1]);
        });
      }

      if (!coords || coords.length < 2) return;

      if (!isImportantTrail(element.tags)) return;

      parsed.push({
        id: element.id,
        name: getTrailName(element.tags),
        coords: coords,
        tags: element.tags || {}
      });
    });

    return parsed;
  }

  function readCachedTrails() {
    try {
      return JSON.parse(localStorage.getItem(TRAILS_CACHE_KEY) || '[]');
    } catch (error) {
      return [];
    }
  }

  function writeCachedTrails(items) {
    try {
      localStorage.setItem(TRAILS_CACHE_KEY, JSON.stringify(items));
    } catch (error) {}
  }

  async function loadPreciseTrails() {
    var cached = readCachedTrails();
    var query = buildTrailsOverpassQuery();
    var endpointIndex;
    var response;
    var data;
    var parsed;

    if (cached.length) {
      trails = cached;
      addTrails();
      updateMapVisualByZoom();
    }

    for (endpointIndex = 0; endpointIndex < TRAILS_ENDPOINTS.length; endpointIndex += 1) {
      try {
        response = await fetch(TRAILS_ENDPOINTS[endpointIndex] + '?data=' + encodeURIComponent(query), {
          method: 'GET',
          cache: 'force-cache'
        });

        if (!response.ok) throw new Error('Overpass trails request failed');

        data = await response.json();
        parsed = parseOverpassTrails(data);

        if (!parsed.length) continue;

        trails = parsed;
        writeCachedTrails(trails);
        addTrails();
        bringLayerGroupToFront(trailsLayer);
        updateMapVisualByZoom();
        return;
      } catch (error) {
        console.warn('OSM trails endpoint failed:', TRAILS_ENDPOINTS[endpointIndex], error);
      }
    }
  }

  function createSeaArc(p1, p2, segments) {
    var lat1 = p1[0];
    var lng1 = p1[1];
    var lat2 = p2[0];
    var lng2 = p2[1];
    var midLat = (lat1 + lat2) / 2;
    var midLng = (lng1 + lng2) / 2;
    var distance = Math.abs(lng2 - lng1);
    var offset = 0.018 + distance * 0.45;
    var control = [midLat - 0.003, midLng - offset];
    var points = [];
    var i;
    var t;
    var lat;
    var lng;

    for (i = 0; i <= segments; i += 1) {
      t = i / segments;
      lat = (1 - t) * (1 - t) * lat1 + 2 * (1 - t) * t * control[0] + t * t * lat2;
      lng = (1 - t) * (1 - t) * lng1 + 2 * (1 - t) * t * control[1] + t * t * lng2;
      points.push([lat, lng]);
    }

    return points;
  }

  function getFerryPOIs() {
    return poiMarkers
      .map(function (m) { return m.poi; })
      .filter(function (p) {
        return p && isValidPOI(p) && String(p.type || '').toLowerCase() === 'ferry';
      })
      .sort(function (a, b) {
        if (a.lng === b.lng) return b.lat - a.lat;
        return a.lng - b.lng;
      });
  }

  function getNearestFerryPort(sourcePort, allPorts) {
    var nearest = null;
    var minDist = Infinity;
    var i;
    var dist;

    for (i = 0; i < allPorts.length; i += 1) {
      if (allPorts[i].id === sourcePort.id) continue;

      dist = map.distance(sourcePort.coords, allPorts[i].coords);

      if (dist < minDist) {
        minDist = dist;
        nearest = allPorts[i];
      }
    }

    return nearest;
  }

  function addFerryRoutes() {
    var i;
    var arc;
    var fromPort;
    var toPort;
    var routeKey;
    var usedRoutes = {};

    ferryRoutesLayer.clearLayers();
    ferryPorts = getFerryPOIs();

    if (ferryPorts.length < 2) return;

    for (i = 0; i < ferryPorts.length - 1; i += 1) {
      fromPort = ferryPorts[i];
      toPort = ferryPorts[i + 1];

      if (!fromPort || !toPort) continue;

      routeKey = [fromPort.id, toPort.id].sort().join('::');
      if (usedRoutes[routeKey]) continue;
      usedRoutes[routeKey] = true;

      arc = createSeaArc(fromPort.coords, toPort.coords, 32);

      L.polyline(arc, {
        color: '#00e0ff',
        weight: 1,
        opacity: 0.95,
        dashArray: '8, 10',
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(ferryRoutesLayer);
    }
  }

  function updateMapVisualByZoom() {
    var z = map.getZoom();
    var raw = Math.min(1, Math.max(0, (z - 14.75) / 3.75));
    var t = raw * raw * (3 - 2 * raw);
    var satelliteOpacity = Math.max(0.08, 1 - t);
    var roadsOpacity = 0.82 * (1 - t * 0.72);
    var whiteOpacity = t;
    var labelsOpacity = Math.max(0, (t - 0.18) / 0.82);

    satelliteLayer.setOpacity(satelliteOpacity);
    roadsLayer.setOpacity(roadsOpacity);
    whiteLayer.setOpacity(whiteOpacity);
    labelsLayer.setOpacity(labelsOpacity);

    ferryRoutesLayer.eachLayer(function (layer) {
      layer.setStyle({ opacity: 0.85 * (1 - t * 0.2) });
    });

    trailsLayer.eachLayer(function (layer) {
      layer.setStyle(getTrailStyle());
    });
  }

  function isIOSDevice() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }

  function readValue(value, fallback) {
    return value === undefined || value === null ? fallback : value;
  }

  function escapeHTML(value) {
    return String(value || '').replace(/[&<>"]/g, function (char) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[char];
    });
  }

  function getPOIEmoji(type, fallback) {
    switch (String(type || '').toLowerCase()) {
      case 'chiesa': return '⛪';
      case 'monumento': return '🏛️';
      case 'sentiero': return '🥾';
      case 'spiaggia': return '🏖️';
      case 'stazione': return '🚉';
      case 'ristorante': return '🍽️';
      case 'bar': return '🍸';
      case 'ferry': return '⛴️';
      case 'punto panoramico': return '📍';
      default: return fallback || '📌';
    }
  }

  function parseCoords(raw) {
    var lat;
    var lng;
    var str;
    var parts;

    if (raw && typeof raw.coords === 'string') {
      str = raw.coords.trim();
      parts = str.split(',');

      if (parts.length > 2) {
        lat = Number(String(parts[0]).trim() + '.' + String(parts[1]).trim());
        lng = Number(String(parts[2]).trim() + '.' + String(parts[3]).trim());
      } else {
        lat = Number(String(parts[0]).trim());
        lng = Number(String(parts[1]).trim());
      }

      return { lat: lat, lng: lng };
    }

    lat = Number(readValue(raw.lat, raw.latitude));
    lng = Number(readValue(raw.lng, raw.longitude));

    return { lat: lat, lng: lng };
  }

  function normalizePOI(raw) {
    var parsed;
    var symbol;

    raw = raw || {};
    parsed = parseCoords(raw);
    symbol = raw.symbol || getPOIEmoji(raw.type || raw.tipo, '📍');

    return {
      id: raw.id || 'local-' + Date.now() + '-' + Math.random().toString(16).slice(2),
      name: String(raw.name || raw.title || 'POI'),
      symbol: symbol,
      coords: [parsed.lat, parsed.lng],
      lat: parsed.lat,
      lng: parsed.lng,
      image: raw.image || raw.photo_url || raw.img || '',
      description: raw.description || raw.descrizione || '',
      type: raw.type || raw.tipo || '',
      owner_email: raw.owner_email || raw.email || '',
      phone: raw.phone || raw.telephone || '',
      relevance: Number(raw.importance || raw.relevance || raw.score || 0)
    };
  }

  function isValidPOI(poi) {
    return Boolean(poi && Number.isFinite(poi.lat) && Number.isFinite(poi.lng) && poi.name.length > 0);
  }

  function getMinZoomForImportance(importance) {
    var n = Number(importance || 0);
    if (n >= 95) return 11;
    if (n >= 85) return 12;
    if (n >= 75) return 13;
    if (n >= 65) return 14;
    if (n >= 55) return 15;
    if (n >= 40) return 16;
    return 17;
  }

  function updatePOIVisibility() {
    var zoom = map.getZoom();

    poiMarkers.forEach(function (item) {

  function openPOIWithMapMove(poi, sourceEvent) {

  function getCityCardNudgeDirection() {
    var citiesBefore = currentIndex;
    var citiesAfter = places.length - 1 - currentIndex;

  function nudgeCityCard() {
    var direction;
    var distance;
    var secondDistance;

    if (cityCardHasSwitchedOnce) return;
    if (isDragging) return;
    if (currentDataset !== 'places') return;
    if (currentIndex < 0) return;
    if (card.getAttribute('aria-hidden') === 'true') return;
    if (poiCard.getAttribute('aria-hidden') === 'false') return;

    direction = getCityCardNudgeDirection();
    distance = direction * 14;
    secondDistance = direction * 22;

    card.style.transition = 'transform 0.18s cubic-bezier(.22,.61,.36,1)';
    card.style.transform = 'translateX(' + distance + 'px)';

    window.setTimeout(function () {
      if (cityCardHasSwitchedOnce || isDragging || card.getAttribute('aria-hidden') === 'true') return;
      card.style.transition = 'transform 0.16s cubic-bezier(.22,.61,.36,1)';
      card.style.transform = 'translateX(0)';
    }, 180);

    window.setTimeout(function () {
      if (cityCardHasSwitchedOnce || isDragging || card.getAttribute('aria-hidden') === 'true') return;
      card.style.transition = 'transform 0.2s cubic-bezier(.22,.61,.36,1)';
      card.style.transform = 'translateX(' + secondDistance + 'px)';
    }, 340);

    window.setTimeout(function () {
      if (isDragging || card.getAttribute('aria-hidden') === 'true') return;
      card.style.transition = 'transform 0.34s cubic-bezier(.22,.61,.36,1)';
      card.style.transform = 'translateX(0)';
    }, 560);

    cityCardNudgeTimers.push(window.setTimeout(nudgeCityCard, 1200));
    cityCardNudgeTimers.push(window.setTimeout(nudgeCityCard, 3000));

    cityCardNudgeTimers.push(window.setTimeout(function () {
      nudgeCityCard();
      cityCardNudgeInterval = window.setInterval(nudgeCityCard, 5000);
    }, 5000));

  function getClosestCity() {
    var center = map.getCenter();
    var minDist = Infinity;
    var closestIndex = -1;

    places.forEach(function (place, index) {
      var distance = center.distanceTo(L.latLng(place.coords));
      if (distance < minDist) {
        minDist = distance;
        closestIndex = index;
      }
    });

    return { index: closestIndex, distance: minDist };
  }

  function evaluateAutoCard() {
    if (isProgrammaticMove || poiCard.getAttribute('aria-hidden') === 'false') return;

    var zoom = map.getZoom();
    var closest = getClosestCity();

    if (cityCardManuallyClosed && closest.index === currentIndex) return;
    if (cityCardManuallyClosed && closest.index !== currentIndex) cityCardManuallyClosed = false;

    if (zoom >= AUTO_OPEN_ZOOM && closest.distance < AUTO_OPEN_DISTANCE) {
      if (currentDataset !== 'places' || currentIndex !== closest.index || card.getAttribute('aria-hidden') === 'true') {
        showCityByIndex(closest.index, false);
      }
      return;
    }

    if (zoom < AUTO_CLOSE_ZOOM || closest.distance > AUTO_CLOSE_DISTANCE) {
      hideCard();
    }

  async function loadPOIs() {
    var response;
    var rows = [];

    poiLayer.clearLayers();
    poiMarkers = [];

    if (SUPABASE_READY && supabaseClient) {
      response = await supabaseClient
        .from('pois')
        .select('*')
        .order('importance', { ascending: false, nullsFirst: false });

      if (response.error) {
        console.warn('Supabase POI load failed:', response.error.message);
      } else {
        rows = response.data || [];
      }
    } else {

        })

      });

      poiMarkers.push({ marker: marker, importance: poi.relevance || 0, poi: poi });
    });

    updatePOIVisibility();
    addFerryRoutes();
    addTrails();
    bringLayerGroupToFront(trailsLayer);

  function latLngToTile(lat, lng, zoom) {
    var z = Math.round(zoom);
    var n = Math.pow(2, z);
    var x = Math.floor((lng + 180) / 360 * n);
    var y = Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n);
    return { x: x, y: y, z: z };
  }

  function preloadTiles() {
    var center = map.getCenter();
    var tile = latLngToTile(center.lat, center.lng, map.getZoom());
    var dx;
    var dy;
    var img;

    for (dx = -2; dx <= 2; dx += 1) {
      for (dy = -2; dy <= 2; dy += 1) {
        img = new Image();
        img.src = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/' + tile.z + '/' + (tile.y + dy) + '/' + (tile.x + dx);
      }
    }
  }

      var data = await response.json();
      var temperature = data && data.current_weather ? data.current_weather.temperature : undefined;
      document.getElementById('weather').innerText = temperature === undefined ? '--' : '🌤️ ' + temperature + '°';
    } catch (error) {

    if (!user) return 'User';
    var meta = user.user_metadata || {};
    if (meta.username) return meta.username;

    if (user.email) return user.email.split('@')[0];

  async function readCurrentUser() {
    try {
      var raw = localStorage.getItem('supabase.auth.token');
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.currentSession && parsed.currentSession.user) {
          return parsed.currentSession.user;
        }
      }
    } catch (error) {}

    if (!supabaseClient) return null;

    var sessionResponse = await supabaseClient.auth.getSession();
    var session = sessionResponse && sessionResponse.data ? sessionResponse.data.session : null;

    if (session && session.user) {
      return session.user;
    }

    var userResponse = await supabaseClient.auth.getUser();
    var user = userResponse && userResponse.data ? userResponse.data.user : null;
    return user || null;
  }

  async function checkUser() {
    var user = await readCurrentUser();

    if (!user) {

  function startUserPolling() {
    var tries = 0;

    if (userCheckTimer) {
      clearInterval(userCheckTimer);
      userCheckTimer = null;
    }

    userCheckTimer = setInterval(async function () {
      tries += 1;
      await checkUser();

      if (currentUser || tries >= 12) {
        clearInterval(userCheckTimer);
        userCheckTimer = null;
      }
    }, 250);

  function getSearchResults(query) {
    var q = String(query || '').trim().toLowerCase();
    var results = [];

    if (!q) return results;

    places.forEach(function (p, index) {
      if (p.name.toLowerCase().includes(q)) {
        results.push({ type: 'city', name: p.name, index: index });
      }
    });

    poiMarkers.forEach(function (item) {
      var title = item.marker && item.marker.options ? item.marker.options.title || '' : '';
      if (title.toLowerCase().includes(q)) {
        results.push({ type: 'poi', name: title, poiName: title });
      }
    });

    return results;
  }

  function renderSearchSuggestions(value) {
    var results = getSearchResults(value);

    if (!value || results.length === 0) {
      searchResults.style.display = 'none';
      searchResults.innerHTML = '';
      return;
    }

    searchResults.innerHTML = results.slice(0, 8).map(function (r) {
      var label = r.type === 'city' ? 'Village' : 'POI';
      return '<div class="search-item" data-type="' + escapeHTML(r.type) + '" data-name="' + escapeHTML(r.name) + '">' + escapeHTML(r.name) + ' · ' + label + '</div>';
    }).join('');

    searchResults.style.display = 'flex';
  }

  function selectSearchResult(name) {
    var cityIndex = places.findIndex(function (p) { return p.name === name; });
    var poiItem;

    if (cityIndex !== -1) {
      cityCardManuallyClosed = false;
      showCityByIndex(cityIndex, true);
      return true;
    }

    poiItem = poiMarkers.find(function (m) {
      return m.marker && m.marker.options && m.marker.options.title === name;
    });

    if (poiItem && poiItem.poi) {
      openPOIWithMapMove(poiItem.poi, null);
      return true;
    }

    return false;
  }

  async function geocodeSearch(query) {
    try {
      var response = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(query));
      var data = await response.json();

      if (data && data[0]) {
        var lat = parseFloat(data[0].lat);
        var lon = parseFloat(data[0].lon);
        map.setView([lat, lon], 13);
        updateWeather(lat, lon);
        return true;
      }
    } catch (error) {
      console.warn('Search failed:', error);
    }

    return false;
  }

      var deltaX;

      if (!isDragging || event.touches.length !== 1) return;
      event.preventDefault();

      currentX = event.touches[0].clientX;

      deltaX = currentX - startX;
      deltaY = currentY - startY;

      if (!dragAxis && (Math.abs(deltaX) > 8 || Math.abs(deltaY) > 8)) {
        dragAxis = Math.abs(deltaY) > Math.abs(deltaX) ? 'y' : 'x';
      }

      if (!dragAxis) return;
