<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>5TerreGo | Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #cfe5f2;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }

    .top-bar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      border-radius: 20px;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .center-brand {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-weight: 800;
      font-size: 14px;
      text-decoration: none;
      white-space: nowrap;
      pointer-events: auto;
      cursor: pointer;
    }

    #weather {
      color: white;
      font-weight: 600;
      padding: 6px 10px;
      white-space: nowrap;
    }

    #search {
      width: 100%;
      padding: 8px 12px;
      border-radius: 999px;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.1);
      color: white;
    }

    #search::placeholder { color: rgba(255,255,255,0.75); }

    #login {
      padding: 8px 12px;
      border-radius: 999px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .blue { color: #1e9bff; }
    .orange { color: #ff8a1d; }

    .label {
      color: white;
      font-weight: 700;
      font-size: 14px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    .leaflet-div-icon {
      background: transparent !important;
      border: none !important;
    }

    .leaflet-tile { margin: -0.5px; }
    .leaflet-container { background: #000; }

    .leaflet-control-zoom,
    .leaflet-control-attribution {
      display: none !important;
    }

    .mode-bar {
      display: flex;
      gap: 8px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px;
      border-radius: 999px;
      border: none;
      background: rgba(0,0,0,0.35);
      color: #fff;
      font-weight: 700;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
    }

    .mode-btn.active { background: rgba(0,0,0,0.6); }

    .bottom-card {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 1000;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      touch-action: pan-y;
      will-change: transform;
    }

    .bottom-card.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .bottom-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
      background: rgba(255,255,255,0.08);
      pointer-events: none;
    }

    .bottom-card .title {
      color: white;
      font-weight: 700;
      padding: 10px;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="map"></div>

<div class="top-bar">
  <div class="top-row">
    <div id="weather">--</div>

    <a href="https://www.5terrego.com" class="center-brand" target="_blank" rel="noopener noreferrer" aria-label="Apri 5TerreGo.com">
      <span class="blue">5Terre</span><span class="orange">Go</span><span class="blue">.com</span>
    </a>

    <button id="login" type="button">Accedi</button>
  </div>

  <input id="search" placeholder="Search location..." />

  <div class="mode-bar">
    <button class="mode-btn active" id="btn-experiences" type="button">Experiences</button>
    <button class="mode-btn" id="btn-stories" type="button">Stories</button>
  </div>
</div>

<div class="bottom-card" id="card" aria-hidden="true">
  <img id="card-img" src="" alt="" />
  <div class="title" id="card-title"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const map = L.map('map', {
    minZoom: 11,
    zoomControl: false
  }).setView([44.12, 9.71], 12);

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    detectRetina: true
  }).addTo(map);

  map.setMaxBounds(L.latLngBounds([44.07, 9.58], [44.17, 9.80]));

  const RIOMAGGIORE_IMAGE = 'https://images.pexels.com/photos/11518065/pexels-photo-11518065.jpeg';

  const places = [
    {
      name: 'Monterosso',
      coords: [44.1461, 9.6548],
      image: 'https://images.pexels.com/photos/15570483/pexels-photo-15570483.jpeg'
    },
    {
      name: 'Vernazza',
      coords: [44.1350, 9.6847],
      image: 'https://images.pexels.com/photos/31386736/pexels-photo-31386736.jpeg'
    },
    {
      name: 'Corniglia',
      coords: [44.1197, 9.7089],
      image: 'https://images.pexels.com/photos/164407/pexels-photo-164407.jpeg'
    },
    {
      name: 'Manarola',
      coords: [44.1076, 9.7290],
      image: 'https://images.pexels.com/photos/632522/pexels-photo-632522.jpeg'
    },
    {
      name: 'Riomaggiore',
      coords: [44.0990, 9.7378],
      image: RIOMAGGIORE_IMAGE
    }
  ];

  const card = document.getElementById('card');
  const cardTitle = document.getElementById('card-title');
  const cardImg = document.getElementById('card-img');

  let currentIndex = -1;
  let isProgrammaticMove = false;
  let startX = 0;
  let currentX = 0;
  let isDragging = false;
  let hasMoved = false;

  function centerCity(place) {
    isProgrammaticMove = true;
    map.flyTo(place.coords, 14, { duration: 1.2 });

    window.setTimeout(() => {
      isProgrammaticMove = false;
    }, 1400);
  }

  function preloadImages() {
    places.forEach((place) => {
      const img = new Image();
      img.src = place.image;
    });
  }

  function setCardContent(place) {
    cardTitle.innerText = place.name;
    cardImg.src = place.image;
    cardImg.alt = place.name;
  }

  function showCityCard(place) {
    setCardContent(place);

    card.style.display = 'block';
    card.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
    card.setAttribute('aria-hidden', 'false');

    requestAnimationFrame(() => {
      card.classList.add('is-visible');
      card.style.transform = 'translateY(0)';
    });
  }

  function hideCard() {
    if (card.getAttribute('aria-hidden') === 'true') return;

    card.classList.remove('is-visible');
    card.setAttribute('aria-hidden', 'true');
    card.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
    card.style.transform = 'translateY(40px)';

    window.setTimeout(() => {
      if (card.getAttribute('aria-hidden') === 'true') {
        card.style.display = 'none';
      }
    }, 300);
  }

  function showCityByIndex(index, shouldCenter = true) {
    if (index < 0 || index >= places.length) return;

    currentIndex = index;
    const place = places[index];

    if (shouldCenter) centerCity(place);
    showCityCard(place);
  }

  function getClosestCity() {
    const center = map.getCenter();
    let minDist = Infinity;
    let closestIndex = -1;

    places.forEach((place, index) => {
      const distance = center.distanceTo(L.latLng(place.coords));
      if (distance < minDist) {
        minDist = distance;
        closestIndex = index;
      }
    });

    return { index: closestIndex, distance: minDist };
  }

  function evaluateAutoCard() {
    if (isProgrammaticMove) return;

    const zoom = map.getZoom();
    const closest = getClosestCity();

    if (zoom >= 13 && closest.distance < 500) {
      if (currentIndex !== closest.index || card.getAttribute('aria-hidden') === 'true') {
        showCityByIndex(closest.index, false);
      }
      return;
    }

    if (zoom < 12 || closest.distance > 800) {
      hideCard();
    }
  }

  function slideToIndex(nextIndex, direction) {
    if (nextIndex < 0 || nextIndex >= places.length || nextIndex === currentIndex) {
      card.style.transition = 'transform 0.2s ease';
      card.style.transform = 'translateX(0)';
      return;
    }

    const place = places[nextIndex];
    const exitX = direction === 'next' ? '-110%' : '110%';
    const enterX = direction === 'next' ? '110%' : '-110%';

    card.style.transition = 'transform 0.25s ease';
    card.style.transform = `translateX(${exitX})`;

    window.setTimeout(() => {
      card.style.transition = 'none';
      card.style.transform = `translateX(${enterX})`;
      currentIndex = nextIndex;
      setCardContent(place);

      requestAnimationFrame(() => {
        card.style.transition = 'transform 0.3s ease';
        card.style.transform = 'translateX(0)';
      });

      centerCity(place);
    }, 250);
  }

  places.forEach((place, index) => {
    const marker = L.marker(place.coords, {
      icon: L.divIcon({
        className: 'custom-label',
        html: `<div class="label">${place.name}</div>`
      })
    }).addTo(map);

    marker.on('click', () => {
      showCityByIndex(index, true);
    });
  });

  map.on('moveend zoomend', evaluateAutoCard);

  card.addEventListener('touchstart', (event) => {
    if (event.touches.length !== 1) return;

    startX = event.touches[0].clientX;
    currentX = startX;
    isDragging = true;
    hasMoved = false;
    card.style.transition = 'none';
  }, { passive: true });

  card.addEventListener('touchmove', (event) => {
    if (!isDragging || event.touches.length !== 1) return;

    currentX = event.touches[0].clientX;
    let delta = currentX - startX;

    const blockedRight = currentIndex === 0 && delta > 0;
    const blockedLeft = currentIndex === places.length - 1 && delta < 0;

    if (blockedRight || blockedLeft) delta = 0;
    if (Math.abs(delta) > 4) hasMoved = true;

    card.style.transform = `translateX(${delta}px)`;
  }, { passive: true });

  card.addEventListener('touchend', () => {
    if (!isDragging) return;

    const delta = currentX - startX;
    isDragging = false;

    const blockedRight = currentIndex === 0 && delta > 0;
    const blockedLeft = currentIndex === places.length - 1 && delta < 0;

    if (!hasMoved || blockedRight || blockedLeft || Math.abs(delta) < 80) {
      card.style.transition = 'transform 0.2s ease';
      card.style.transform = 'translateX(0)';
      return;
    }

    if (delta < -80) {
      slideToIndex(currentIndex + 1, 'next');
      return;
    }

    if (delta > 80) {
      slideToIndex(currentIndex - 1, 'prev');
    }
  });

  card.addEventListener('touchcancel', () => {
    isDragging = false;
    card.style.transition = 'transform 0.2s ease';
    card.style.transform = 'translateX(0)';
  });

  async function updateWeather(lat, lng) {
    try {
      const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`);
      const data = await response.json();
      const temperature = data.current_weather?.temperature;
      document.getElementById('weather').innerText = temperature === undefined ? '--' : `🌤️ ${temperature}°`;
    } catch (error) {
      document.getElementById('weather').innerText = '--';
    }
  }

  document.getElementById('search').addEventListener('keydown', async (event) => {
    if (event.key !== 'Enter') return;

    const query = event.target.value.trim();
    if (!query) return;

    try {
      const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
      const data = await response.json();

      if (data[0]) {
        const lat = parseFloat(data[0].lat);
        const lon = parseFloat(data[0].lon);
        map.setView([lat, lon], 12);
        updateWeather(lat, lon);
      }
    } catch (error) {
      console.warn('Search failed:', error);
    }
  });

  function runTests() {
    console.assert(Array.isArray(places), 'places must be an array');
    console.assert(places.length === 5, '5 cities expected');
    console.assert(places.every((place) => typeof place.name === 'string'), 'Each city needs a name');
    console.assert(places.every((place) => Array.isArray(place.coords) && place.coords.length === 2), 'Each city needs coords [lat, lng]');
    console.assert(places.every((place) => typeof place.image === 'string' && place.image.startsWith('https://')), 'Each city needs a stable image URL');
    console.assert(places[4].name === 'Riomaggiore', 'Riomaggiore must stay as the fifth city');
    console.assert(places[4].image === RIOMAGGIORE_IMAGE, 'Riomaggiore must use the fixed Pexels image');
    console.assert(currentIndex === -1, 'Initial index should be -1');
    console.assert(typeof getClosestCity === 'function', 'getClosestCity function exists');
    console.assert(typeof evaluateAutoCard === 'function', 'evaluateAutoCard function exists');
    console.assert(typeof slideToIndex === 'function', 'slideToIndex function exists');
    console.assert(typeof setCardContent === 'function', 'setCardContent function exists');
    console.assert(document.querySelector('.center-brand').href === 'https://www.5terrego.com/', 'Logo links to 5TerreGo.com');
  }

  preloadImages();
  updateWeather(44.12, 9.71);
  runTests();
</script>

</body>
</html>
