<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>5TerreGo | Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #cfe5f2;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }

    .top-bar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      border-radius: 20px;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .center-brand {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-weight: 800;
      font-size: 14px;
      text-decoration: none;
      white-space: nowrap;
      pointer-events: auto;
      cursor: pointer;
    }

    #weather {
      color: white;
      font-weight: 600;
      padding: 6px 10px;
      white-space: nowrap;
    }

    #search {
      width: 100%;
      padding: 8px 12px;
      border-radius: 999px;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.1);
      color: white;
    }

    #search::placeholder { color: rgba(255,255,255,0.75); }

    #login {
      padding: 8px 12px;
      border-radius: 999px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: white;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .blue { color: #1e9bff; }
    .orange { color: #ff8a1d; }

    .label {
      color: white;
      font-weight: 700;
      font-size: 14px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    .poi-label {
      min-width: 30px;
      min-height: 30px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(0,0,0,0.55);
      color: white;
      font-size: 17px;
      border: 1px solid rgba(255,255,255,0.28);
      box-shadow: 0 8px 22px rgba(0,0,0,0.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .leaflet-div-icon {
      background: transparent !important;
      border: none !important;
    }

    .leaflet-tile {
      margin: -1px;
      outline: none;
      border: none;
    }

    .leaflet-pane img {
      image-rendering: auto;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    .leaflet-container {
      background: #000;
      transform: translateZ(0);
      will-change: transform;
    }

    .leaflet-control-zoom,
    .leaflet-control-attribution {
      display: none !important;
    }

    .mode-bar {
      display: flex;
      gap: 8px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px;
      border-radius: 999px;
      border: none;
      background: rgba(0,0,0,0.35);
      color: #fff;
      font-weight: 700;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
    }

    .mode-btn.active { background: rgba(0,0,0,0.6); }

    #owner-panel {
      display: none;
      position: fixed;
      bottom: 86px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      padding: 12px;
      border-radius: 18px;
      background: rgba(0,0,0,0.62);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 18px 45px rgba(0,0,0,0.28);
    }

    #owner-panel[aria-hidden="false"] { display: block; }

    #owner-panel input,
    #owner-panel button {
      width: 100%;
      margin-bottom: 7px;
      padding: 10px 12px;
      border: 0;
      border-radius: 12px;
      outline: none;
      font: inherit;
    }

    #owner-panel button {
      margin-bottom: 0;
      font-weight: 800;
      cursor: pointer;
    }

    .bottom-card {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 1000;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      touch-action: pan-y;
      will-change: transform;
    }

    .bottom-card.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .bottom-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
      background: rgba(255,255,255,0.08);
      pointer-events: none;
    }

    .bottom-card .title {
      color: white;
      font-weight: 700;
      padding: 10px;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="map"></div>

<div class="top-bar">
  <div class="top-row">
    <div id="weather">--</div>

    <a href="https://www.5terrego.com" class="center-brand" target="_blank" rel="noopener noreferrer" aria-label="Apri 5TerreGo.com">
      <span class="blue">5Terre</span><span class="orange">Go</span><span class="blue">.com</span>
    </a>

    <button id="login" type="button">Accedi</button>
  </div>

  <input id="search" placeholder="Search location..." />

  <div class="mode-bar">
    <button class="mode-btn active" id="btn-experiences" type="button">Experiences</button>
    <button class="mode-btn" id="btn-stories" type="button">Stories</button>
  </div>
</div>

<div id="owner-panel" aria-hidden="true">
  <input id="poi-name" placeholder="Nome POI" />
  <input id="poi-symbol" placeholder="Simbolo / emoji" maxlength="3" />
  <input id="poi-lat" placeholder="Latitudine" inputmode="decimal" />
  <input id="poi-lng" placeholder="Longitudine" inputmode="decimal" />
  <input id="poi-img" placeholder="URL foto" />
  <input id="poi-email" placeholder="Email owner" inputmode="email" />
  <input id="poi-phone" placeholder="Telefono" inputmode="tel" />
  <input id="poi-relevance" placeholder="Punteggio rilevanza 1-100" inputmode="numeric" />
  <button id="add-poi" type="button">Aggiungi POI</button>
</div>

<div class="bottom-card" id="card" aria-hidden="true">
  <img id="card-img" src="" alt="" />
  <div class="title" id="card-title"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function () {
  'use strict';

  var SUPABASE_URL = 'https://jpflcbktcnhmlvaibzcw.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_vWugAbu_xtetgvrCh6yKYw_iA8bAXBa';
  var RIOMAGGIORE_IMAGE = 'https://images.pexels.com/photos/11518065/pexels-photo-11518065.jpeg';
  var LOCAL_POI_KEY = '5terrego_pois_backup';
  var AUTO_OPEN_ZOOM = 13;
  var AUTO_OPEN_DISTANCE = 500;
  var AUTO_CLOSE_ZOOM = 12;
  var AUTO_CLOSE_DISTANCE = 800;

  var SUPABASE_READY = Boolean(
    window.supabase &&
    SUPABASE_URL &&
    SUPABASE_ANON_KEY &&
    SUPABASE_URL.indexOf('YOUR_PROJECT') === -1 &&
    SUPABASE_ANON_KEY.indexOf('YOUR_PUBLIC') === -1
  );

  var supabaseClient = SUPABASE_READY ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }) : null;

  var places = [
    { name: 'Monterosso', coords: [44.1461, 9.6548], image: 'https://images.pexels.com/photos/15570483/pexels-photo-15570483.jpeg' },
    { name: 'Vernazza', coords: [44.1350, 9.6847], image: 'https://images.pexels.com/photos/31386736/pexels-photo-31386736.jpeg' },
    { name: 'Corniglia', coords: [44.1197, 9.7089], image: 'https://images.pexels.com/photos/164407/pexels-photo-164407.jpeg' },
    { name: 'Manarola', coords: [44.1076, 9.7290], image: 'https://images.pexels.com/photos/632522/pexels-photo-632522.jpeg' },
    { name: 'Riomaggiore', coords: [44.0990, 9.7378], image: RIOMAGGIORE_IMAGE }
  ];

  if (!window.L) {
    throw new Error('Leaflet non caricato. Controlla la connessione o il CDN Leaflet.');
  }

  var map = L.map('map', {
    minZoom: 11,
    zoomControl: false,
    preferCanvas: true,
    inertia: true,
    inertiaDeceleration: 3000,
    inertiaMaxSpeed: 1500,
    zoomSnap: 1,
    zoomDelta: 1,
    updateWhenIdle: false,
    zoomAnimation: false,
    fadeAnimation: false
  }).setView([44.12, 9.71], 12);

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    detectRetina: false,
    keepBuffer: 8,
    updateWhenZooming: false,
    updateWhenIdle: false,
    noWrap: true
  }).addTo(map);

  map.setMaxBounds(L.latLngBounds([44.07, 9.58], [44.17, 9.80]));

  var card = document.getElementById('card');
  var cardTitle = document.getElementById('card-title');
  var cardImg = document.getElementById('card-img');
  var ownerPanel = document.getElementById('owner-panel');
  var loginBtn = document.getElementById('login');
  var addPoiBtn = document.getElementById('add-poi');
  var searchInput = document.getElementById('search');

  var currentIndex = -1;
  var currentDataset = 'places';
  var poiLayer = L.layerGroup().addTo(map);
  var isProgrammaticMove = false;
  var startX = 0;
  var currentX = 0;
  var isDragging = false;
  var hasMoved = false;
  var currentUser = null;
  var userCheckTimer = null;

  function readValue(value, fallback) {
    return value === undefined || value === null ? fallback : value;
  }

  function normalizePOI(raw) {
    raw = raw || {};
    var rawLat = readValue(raw.lat, raw.latitude);
    var rawLng = readValue(raw.lng, raw.longitude);
    var lat = Number(rawLat);
    var lng = Number(rawLng);

    return {
      id: raw.id || 'local-' + Date.now() + '-' + Math.random().toString(16).slice(2),
      name: String(raw.name || raw.title || 'POI'),
      symbol: raw.symbol || '📍',
      coords: [lat, lng],
      lat: lat,
      lng: lng,
      image: raw.image || raw.photo_url || raw.img || '',
      owner_email: raw.owner_email || raw.email || '',
      phone: raw.phone || raw.telephone || '',
      relevance: Number(raw.relevance || raw.score || 0)
    };
  }

  function isValidPOI(poi) {
    return Boolean(poi && Number.isFinite(poi.lat) && Number.isFinite(poi.lng) && poi.name.length > 0);
  }

  function centerCity(place) {
    isProgrammaticMove = true;
    var zoomLevel = place.name === 'Monterosso' ? 14 : 15;
    map.flyTo(place.coords, zoomLevel, { duration: 1.2 });

    window.setTimeout(function () {
      isProgrammaticMove = false;
    }, 1400);
  }

  function preloadImages() {
    places.forEach(function (place) {
      var img = new Image();
      img.src = place.image;
    });
  }

  function setCardContent(item) {
    cardTitle.innerText = item.name;
    cardImg.src = item.image || 'https://images.pexels.com/photos/632522/pexels-photo-632522.jpeg';
    cardImg.alt = item.name;
  }

  function showCityCard(item) {
    setCardContent(item);
    card.style.display = 'block';
    card.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
    card.setAttribute('aria-hidden', 'false');

    window.requestAnimationFrame(function () {
      card.classList.add('is-visible');
      card.style.transform = 'translateY(0)';
    });
  }

  function hideCard() {
    if (card.getAttribute('aria-hidden') === 'true') return;

    card.classList.remove('is-visible');
    card.setAttribute('aria-hidden', 'true');
    card.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
    card.style.transform = 'translateY(40px)';

    window.setTimeout(function () {
      if (card.getAttribute('aria-hidden') === 'true') {
        card.style.display = 'none';
      }
    }, 300);
  }

  function showCityByIndex(index, shouldCenter) {
    if (shouldCenter === undefined) shouldCenter = true;
    if (index < 0 || index >= places.length) return;

    currentDataset = 'places';
    currentIndex = index;
    var place = places[index];

    if (shouldCenter) centerCity(place);
    showCityCard(place);
  }

  function getClosestCity() {
    var center = map.getCenter();
    var minDist = Infinity;
    var closestIndex = -1;

    places.forEach(function (place, index) {
      var distance = center.distanceTo(L.latLng(place.coords));
      if (distance < minDist) {
        minDist = distance;
        closestIndex = index;
      }
    });

    return { index: closestIndex, distance: minDist };
  }

  function evaluateAutoCard() {
    if (isProgrammaticMove) return;

    var zoom = map.getZoom();
    var closest = getClosestCity();

    if (zoom >= AUTO_OPEN_ZOOM && closest.distance < AUTO_OPEN_DISTANCE) {
      if (currentDataset !== 'places' || currentIndex !== closest.index || card.getAttribute('aria-hidden') === 'true') {
        showCityByIndex(closest.index, false);
      }
      return;
    }

    if (zoom < AUTO_CLOSE_ZOOM || closest.distance > AUTO_CLOSE_DISTANCE) {
      hideCard();
    }
  }

  function slideToIndex(nextIndex, direction) {
    if (currentDataset !== 'places') return;

    if (nextIndex < 0 || nextIndex >= places.length || nextIndex === currentIndex) {
      card.style.transition = 'transform 0.2s ease';
      card.style.transform = 'translateX(0)';
      return;
    }

    var place = places[nextIndex];
    var exitX = direction === 'next' ? '-110%' : '110%';
    var enterX = direction === 'next' ? '110%' : '-110%';

    card.style.transition = 'transform 0.25s ease';
    card.style.transform = 'translateX(' + exitX + ')';

    window.setTimeout(function () {
      card.style.transition = 'none';
      card.style.transform = 'translateX(' + enterX + ')';
      currentIndex = nextIndex;
      setCardContent(place);

      window.requestAnimationFrame(function () {
        card.style.transition = 'transform 0.3s ease';
        card.style.transform = 'translateX(0)';
      });

      centerCity(place);
    }, 250);
  }

  function createCityMarkers() {
    places.forEach(function (place, index) {
      L.marker(place.coords, {
        icon: L.divIcon({
          className: 'custom-label',
          html: '<div class="label">' + place.name + '</div>'
        })
      }).addTo(map).on('click', function () {
        showCityByIndex(index, true);
      });
    });
  }

  async function loadPOIs() {
    poiLayer.clearLayers();
    var pois = [];

    if (SUPABASE_READY && supabaseClient) {
      var response = await supabaseClient
        .from('pois')
        .select('id,name,symbol,lat,lng,image,owner_email,phone,relevance')
        .order('relevance', { ascending: false });

      if (response.error) {
        console.warn('Supabase POI load failed:', response.error.message);
      } else {
        pois = response.data || [];
      }
    } else {
      pois = JSON.parse(localStorage.getItem(LOCAL_POI_KEY) || '[]');
    }

    pois.map(normalizePOI).filter(isValidPOI).forEach(function (poi) {
      L.marker(poi.coords, {
        icon: L.divIcon({
          className: 'custom-poi',
          html: '<div class="poi-label">' + poi.symbol + '</div>',
          iconSize: [32, 32],
          iconAnchor: [16, 16]
        })
      }).addTo(poiLayer).on('click', function () {
        currentDataset = 'pois';
        currentIndex = -1;
        showCityCard(poi);
      });
    });
  }

  function saveLocalPOI(poi) {
    var current = JSON.parse(localStorage.getItem(LOCAL_POI_KEY) || '[]');
    current.push(poi);
    localStorage.setItem(LOCAL_POI_KEY, JSON.stringify(current));
  }

  async function addPOI() {
    var name = document.getElementById('poi-name').value.trim();
    var symbol = document.getElementById('poi-symbol').value.trim() || '📍';
    var lat = Number(document.getElementById('poi-lat').value);
    var lng = Number(document.getElementById('poi-lng').value);
    var image = document.getElementById('poi-img').value.trim();
    var ownerEmail = document.getElementById('poi-email').value.trim();
    var phone = document.getElementById('poi-phone').value.trim();
    var relevance = Number(document.getElementById('poi-relevance').value || 0);

    var poi = normalizePOI({
      name: name,
      symbol: symbol,
      lat: lat,
      lng: lng,
      image: image,
      owner_email: ownerEmail,
      phone: phone,
      relevance: relevance
    });

    if (!isValidPOI(poi)) {
      alert('Dati non validi: nome, latitudine e longitudine sono obbligatori');
      return;
    }

    if (SUPABASE_READY && supabaseClient) {
      var insertResponse = await supabaseClient
        .from('pois')
        .insert([{ name: name, symbol: symbol, lat: lat, lng: lng, image: image, owner_email: ownerEmail, phone: phone, relevance: relevance }]);

      if (insertResponse.error) {
        alert('Errore salvataggio: ' + insertResponse.error.message);
        return;
      }
    } else {
      saveLocalPOI(poi);
    }

    await loadPOIs();
    alert('POI salvato');
  }

  function latLngToTile(lat, lng, zoom) {
    var z = Math.round(zoom);
    var n = Math.pow(2, z);
    var x = Math.floor((lng + 180) / 360 * n);
    var y = Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n);
    return { x: x, y: y, z: z };
  }

  function preloadTiles() {
    var center = map.getCenter();
    var tile = latLngToTile(center.lat, center.lng, map.getZoom());

    for (var dx = -2; dx <= 2; dx += 1) {
      for (var dy = -2; dy <= 2; dy += 1) {
        var img = new Image();
        img.src = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/' + tile.z + '/' + (tile.y + dy) + '/' + (tile.x + dx);
      }
    }
  }

  async function updateWeather(lat, lng) {
    try {
      var response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=' + encodeURIComponent(lat) + '&longitude=' + encodeURIComponent(lng) + '&current_weather=true');
      var data = await response.json();
      var temperature = data && data.current_weather ? data.current_weather.temperature : undefined;
      document.getElementById('weather').innerText = temperature === undefined ? '--' : '🌤️ ' + temperature + '°';
    } catch (error) {
      document.getElementById('weather').innerText = '--';
    }
  }

  function setOwnerPanelVisible(visible) {
    ownerPanel.setAttribute('aria-hidden', visible ? 'false' : 'true');
    ownerPanel.style.display = visible ? 'block' : 'none';
  }

  function getUserDisplayName(user) {
    if (!user) return 'User';
    var meta = user.user_metadata || {};
    if (meta.username) return meta.username;
    if (meta.name) return meta.name;
    if (user.email) return user.email.split('@')[0];
    return 'User';
  }

  async function readCurrentUser() {
    var sessionResponse;
    var session;
    var userResponse;
    var user;

    if (!supabaseClient) return null;

    sessionResponse = await supabaseClient.auth.getSession();
    session = sessionResponse && sessionResponse.data ? sessionResponse.data.session : null;

    if (session && session.user) {
      return session.user;
    }

    userResponse = await supabaseClient.auth.getUser();
    user = userResponse && userResponse.data ? userResponse.data.user : null;
    return user || null;
  }

  async function checkUser() {
    var user = await readCurrentUser();
    currentUser = user;

    if (!user) {
      loginBtn.innerText = 'Accedi';
      setOwnerPanelVisible(false);
      return false;
    }

    loginBtn.innerText = 'Hi, ' + getUserDisplayName(user);
    return true;
  }

  function startUserPolling() {
    var tries = 0;

    if (userCheckTimer) {
      clearInterval(userCheckTimer);
      userCheckTimer = null;
    }

    userCheckTimer = setInterval(async function () {
      tries += 1;
      await checkUser();

      if (currentUser || tries >= 12) {
        clearInterval(userCheckTimer);
        userCheckTimer = null;
      }
    }, 250);
  }

  function setupEvents() {
    loginBtn.addEventListener('click', function () {
      window.location.href = '/login.html';
    });

    addPoiBtn.addEventListener('click', addPOI);

    searchInput.addEventListener('keydown', async function (event) {
      if (event.key !== 'Enter') return;

      var query = event.target.value.trim();
      if (!query) return;

      try {
        var response = await fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(query));
        var data = await response.json();

        if (data[0]) {
          var lat = parseFloat(data[0].lat);
          var lon = parseFloat(data[0].lon);
          map.setView([lat, lon], 12);
          updateWeather(lat, lon);
        }
      } catch (error) {
        console.warn('Search failed:', error);
      }
    });

    map.on('moveend zoomend', function () {
      evaluateAutoCard();
      preloadTiles();
    });

    card.addEventListener('touchstart', function (event) {
      if (event.touches.length !== 1) return;
      startX = event.touches[0].clientX;
      currentX = startX;
      isDragging = true;
      hasMoved = false;
      card.style.transition = 'none';
    }, { passive: true });

    card.addEventListener('touchmove', function (event) {
      var delta;
      var blockedRight;
      var blockedLeft;

      if (!isDragging || event.touches.length !== 1) return;

      currentX = event.touches[0].clientX;
      delta = currentX - startX;
      blockedRight = currentIndex === 0 && delta > 0;
      blockedLeft = currentIndex === places.length - 1 && delta < 0;

      if (blockedRight || blockedLeft) delta = 0;
      if (Math.abs(delta) > 4) hasMoved = true;

      card.style.transform = 'translateX(' + delta + 'px)';
    }, { passive: true });

    card.addEventListener('touchend', function () {
      var delta;
      var blockedRight;
      var blockedLeft;

      if (!isDragging) return;

      delta = currentX - startX;
      isDragging = false;
      blockedRight = currentIndex === 0 && delta > 0;
      blockedLeft = currentIndex === places.length - 1 && delta < 0;

      if (!hasMoved || blockedRight || blockedLeft || Math.abs(delta) < 80) {
        card.style.transition = 'transform 0.2s ease';
        card.style.transform = 'translateX(0)';
        return;
      }

      if (delta < -80) {
        slideToIndex(currentIndex + 1, 'next');
        return;
      }

      if (delta > 80) {
        slideToIndex(currentIndex - 1, 'prev');
      }
    });

    card.addEventListener('touchcancel', function () {
      isDragging = false;
      card.style.transition = 'transform 0.2s ease';
      card.style.transform = 'translateX(0)';
    });
  }

  function runTests() {
    console.assert(Array.isArray(places), 'places must be an array');
    console.assert(places.length === 5, '5 cities expected');
    console.assert(places.every(function (place) { return typeof place.name === 'string'; }), 'Each city needs a name');
    console.assert(places.every(function (place) { return Array.isArray(place.coords) && place.coords.length === 2; }), 'Each city needs coords [lat, lng]');
    console.assert(places.every(function (place) { return typeof place.image === 'string' && place.image.indexOf('https://') === 0; }), 'Each city needs a stable image URL');
    console.assert(places[4].name === 'Riomaggiore', 'Riomaggiore must stay as the fifth city');
    console.assert(places[4].image === RIOMAGGIORE_IMAGE, 'Riomaggiore must use the fixed Pexels image');
    console.assert(currentIndex === -1, 'Initial index should be -1');
    console.assert(typeof getClosestCity === 'function', 'getClosestCity function exists');
    console.assert(typeof evaluateAutoCard === 'function', 'evaluateAutoCard function exists');
    console.assert(typeof slideToIndex === 'function', 'slideToIndex function exists');
    console.assert(typeof setCardContent === 'function', 'setCardContent function exists');
    console.assert(typeof normalizePOI === 'function', 'normalizePOI function exists');
    console.assert(typeof loadPOIs === 'function', 'loadPOIs function exists');
    console.assert(typeof addPOI === 'function', 'addPOI function exists');
    console.assert(typeof setupEvents === 'function', 'setupEvents function exists');
    console.assert(typeof checkUser === 'function', 'checkUser function exists');
    console.assert(typeof readCurrentUser === 'function', 'readCurrentUser function exists');
    console.assert(typeof startUserPolling === 'function', 'startUserPolling function exists');
    console.assert(typeof setOwnerPanelVisible === 'function', 'setOwnerPanelVisible function exists');
    console.assert((supabaseClient && supabaseClient.auth && typeof supabaseClient.auth.getSession === 'function') || supabaseClient === null, 'Supabase client is either ready or safely null');
    console.assert(document.documentElement.innerHTML.indexOf('= await supabaseClient.auth.getSession') === -1, 'Broken auth fragment removed');
    console.assert(document.documentElement.innerHTML.indexOf('currentUser = null;\n      currentIsOwner = false;') === -1, 'Broken orphan logout fragment removed');
    console.assert(document.querySelector('.center-brand').href === 'https://www.5terrego.com/', 'Logo links to 5TerreGo.com');
    console.assert(loginBtn.textContent.trim() === 'Accedi', 'Login button starts as Accedi before auth check');
    console.assert(ownerPanel.getAttribute('aria-hidden') === 'true', 'Owner panel starts hidden');
    console.assert(typeof getUserDisplayName({ email: 'test@example.com', user_metadata: {} }) === 'string', 'Display name helper returns a string');
    console.assert(getUserDisplayName({ email: 'test@example.com', user_metadata: {} }) === 'test', 'Display name falls back to email prefix');
    console.assert(normalizePOI({ name: 'X', latitude: '44.1', longitude: '9.7' }).lat === 44.1, 'normalizePOI supports latitude fallback');
    console.assert(typeof loginBtn.onclick !== 'function', 'Login button uses addEventListener, not overwritten onclick');
  }

  createCityMarkers();
  preloadImages();
  preloadTiles();
  updateWeather(44.12, 9.71);
  setupEvents();
  runTests();

  setTimeout(function () {
    checkUser();
    startUserPolling();
  }, 250);

  if (supabaseClient) {
    supabaseClient.auth.onAuthStateChange(function () {
      checkUser();
      startUserPolling();
    });
  }

  loadPOIs();
}());
