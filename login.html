.btn{

  margin-top:10px;
  border-radius:16px;

  font-size:15px;
  cursor:pointer;
}

.btn-primary{

}

.btn-google{
  background:rgba(255,255,255,0.94);
  color:#111;
}

.btn-apple{
  background:#000;

}

.btn:disabled{
  opacity:0.55;

  margin-top:13px;

</head>
