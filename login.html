<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>5TerreGo | Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#05070a;
  color:#fff;
}

body{
  overflow:hidden;
}

.overlay{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 20% 15%, rgba(30,155,255,0.22), transparent 32%),
    radial-gradient(circle at 80% 10%, rgba(255,138,29,0.18), transparent 30%),
    rgba(0,0,0,0.58);
}

.modal{
  width:100%;
  max-width:380px;
  padding:22px;
  border-radius:24px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.12);
  box-shadow:0 24px 70px rgba(0,0,0,0.42);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  text-align:center;
}

.brand{
  margin-bottom:10px;
  font-size:23px;
  font-weight:900;
  letter-spacing:-0.04em;
}

.blue{color:#1e9bff;}
.orange{color:#ff8a1d;}

h2{
  margin:0 0 14px;
  font-size:25px;
  letter-spacing:-0.04em;
}

input,
select{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.12);
  outline:none;
  background:rgba(255,255,255,0.1);
  color:white;
  font-size:16px;
}

input::placeholder{
  color:rgba(255,255,255,0.52);
}

select option{
  background:#05070a;
  color:white;
}

button{
  width:100%;
  min-height:48px;
  padding:14px;
  margin-top:10px;
  border-radius:14px;
  border:none;
  font-weight:800;
  cursor:pointer;
  font-size:15px;
}

.primary{
  background:white;
  color:black;
}

.divider{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:13px;
  color:rgba(255,255,255,0.62);
  font-size:12px;
  text-transform:lowercase;
}

.divider::before,
.divider::after{
  content:"";
  flex:1;
  height:1px;
  background:rgba(255,255,255,0.22);
}

.social-row{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.social-row button{
  width:50%;
  margin-top:0;
}

.google{
  background:white;
  color:black;
}

.apple{
  background:black;
  color:white;
  border:1px solid rgba(255,255,255,0.35);
}

.toggle{
  margin-top:14px;
  font-size:13px;
  color:rgba(255,255,255,0.74);
  cursor:pointer;
}

#status{
  min-height:18px;
  margin-top:12px;
  color:rgba(255,255,255,0.74);
  font-size:13px;
  line-height:1.35;
}

.hidden{
  display:none !important;
}
</style>
</head>
<body>

<div class="overlay">
  <main class="modal" aria-label="Accesso 5TerreGo">
    <div class="brand" aria-label="5TerreGo.com">
      <span class="blue">5Terre</span><span class="orange">Go</span><span class="blue">.com</span>
    </div>

    <h2 id="title">Accedi</h2>

    <input id="username" class="hidden" placeholder="Nome utente" autocomplete="username" />

    <select id="language" class="hidden" aria-label="Lingua preferita">
      <option value="it">Italiano</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
    </select>

    <input id="email" type="email" placeholder="Email" autocomplete="email" inputmode="email" />
    <input id="phone" class="hidden" type="tel" placeholder="Telefono (opzionale)" autocomplete="tel" inputmode="tel" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
    <input id="repeat" type="password" class="hidden" placeholder="Ripeti password" autocomplete="new-password" />

    <button id="action" class="primary" type="button">Accedi</button>

    <div id="divider" class="divider">or</div>

    <div id="social-row" class="social-row">
      <button id="google" class="google" type="button">Google</button>
      <button id="apple" class="apple" type="button">Apple</button>
    </div>

    <div id="toggle" class="toggle">Non hai un account? Crealo</div>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
</div>

<script>
(function(){
  'use strict';

  const SUPABASE_URL = 'https://jpflcbktcnhmlvaibzcw.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_vWugAbu_xtetgvrCh6yKYw_iA8bAXBa';
  const REDIRECT_PATH = '/map.html';

  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let isLogin = true;

  const username = document.getElementById('username');
  const language = document.getElementById('language');
  const email = document.getElementById('email');
  const phone = document.getElementById('phone');
  const password = document.getElementById('password');
  const repeat = document.getElementById('repeat');
  const actionBtn = document.getElementById('action');
  const toggle = document.getElementById('toggle');
  const title = document.getElementById('title');
  const status = document.getElementById('status');
  const googleBtn = document.getElementById('google');
  const appleBtn = document.getElementById('apple');
  const divider = document.getElementById('divider');
  const socialRow = document.getElementById('social-row');

  function getRedirectUrl(){
    return new URL(REDIRECT_PATH, window.location.origin).href;
  }

  function setStatus(message){
    status.innerText = message || '';
  }

  function setMode(){
    setStatus('');

    if(isLogin){
      title.innerText = 'Accedi';
      actionBtn.innerText = 'Accedi';
      toggle.innerText = 'Non hai un account? Crealo';
      password.setAttribute('autocomplete','current-password');

      username.classList.add('hidden');
      language.classList.add('hidden');
      phone.classList.add('hidden');
      repeat.classList.add('hidden');

      divider.classList.remove('hidden');
      socialRow.classList.remove('hidden');
    } else {
      title.innerText = 'Crea account';
      actionBtn.innerText = 'Registrati';
      toggle.innerText = 'Hai già un account? Accedi';
      password.setAttribute('autocomplete','new-password');

      username.classList.remove('hidden');
      language.classList.remove('hidden');
      phone.classList.remove('hidden');
      repeat.classList.remove('hidden');

      divider.classList.add('hidden');
      socialRow.classList.add('hidden');
    }
  }

  function isValidEmail(value){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
  }

  async function handleAuth(){
    const e = email.value.trim();
    const p = password.value;

    if(!isValidEmail(e)){
      setStatus('Inserisci una email valida.');
      return;
    }

    if(!p){
      setStatus('Inserisci la password.');
      return;
    }

    if(isLogin){
      const { error } = await client.auth.signInWithPassword({ email:e, password:p });

      if(error){
        setStatus(error.message);
        return;
      }

      setStatus('Accesso riuscito');
      window.setTimeout(function(){ window.location.href = getRedirectUrl(); }, 800);
      return;
    }

    const u = username.value.trim();
    const phoneVal = phone.value.trim();
    const lang = language.value;
    const r = repeat.value;

    if(!u){
      setStatus('Inserisci nome utente.');
      return;
    }

    if(p.length < 6){
      setStatus('La password deve avere almeno 6 caratteri.');
      return;
    }

    if(p !== r){
      setStatus('Le password non coincidono.');
      return;
    }

    const { error } = await client.auth.signUp({
      email:e,
      password:p,
      options:{
        data:{
          username:u,
          language:lang,
          phone:phoneVal
        },
        emailRedirectTo:getRedirectUrl()
      }
    });

    if(error){
      setStatus(error.message);
      return;
    }

    setStatus('Account creato. Controlla la tua email se Supabase richiede conferma.');
  }

  async function oauth(provider){
    const { error } = await client.auth.signInWithOAuth({
      provider:provider,
      options:{ redirectTo:getRedirectUrl() }
    });

    if(error) setStatus(error.message);
  }

  function setupEvents(){
    actionBtn.addEventListener('click', handleAuth);
    toggle.addEventListener('click', function(){
      isLogin = !isLogin;
      setMode();
    });
    googleBtn.addEventListener('click', function(){ oauth('google'); });
    appleBtn.addEventListener('click', function(){ oauth('apple'); });
    password.addEventListener('keydown', function(event){
      if(event.key === 'Enter') handleAuth();
    });
    repeat.addEventListener('keydown', function(event){
      if(event.key === 'Enter') handleAuth();
    });
  }

  function runTests(){
    console.assert(typeof client.auth.signInWithPassword === 'function','Password login exists');
    console.assert(typeof client.auth.signUp === 'function','Signup exists');
    console.assert(typeof client.auth.signInWithOAuth === 'function','OAuth exists');
    console.assert(username !== null,'Username field exists');
    console.assert(language !== null,'Language field exists');
    console.assert(email !== null,'Email field exists');
    console.assert(phone !== null,'Phone field exists');
    console.assert(password !== null,'Password field exists');
    console.assert(repeat !== null,'Repeat password exists');
    console.assert(actionBtn !== null,'Action button exists');
    console.assert(divider !== null,'Divider exists');
    console.assert(socialRow !== null,'Social row exists');
    console.assert(googleBtn !== null,'Google button exists');
    console.assert(appleBtn !== null,'Apple button exists');
    console.assert(isValidEmail('test@example.com') === true,'Valid email accepted');
    console.assert(isValidEmail('wrong-email') === false,'Invalid email rejected');
    console.assert(getRedirectUrl().endsWith('/map.html'),'Redirect goes to map.html');
    console.assert(document.querySelectorAll('#google').length === 1,'Only one Google button exists');
    console.assert(document.querySelectorAll('#apple').length === 1,'Only one Apple button exists');
    console.assert(!document.querySelector('style button#action'),'No HTML accidentally inside style');
  }

  setupEvents();
  setMode();
  runTests();
})();
</script>

</body>
</html>
