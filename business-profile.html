<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Profilo attività · 5TerreGo</title><link rel="stylesheet" href="/business-dashboard.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="shell"><div class="top"><a class="back" data-page="discounteditor.html">← Dashboard</a><a class="scanner" href="/map.html">Vedi sulla mappa →</a></div><section class="hero"><div class="eyebrow">Profilo pubblico</div><h1 data-business-name>Attività</h1><p>Gestisci le informazioni che il visitatore vede nella scheda del POI.</p><div id="switcher" class="switcher hidden"><label for="activitySelect">Attività</label><select id="activitySelect"></select></div></section><div id="status" class="status">Caricamento…</div><section id="content" class="panel hidden"><h2>Informazioni del locale</h2><p class="panel-intro">Descrizione, contatto WhatsApp e fotografie sono mostrati nella tendina pubblica.</p><label class="field"><span>Descrizione</span><textarea id="description" maxlength="5000"></textarea></label><label class="field"><span>Numero WhatsApp</span><input id="phone" type="tel" maxlength="80" placeholder="+39 333 123 4567"></label><div class="mini-label">Foto · massimo 10</div><div id="gallery" class="gallery"></div><div class="actions"><button id="addPhotos" class="btn soft" type="button">＋ Aggiungi foto</button><button id="save" class="btn primary" type="button">Salva profilo</button><input id="photoInput" class="hidden" type="file" accept="image/jpeg,image/png,image/webp" multiple></div></section></main><script src="/business-dashboard-common.js"></script><script>
(async function(){var api=window.FTGBusiness,ctx,poi,profile,images;function render(){document.getElementById('gallery').innerHTML=images.map(function(url,i){return '<div class="photo"><img src="'+api.esc(url)+'" alt="Foto locale"><button type="button" data-remove="'+i+'">×</button></div>'}).join('')||'<div>Nessuna foto</div>'}try{ctx=await api.init();if(!ctx)return;poi=ctx.poi;profile=api.safeProfile(poi.partner_profile);images=api.parseImages(poi.images);document.getElementById('description').value=poi.description||'';document.getElementById('phone').value=poi.phone||'';render();document.getElementById('content').classList.remove('hidden');document.getElementById('gallery').onclick=function(e){var b=e.target.closest('[data-remove]');if(b){images.splice(Number(b.getAttribute('data-remove')),1);render()}};document.getElementById('addPhotos').onclick=function(){document.getElementById('photoInput').click()};document.getElementById('photoInput').onchange=async function(){var files=Array.from(this.files||[]).slice(0,10-images.length);api.setStatus('Caricamento foto…');try{for(var i=0;i<files.length;i++){var result=await api.uploadAsset(poi,files[i],true);images.push(result.url);render()}api.setStatus('Foto caricate. Premi Salva profilo.','ok')}catch(e){api.setStatus(e.message,'error')}this.value=''};document.getElementById('save').onclick=async function(){this.disabled=true;try{var result=await api.saveBusiness(poi,document.getElementById('description').value,document.getElementById('phone').value,images,profile);poi.description=result.description;poi.phone=result.phone;poi.images=result.images;api.setStatus('Profilo salvato.','ok')}catch(e){api.setStatus(e.message,'error')}finally{this.disabled=false}}}catch(e){api.setStatus(e.message,'error')}})();
</script></body></html>
