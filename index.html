<!-- global-actionbar.html -->
<div id="ftg-global-actionbar-root"></div>

<style>
  :root {
    --ftg-fab-right: max(12px, env(safe-area-inset-right));
    --ftg-fab-top: calc(12px + env(safe-area-inset-top));
    --ftg-fab-bottom: calc(12px + env(safe-area-inset-bottom));
    --ftg-surface: rgba(8,12,16,.76);
    --ftg-surface-strong: rgba(8,12,16,.9);
    --ftg-border: rgba(255,255,255,.12);
    --ftg-text: #fff;
    --ftg-text-soft: rgba(255,255,255,.68);
    --ftg-shadow: 0 20px 54px rgba(0,0,0,.28);
  }

  body.ftg-actionbar-enabled {
    padding-bottom: calc(18px + env(safe-area-inset-bottom));
  }

  .ftg-fab {
    position: fixed;
    width: 56px;
    height: 56px;
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 50%;
    background: var(--ftg-surface);
    box-shadow: var(--ftg-shadow);
    backdrop-filter: blur(18px) saturate(1.12);
    -webkit-backdrop-filter: blur(18px) saturate(1.12);
    color: var(--ftg-text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10080;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .22s ease, background .22s ease, border-color .22s ease;
  }
  .ftg-fab:active {
    transform: scale(.96);
  }
  .ftg-fab.open {
    background: rgba(8,12,16,.88);
    color: #fff;
    border-color: rgba(255,255,255,.18);
  }

  .ftg-more-fab {
    width: 52px;
    height: 52px;
    top: var(--ftg-fab-top);
    right: var(--ftg-fab-right);
    z-index: 10082;
    isolation: isolate;
    background: rgba(8,12,16,.76);
    color: #fff;
    border-color: rgba(255,255,255,.16);
    box-shadow: 0 20px 54px rgba(0,0,0,.28);
    backdrop-filter: blur(18px) saturate(1.12);
    -webkit-backdrop-filter: blur(18px) saturate(1.12);
  }

  .ftg-more-icon {
    position: relative;
    width: 20px;
    height: 20px;
  }
  .ftg-more-icon span {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: currentColor;
    transition:
      transform .28s cubic-bezier(.2,.9,.2,1),
      width .24s ease,
      height .24s ease,
      opacity .18s ease,
      top .28s cubic-bezier(.2,.9,.2,1),
      left .28s cubic-bezier(.2,.9,.2,1);
  }
  .ftg-more-icon span:nth-child(1) {
    top: 1px;
    left: 1px;
  }
  .ftg-more-icon span:nth-child(2) {
    top: 1px;
    right: 1px;
  }
  .ftg-more-icon span:nth-child(3) {
    bottom: 1px;
    left: 1px;
  }
  .ftg-more-icon span:nth-child(4) {
    bottom: 1px;
    right: 1px;
  }
  .ftg-more-fab.open .ftg-more-icon span:nth-child(1),
  .ftg-more-fab.open .ftg-more-icon span:nth-child(4) {
    width: 14px;
    height: 3px;
    top: 8px;
    left: 3px;
    border-radius: 999px;
  }
  .ftg-more-fab.open .ftg-more-icon span:nth-child(1) {
    transform: rotate(45deg);
  }
  .ftg-more-fab.open .ftg-more-icon span:nth-child(4) {
    transform: rotate(-45deg);
  }
  .ftg-more-fab.open .ftg-more-icon span:nth-child(2),
  .ftg-more-fab.open .ftg-more-icon span:nth-child(3) {
    opacity: 0;
    transform: scale(.2);
    top: 8px;
    left: 8px;
  }

  .ftg-ai-fab {
    right: var(--ftg-fab-right);
    bottom: var(--ftg-fab-bottom);
    overflow: hidden;
  }
  .ftg-ai-fab video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center 0%;
    transform: scale(1.22);
    pointer-events: none;
  }

  .ftg-more-overlay {
    position: fixed;
    inset: 0;
    z-index: 10074;
    display: none;
    background: transparent;
  }
  .ftg-more-overlay.open {
    display: block;
  }

  .ftg-more-panel {
    position: fixed;
    top: calc(var(--ftg-fab-top) - 14px);
    left: 6px;
    right: calc(var(--ftg-fab-right) - 14px);
    z-index: 10079;
    width: auto;
    max-width: none;
    padding: 16px 10px 12px 10px;
    border-radius: 0 0 0 30px;
    background: var(--ftg-surface-strong);
    border: 1px solid var(--ftg-border);
    box-shadow: 0 28px 80px rgba(0,0,0,.34);
    backdrop-filter: blur(22px) saturate(1.14);
    -webkit-backdrop-filter: blur(22px) saturate(1.14);
    opacity: 0;
    transform-origin: top right;
    transform: translate(10px, -10px) scale(.84);
    pointer-events: none;
    transition: transform .34s cubic-bezier(.2,.9,.2,1), opacity .24s ease;
    overflow: hidden;
  }
  .ftg-more-panel.open {
    opacity: 1;
    transform: translate(0, 0) scale(1);
    pointer-events: auto;
    overflow: visible;
  }
  .ftg-more-panel::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,0) 38%);
    pointer-events: none;
  }
  .ftg-more-panel::after {
    content: none;
    display: none;
  }

  .ftg-more-head {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    gap: 12px;
    margin-bottom: 14px;
    padding-right: 70px;
    min-height: 44px;
  }
  .ftg-more-primary {
    min-height: 38px;
    padding: 0 14px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.94);
    color: #111;
    font-size: 14px;
    font-weight: 950;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    text-decoration: none;
    box-shadow: 0 10px 26px rgba(0,0,0,.16);
  }

  .ftg-more-language-row {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: 2px;
    margin-bottom: 12px;
  }
  .ftg-more-language-row::-webkit-scrollbar {
    display: none;
  }
  .ftg-more-language-btn {
    flex: 0 0 auto;
    min-height: 34px;
    padding: 7px 11px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.08);
    color: rgba(255,255,255,.84);
    font-size: 11px;
    font-weight: 900;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .ftg-more-language-btn.active {
    background: rgba(255,255,255,.94);
    color: #111;
  }

  .ftg-more-featured {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    margin-bottom: 10px;
  }
  .ftg-more-featured .ftg-more-item {
    width: min(100%, 280px);
    min-height: 96px;
    padding: 12px 14px;
    border-radius: 24px;
  }
  .ftg-more-featured .ftg-more-item-label {
    font-size: 15px;
  }

  .ftg-more-grid {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin-bottom: 10px;
  }
  .ftg-more-item {
    position: relative;
    min-height: 84px;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 22px;
    background: rgba(255,255,255,.08);
    background-position: center center;
    background-size: cover;
    background-repeat: no-repeat;
    color: var(--ftg-text);
    text-decoration: none;
    padding: 10px 11px;
    display: grid;
    align-content: space-between;
    gap: 10px;
    cursor: pointer;
    overflow: hidden;
    transition: transform .22s ease, background .22s ease, border-color .22s ease;
  }
  .ftg-more-item::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(8,12,16,.16), rgba(8,12,16,.72));
    pointer-events: none;
  }
  .ftg-more-item:active {
    transform: scale(.98);
  }
  .ftg-more-item.active {
    background-color: rgba(255,255,255,.14);
    border-color: rgba(255,255,255,.18);
  }
  .ftg-more-item-top {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }
  .ftg-more-item-icon {
    display: none;
  }
  .ftg-more-item-arrow {
    color: rgba(255,255,255,.48);
    font-size: 16px;
    line-height: 1;
  }
  .ftg-more-item-label {
    position: relative;
    z-index: 1;
    font-size: 13px;
    line-height: 1.05;
    letter-spacing: -.02em;
    font-weight: 900;
    text-align: left;
    text-wrap: balance;
  }

  .ftg-more-footer {
    position: relative;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 12px;
    padding-top: 2px;
  }
  .ftg-more-footer a {
    color: rgba(255,255,255,.62);
    font-size: 12px;
    font-weight: 800;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .ftg-ai-chat {
    position: fixed;
    left: 10px;
    right: 10px;
    top: calc(72px + env(safe-area-inset-top));
    bottom: calc(74px + env(safe-area-inset-bottom));
    z-index: 10100;
    display: none;
    flex-direction: column;
    overflow: hidden;
    border-radius: 26px;
    border: 1px solid rgba(255,255,255,.34);
    background: rgba(255,255,255,.78);
    box-shadow: 0 24px 70px rgba(0,0,0,.28);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    color: #111;
  }
  .ftg-ai-chat.ai-open {
    display: flex;
  }
  .ftg-ai-head {
    padding: 14px 14px 12px;
    border-bottom: 1px solid rgba(0,0,0,.07);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .ftg-ai-head-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    flex: 1;
  }
  .ftg-ai-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    overflow: hidden;
    flex: 0 0 42px;
    background: rgba(255,255,255,.85);
    border: 1px solid rgba(0,0,0,.08);
    box-shadow: 0 4px 14px rgba(0,0,0,.12);
  }
  .ftg-ai-avatar video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center 0%;
    transform: scale(1.22);
  }
  .ftg-ai-title {
    font-size: 15px;
    font-weight: 900;
    letter-spacing: -.03em;
    line-height: 1.1;
    color: #111;
  }
  .ftg-ai-subtitle {
    margin-top: 3px;
    font-size: 12px;
    color: rgba(0,0,0,.52);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.15;
  }
  .ftg-ai-close {
    width: 32px;
    height: 32px;
    border: 0;
    border-radius: 50%;
    background: rgba(0,0,0,.07);
    color: #111;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
  }
  .ftg-ai-messages {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 12px;
    font-size: 14px;
    line-height: 1.35;
    -webkit-overflow-scrolling: touch;
  }
  .ftg-ai-msg {
    max-width: 84%;
    word-break: break-word;
    margin-bottom: 8px;
    padding: 10px 12px;
    border-radius: 18px;
    white-space: pre-line;
  }
  .ftg-ai-msg.user {
    margin-left: auto;
    background: #111;
    color: #fff;
    border-bottom-right-radius: 6px;
  }
  .ftg-ai-msg.bot {
    margin-right: auto;
    background: rgba(0,0,0,.07);
    color: #111;
    border-bottom-left-radius: 6px;
  }
  .ftg-ai-suggestions {
    display: flex;
    gap: 7px;
    padding: 0 12px 10px;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .ftg-ai-suggestions::-webkit-scrollbar {
    display: none;
  }
  .ftg-ai-suggestion {
    flex: 0 0 auto;
    border: 0;
    border-radius: 999px;
    padding: 8px 10px;
    background: rgba(0,0,0,.07);
    color: #111;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .ftg-ai-input-row {
    padding: 10px;
    display: flex;
    gap: 8px;
    border-top: 1px solid rgba(0,0,0,.07);
    background: rgba(255,255,255,.36);
  }
  .ftg-ai-input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    border-radius: 999px;
    background: rgba(0,0,0,.07);
    color: #111;
    padding: 11px 13px;
    font-size: 15px;
  }
  .ftg-ai-send {
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 50%;
    background: #111;
    color: #fff;
    font-weight: 900;
    cursor: pointer;
  }

  body.ftg-ai-chat-active .ftg-more-fab,
  body.ftg-ai-chat-active .ftg-more-panel,
  body.ftg-ai-chat-active .ftg-more-overlay,
  body.ftg-ai-chat-active .ftg-ai-fab {
    opacity: 0;
    pointer-events: none;
    visibility: hidden;
  }

  @media (min-width: 700px) {
    .ftg-ai-chat {
      max-width: 380px;
    }
    .ftg-ai-chat {
      left: max(10px, calc(50% - 190px));
      right: max(10px, calc(50% - 190px));
    }
  }
  .ftg-actionbar-shell[dir="rtl"] .ftg-more-panel {
    left: calc(var(--ftg-fab-right) - 14px);
    right: 6px;
    border-radius: 0 0 30px 0;
    transform-origin: top left;
  }
  .ftg-actionbar-shell[dir="rtl"] .ftg-more-head {
    padding-left: 70px;
    padding-right: 0;
  }
  .ftg-actionbar-shell[dir="rtl"] .ftg-more-item-label,
  .ftg-actionbar-shell[dir="rtl"] .ftg-ai-title,
  .ftg-actionbar-shell[dir="rtl"] .ftg-ai-subtitle {
    text-align: right;
  }
  .ftg-actionbar-shell[dir="rtl"] .ftg-ai-messages {
    direction: rtl;
  }
  .ftg-actionbar-shell[dir="rtl"] .ftg-ai-msg.user {
    margin-right: auto;
    margin-left: 0;
    border-bottom-left-radius: 6px;
    border-bottom-right-radius: 18px;
  }
  .ftg-actionbar-shell[dir="rtl"] .ftg-ai-msg.bot {
    margin-left: auto;
    margin-right: 0;
    border-bottom-right-radius: 6px;
    border-bottom-left-radius: 18px;
  }
</style>

        askPlaceholder: 'اسأل الدليل...',
        aiTitle: 'Captain Gull',
        aiSubtitle: 'شريط الإجراءات العام',
        aiWelcome: 'أصبح شريط الإجراءات العام جاهزًا. يمكنك الآن إعادة استخدامه في كل صفحات الموقع.',
        aiReplyPrefix: 'الصفحة النشطة:',
        aiReplySuffix: 'هذه هي القاعدة المشتركة لشريط الإجراءات الجديد البسيط.',
        suggest1: 'كيف ننظم القائمة؟',
        suggest2: 'ما الصفحة النشطة؟',
        suggest3: 'لنستخدمه في كامل الموقع',
        map: 'الخريطة',
        home: 'الرئيسية',
        guide: 'الدليل',
        places: 'الأماكن',
        localDiscounts: 'خصومات محلية',
        trails: 'المسارات',
        privacy: 'الخصوصية',
        policy: 'السياسة'
      }
    };

    var state = {
      config: {},
      activePage: 'home',
      currentLanguage: 'it',
      moreOpen: false,
      aiOpen: false,
      welcomed: false,
      messages: []
    };

    function escapeHTML(value) {
      return String(value || '').replace(/[&<>\"]/g, function (char) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[char];
      });
    }

    function normalizeLanguage(code) {
      code = String(code || '').toLowerCase().trim();
      if (!code) return 'it';
      if (code.indexOf('-') !== -1) code = code.split('-')[0];
      return I18N[code] ? code : 'it';
    }

    function localizedValue(value, fallback) {
      if (value && typeof value === 'object' && !Array.isArray(value)) {
        return value[state.currentLanguage] || value.en || value.it || fallback || '';
      }
      if (typeof value === 'string') return value;
      return fallback || '';
    }

    function t(key, fallback) {
      var dict = I18N[state.currentLanguage] || I18N.it;
      return dict[key] || fallback || key;
    }

    function getStoredLanguage() {
      try {
        return normalizeLanguage(localStorage.getItem('ftg-actionbar-language') || '');
      } catch (error) {
        return 'it';
      }
    }

    function setStoredLanguage(code) {
      try {
        localStorage.setItem('ftg-actionbar-language', code);
      } catch (error) {}
    }

    function getConfig() {
      return window.FTG_ACTIONBAR_CONFIG || {};
    }

    function resolveHref(href) {
      var cfg = state.config;
      var basePath = typeof cfg.basePath === 'string' ? cfg.basePath.trim() : '';
      var value = String(href || '').trim();
      if (!value) return '';
      if (/^(https?:|mailto:|tel:|#|\/)/i.test(value)) return value;
      if (basePath) return basePath.replace(/\/+$/, '') + '/' + value.replace(/^\/+/, '');
      return '/' + value.replace(/^\/+/, '');
    }

    function getLanguages() {
      var cfg = state.config;
      var custom = Array.isArray(cfg.languages) ? cfg.languages : [];
      var map = {};
      DEFAULT_LANGUAGES.forEach(function(lang) {
        map[lang.code] = { code: lang.code, label: lang.label };
      });
      custom.forEach(function(lang) {
        var code = normalizeLanguage(lang && lang.code);
        if (!code) return;
        map[code] = {
          code: code,
          label: localizedValue(lang && (lang.label_i18n || lang.label), map[code] && map[code].label || code)
        };
      });
      return DEFAULT_LANGUAGES.map(function(lang) { return map[lang.code] || lang; });
    }

    function getCurrentFlag() {
      var current = getLanguages().find(function(lang){ return lang.code === state.currentLanguage; }) || getLanguages()[0] || { label: '🌐' };
      return String(current.label || '🌐').split(' ')[0];
    }

    function getPages() {
      var cfg = state.config;
      var pages = cfg.pages || {};
      return {
        map: Object.assign({ label: t('map'), href: 'map.html' }, pages.map || {}),
        home: Object.assign({ label: t('home'), href: '#home' }, pages.home || {}),
        guide: Object.assign({ label: t('guide'), href: '#guide' }, pages.guide || {})
      };
    }

    function getMenuItems() {
      var cfg = state.config;
      var pages = getPages();
      var defaults = [
        { id: 'map', label: pages.map.label, href: pages.map.href },
        { id: 'home', label: pages.home.label, href: pages.home.href },
        { id: 'guide', label: pages.guide.label, href: pages.guide.href },
        { id: 'places', label: t('places'), href: '#places', backgroundImage: 'https://images.pexels.com/photos/7118987/pexels-photo-7118987.jpeg?_gl=1*1ygueye*_ga*MTU5NzY4NjgyOS4xNzcwMjQ3MTk3*_ga_8JE65Q40S6*czE3ODEyMDU2NjkkbzM3JGcxJHQxNzgxMjA2NDE0JGo1OSRsMCRoMA..' },
        { id: 'local-discounts', label: t('localDiscounts'), href: '#local-discounts', backgroundImage: 'https://images.pexels.com/photos/34342746/pexels-photo-34342746.jpeg?_gl=1*1j2vzz9*_ga*MTU5NzY4NjgyOS4xNzcwMjQ3MTk3*_ga_8JE65Q40S6*czE3ODEyMDU2NjkkbzM3JGcxJHQxNzgxMjA2NjgzJGoxMiRsMCRoMA..' },
        { id: 'sentieri', label: t('trails'), href: '#sentieri', backgroundImage: 'https://images.pexels.com/photos/13368981/pexels-photo-13368981.jpeg?_gl=1*oqh5qj*_ga*MTU5NzY4NjgyOS4xNzcwMjQ3MTk3*_ga_8JE65Q40S6*czE3ODEyMDU2NjkkbzM3JGcxJHQxNzgxMjA2OTQwJGo1OCRsMCRoMA..' }
      ];
      var provided = Array.isArray(cfg.menuItems) && cfg.menuItems.length ? cfg.menuItems : defaults;
      return provided.map(function(item) {
        var fallbackLabel = item.id === 'map' ? t('map') : item.id === 'home' ? t('home') : item.id === 'guide' ? t('guide') : item.id === 'places' ? t('places') : item.id === 'local-discounts' ? t('localDiscounts') : item.id === 'sentieri' ? t('trails') : (item.label || item.id || '');
        return Object.assign({}, item, {
          label: localizedValue(item.label_i18n || item.label, fallbackLabel)
        });
      });
    }

    function getLegalLinks() {
      var cfg = state.config;
      var defaults = [
        { label: t('privacy'), href: '#privacy' },
        { label: t('policy'), href: '#policy' }
      ];
      var links = Array.isArray(cfg.legalLinks) && cfg.legalLinks.length ? cfg.legalLinks : defaults;
      return links.map(function(link, index) {
        var fallback = index === 0 ? t('privacy') : t('policy');
        return Object.assign({}, link, { label: localizedValue(link.label_i18n || link.label, fallback) });
      });
    }

    function getFeaturedMenuItem(items) {
      var featuredId = state.activePage === 'map' ? 'home' : 'map';
      return items.find(function(item) { return item.id === featuredId; }) || null;
    }

    function getSecondaryMenuItems(items, featuredItem) {
      return items.filter(function(item) {
        if (featuredItem && item.id === featuredItem.id) return false;
        if (state.activePage !== 'map' && item.id === 'home') return false;
        if (state.activePage === 'map' && item.id === 'map') return false;
        return true;
      });
    }

    function getAccountPillLabel() {
      var cfg = state.config;
      var name = localizedValue(cfg.userName, 'Utente');
      if (cfg.isLoggedIn) return t('hi') + ', ' + name;
      return localizedValue(cfg.loginLabel, t('login'));
    }

    function getAITitle() {
      return localizedValue(state.config.aiTitle, t('aiTitle'));
    }

    function getAISubtitle() {
      return localizedValue(state.config.aiSubtitle, t('aiSubtitle'));
    }

    function getAIWelcome() {
      return localizedValue(state.config.aiWelcome, t('aiWelcome'));
    }

    function getAISuggestions() {
      var custom = Array.isArray(state.config.aiSuggestions) ? state.config.aiSuggestions : [];
      if (custom.length) {
        return custom.map(function(item) { return localizedValue(item, String(item || '')); }).filter(Boolean).slice(0, 3);
      }
      return [t('suggest1'), t('suggest2'), t('suggest3')];
    }

    function getDefaultAIReply() {
      return t('aiReplyPrefix') + ' ' + state.activePage + '. ' + t('aiReplySuffix');
    }

    function syncStateFromConfig() {
      var cfg = getConfig();
      var hostLang = window.FTG_I18N && typeof window.FTG_I18N.getLanguage === 'function' ? window.FTG_I18N.getLanguage() : '';
      state.config = cfg;
      state.activePage = cfg.activePage || state.activePage || 'home';
      state.currentLanguage = normalizeLanguage(cfg.language || state.currentLanguage || hostLang || getStoredLanguage() || 'it');
      setStoredLanguage(state.currentLanguage);
    }

    function syncBodyState() {
      document.body.classList.toggle('ftg-more-open', !!state.moreOpen);
      document.body.classList.toggle('ftg-ai-chat-active', !!state.aiOpen);
    }

    function renderMessages() {
      return state.messages.map(function(message) {
        return '<div class="ftg-ai-msg ' + (message.user ? 'user' : 'bot') + '">' + escapeHTML(message.text) + '</div>';
      }).join('');
    }

    function buildMenuCard(item) {
      var isActive = state.activePage === item.id;
      var backgroundStyle = item.backgroundImage ? ' style="background-image:url(' + "'" + escapeHTML(item.backgroundImage) + "'" + ')"' : '';
      return '<button class="ftg-more-item' + (isActive ? ' active' : '') + '" type="button" data-page-target="' + escapeHTML(item.id || '') + '" data-page-href="' + escapeHTML(item.href || '') + '"' + backgroundStyle + '><span class="ftg-more-item-top"><span class="ftg-more-item-arrow">›</span></span><span class="ftg-more-item-label">' + escapeHTML(item.label || item.id || '') + '</span></button>';
    }

    function render() {
      var languages = getLanguages();
      var menuItems = getMenuItems();
      var featured = getFeaturedMenuItem(menuItems);
      var secondaryItems = getSecondaryMenuItems(menuItems, featured);
      var legalLinks = getLegalLinks();
      var direction = state.currentLanguage === 'ar' ? 'rtl' : 'ltr';

      root.innerHTML = '' +
        '<div class="ftg-actionbar-shell" dir="' + direction + '">' +
          '<button class="ftg-fab ftg-more-fab' + (state.moreOpen ? ' open' : '') + '" id="ftg-more-fab" type="button" aria-label="' + escapeHTML(t('openMenu')) + '">' +
            '<span class="ftg-more-icon"><span></span><span></span><span></span><span></span></span>' +
          '</button>' +
          '<div class="ftg-more-overlay' + (state.moreOpen ? ' open' : '') + '" id="ftg-more-overlay"></div>' +
          '<aside class="ftg-more-panel' + (state.moreOpen ? ' open' : '') + '" id="ftg-more-panel" aria-hidden="' + (state.moreOpen ? 'false' : 'true') + '">' +
            '<div class="ftg-more-head"><button class="ftg-more-primary" id="ftg-more-primary" type="button">' + escapeHTML(getAccountPillLabel()) + '</button></div>' +
            '<div class="ftg-more-language-row" id="ftg-more-language-row">' +
              languages.map(function(lang) {
                return '<button class="ftg-more-language-btn' + (lang.code === state.currentLanguage ? ' active' : '') + '" type="button" data-lang="' + escapeHTML(lang.code) + '">' + escapeHTML(lang.label) + '</button>';
              }).join('') +
            '</div>' +
            (featured ? '<div class="ftg-more-featured">' + buildMenuCard(featured) + '</div>' : '') +
            '<div class="ftg-more-grid">' + secondaryItems.map(buildMenuCard).join('') + '</div>' +
            '<div class="ftg-more-footer">' + legalLinks.map(function(link) {
              return '<a href="' + escapeHTML(link.href || '#') + '">' + escapeHTML(link.label || '') + '</a>';
            }).join('') + '</div>' +
          '</aside>' +
          '<button class="ftg-fab ftg-ai-fab" id="ftg-ai-chat-btn" type="button" aria-label="' + escapeHTML(t('aiOpen')) + '">' +
            '<video id="ftg-ai-mascot-video" autoplay muted loop playsinline preload="auto">' +
              '<source src="https://tanzaniagetawayinfo-source.github.io/5TerreGo/mascotterelax.webm" type="video/webm">' +
              '<source src="https://raw.githubusercontent.com/tanzaniagetawayinfo-source/5TerreGo/main/mascotterelax.webm" type="video/webm">' +
            '</video>' +
          '</button>' +
          '<div id="ftg-ai-chat" class="ftg-ai-chat' + (state.aiOpen ? ' ai-open' : '') + '" aria-hidden="' + (state.aiOpen ? 'false' : 'true') + '">' +
            '<div class="ftg-ai-head">' +
              '<div class="ftg-ai-head-left">' +
                '<div class="ftg-ai-avatar">' +
                  '<video id="ftg-ai-header-video" autoplay muted loop playsinline preload="auto">' +
                    '<source src="https://tanzaniagetawayinfo-source.github.io/5TerreGo/mascotterelax.webm" type="video/webm">' +
                    '<source src="https://raw.githubusercontent.com/tanzaniagetawayinfo-source/5TerreGo/main/mascotterelax.webm" type="video/webm">' +
                  '</video>' +
                '</div>' +
                '<div><div class="ftg-ai-title">' + escapeHTML(getAITitle()) + '</div><div class="ftg-ai-subtitle">' + escapeHTML(getAISubtitle()) + '</div></div>' +
              '</div>' +
              '<button id="ftg-ai-close" class="ftg-ai-close" type="button" aria-label="' + escapeHTML(t('aiClose')) + '">×</button>' +
            '</div>' +
            '<div id="ftg-ai-messages" class="ftg-ai-messages">' + renderMessages() + '</div>' +
            '<div class="ftg-ai-suggestions">' + getAISuggestions().map(function(label) {
              return '<button class="ftg-ai-suggestion" type="button">' + escapeHTML(label) + '</button>';
            }).join('') + '</div>' +
            '<div class="ftg-ai-input-row">' +
              '<input id="ftg-ai-input" class="ftg-ai-input" placeholder="' + escapeHTML(t('askPlaceholder')) + '" autocomplete="off" />' +
              '<button id="ftg-ai-send" class="ftg-ai-send" type="button">→</button>' +
            '</div>' +
          '</div>' +
        '</div>';

      bindUI();
      syncBodyState();
      forceMascotVideos();
    }

    function setActivePage(pageId) {
      state.activePage = pageId || state.activePage;
      render();
    }

    function openMorePanel() {
      state.moreOpen = true;
      render();
    }

    function closeMorePanel() {
      state.moreOpen = false;
      render();
    }

    function toggleMorePanel(forceOpen) {
      state.moreOpen = typeof forceOpen === 'boolean' ? forceOpen : !state.moreOpen;
      render();
    }

    function openAI(forceOpen) {
      var shouldOpen = typeof forceOpen === 'boolean' ? forceOpen : !state.aiOpen;
      state.aiOpen = shouldOpen;
      if (shouldOpen) {
        state.moreOpen = false;
        if (!state.welcomed) {
          state.welcomed = true;
          state.messages.push({ text: getAIWelcome(), user: false });
        }
      }
      render();
    }

    function addAIMessage(text, isUser) {
      state.messages.push({ text: String(text || ''), user: !!isUser });
      render();
      var scroller = document.getElementById('ftg-ai-messages');
      if (scroller) scroller.scrollTop = scroller.scrollHeight;
    }

    function handleAISend(textFromButton) {
      var input = document.getElementById('ftg-ai-input');
      var text = String(textFromButton || (input && input.value) || '').trim();
      if (!text) return;
      addAIMessage(text, true);
      if (input) input.value = '';
      if (typeof state.config.onAIMessage === 'function') {
        Promise.resolve(state.config.onAIMessage({ text: text, activePage: state.activePage, language: state.currentLanguage })).then(function(reply) {
          if (!reply) reply = getDefaultAIReply();
          addAIMessage(reply, false);
        }).catch(function() {
          addAIMessage(getDefaultAIReply(), false);
        });
        return;
      }
      window.setTimeout(function () {
        addAIMessage(getDefaultAIReply(), false);
      }, 120);
    }

    function setLanguage(code, notify) {
      var next = normalizeLanguage(code);
      state.currentLanguage = next;
      state.config.language = next;
      window.FTG_ACTIONBAR_CONFIG = state.config;
      setStoredLanguage(next);
      render();
      if (notify !== false && typeof state.config.onLanguageChange === 'function') {
        state.config.onLanguageChange(next);
      }
    }

    function navigateTo(itemId, href) {
      var finalHref = itemId === 'map' ? resolveHref('map.html') : resolveHref(href || '');
      state.activePage = itemId || state.activePage;
      state.moreOpen = false;
      render();
      if (itemId === 'map') {
        window.location.href = finalHref;
        return;
      }
      if (typeof state.config.onNavigate === 'function') {
        state.config.onNavigate(itemId, { href: finalHref });
        return;
      }
      if (finalHref) window.location.href = finalHref;
    }

    function forceMascotVideos() {
      ['ftg-ai-mascot-video', 'ftg-ai-header-video'].forEach(function (id) {
        var video = document.getElementById(id);
        if (!video) return;
        video.muted = true;
        video.loop = true;
        video.playsInline = true;
        video.setAttribute('muted', '');
        video.setAttribute('playsinline', '');
        video.setAttribute('webkit-playsinline', '');
        try { video.load(); } catch (error) {}
        var playPromise = video.play();
        if (playPromise && typeof playPromise.catch === 'function') playPromise.catch(function () {});
      });
    }

    function bindUI() {
      var moreFab = document.getElementById('ftg-more-fab');
      var moreOverlay = document.getElementById('ftg-more-overlay');
      var morePrimary = document.getElementById('ftg-more-primary');
      var aiBtn = document.getElementById('ftg-ai-chat-btn');
      var aiClose = document.getElementById('ftg-ai-close');
      var aiSend = document.getElementById('ftg-ai-send');
      var aiInput = document.getElementById('ftg-ai-input');

      if (moreFab) moreFab.addEventListener('click', function () { toggleMorePanel(); });
      if (moreOverlay) moreOverlay.addEventListener('click', function () { closeMorePanel(); });
      if (morePrimary) {
        morePrimary.addEventListener('click', function () {
          state.moreOpen = false;
          render();
          window.location.href = resolveHref('login.html');
        });
      }

      Array.prototype.slice.call(root.querySelectorAll('[data-page-target]')).forEach(function(button) {
        button.addEventListener('click', function () {
          navigateTo(button.getAttribute('data-page-target'), button.getAttribute('data-page-href'));
        });
      });

      Array.prototype.slice.call(root.querySelectorAll('.ftg-more-language-btn')).forEach(function(button) {
        button.addEventListener('click', function () {
          setLanguage(button.getAttribute('data-lang'));
        });
      });

      if (aiBtn) aiBtn.addEventListener('click', function () { openAI(); });
      if (aiClose) aiClose.addEventListener('click', function () { openAI(false); });
      if (aiSend) aiSend.addEventListener('click', function () { handleAISend(); });
      if (aiInput) {
        aiInput.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') handleAISend();
        });
      }

      Array.prototype.slice.call(root.querySelectorAll('.ftg-ai-suggestion')).forEach(function(button) {
        button.addEventListener('click', function () {
          handleAISend(button.textContent || '');
        });
      });
    }

    function handleExternalConfig(detail) {
      var nextConfig = Object.assign({}, getConfig());
      if (detail && detail.config && typeof detail.config === 'object') {
        nextConfig = Object.assign(nextConfig, detail.config);
      }
      if (detail && detail.language) nextConfig.language = detail.language;
      if (detail && detail.activePage) nextConfig.activePage = detail.activePage;
      window.FTG_ACTIONBAR_CONFIG = nextConfig;
      syncStateFromConfig();
      render();
    }

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') {
        if (state.moreOpen) closeMorePanel();
        if (state.aiOpen) openAI(false);
      }
    });

    window.addEventListener('load', forceMascotVideos);
    document.addEventListener('touchstart', forceMascotVideos, { passive: true, once: true });
    document.addEventListener('click', forceMascotVideos, { passive: true, once: true });
    window.addEventListener('ftg-actionbar-config-changed', function(event) { handleExternalConfig(event && event.detail); });
    document.addEventListener('ftg-actionbar-config-changed', function(event) { handleExternalConfig(event && event.detail); });

    syncStateFromConfig();
    render();

    window.FTG_GLOBAL_ACTIONBAR = {
      rerender: render,
      openMorePanel: openMorePanel,
      closeMorePanel: closeMorePanel,
      toggleAI: openAI,
      getCurrentPage: function () { return state.activePage; },
      setActivePage: function (pageId) { state.activePage = pageId || state.activePage; render(); },
      setLanguage: function (code, notify) { setLanguage(code, notify); },
      updateConfig: function (nextConfig) {
        window.FTG_ACTIONBAR_CONFIG = Object.assign({}, getConfig(), nextConfig || {});
        syncStateFromConfig();
        render();
      }
    };
  }());
</script>
