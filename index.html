<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>5TerreGo Stories</title>
<style>
  :root{
    --bg:#f4f7fb;
    --surface:#ffffff;
    --surface-2:#f9fbff;
    --text:#111827;
    --muted:#6b7280;
    --line:#dde4ef;
    --line-2:#e9eef6;
    --primary:#173b8f;
    --accent:#ff7e57;
    --accent-soft:#fff3e8;
    --shadow:0 18px 42px rgba(17,24,39,.08);
    --shadow-soft:0 10px 24px rgba(17,24,39,.05);
    --radius-xl:30px;
    --radius-lg:24px;
    --radius-md:18px;
    --radius-sm:14px;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at top left, rgba(23,59,143,.06), transparent 30%),
      radial-gradient(circle at top right, rgba(255,126,87,.08), transparent 24%),
      linear-gradient(180deg,#fbfdff 0%,var(--bg) 100%);
  }

  button,input{font:inherit}
  button{border:none;background:none;padding:0;cursor:pointer}

  body.ftg-actionbar-enabled{padding-top:0 !important}

  #ftg-global-actionbar-root{
    position:relative;
    z-index:80;
  }

  #ftg-global-actionbar-root .ftg-topbar{
    position:relative !important;
    top:auto !important;
    left:auto !important;
    right:auto !important;
    inset:auto !important;
    width:100% !important;
  }

  #ftg-global-actionbar-root .ftg-menu-panel{
    position:fixed !important;
  }

  .page{
    width:100%;
    max-width:780px;
    margin:0 auto;
    padding:6px 16px 40px;
  }

  .hero{
    position:relative;
    overflow:visible;
    border-radius:0;
    background:transparent;
    border:none;
    box-shadow:none;
    padding:0;
    min-height:auto;
  }

  .hero-copy{
    position:relative;
    z-index:2;
    max-width:56%;
    padding-top:6px;
  }

  .hero h1{
    margin:0;
    font-size:34px;
    line-height:.96;
    letter-spacing:-.06em;
    color:#0f172a;
  }

  .hero p{
    margin:12px 0 0;
    font-size:15px;
    line-height:1.52;
    color:#667085;
  }

  .hero-illustration{
    position:absolute;
    right:-6px;
    top:-8px;
    bottom:auto;
    width:52%;
    display:flex;
    align-items:flex-start;
    justify-content:flex-end;
    opacity:.74;
    pointer-events:none;
  }

  .hero-illustration svg{
    width:100%;
    height:100%;
    display:block;
  }

  .search-wrap{
    margin-top:14px;
    position:relative;
  }

  .search{
    width:100%;
    height:58px;
    border-radius:999px;
    border:1px solid var(--line);
    background:#fff;
    box-shadow:0 14px 30px rgba(17,24,39,.06);
    padding:0 18px 0 54px;
    color:var(--text);
    outline:none;
    font-size:17px;
  }

  .search::placeholder{color:#98a2b3}

  .search-icon{
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    width:22px;
    height:22px;
    color:#667085;
    pointer-events:none;
  }

  .chips{
    display:flex;
    gap:10px;
    overflow-x:auto;
    overflow-y:hidden;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
    padding:6px 1px 4px;
    scroll-snap-type:x proximity;
  }

  .chips-top{
    margin-bottom:10px;
  }

  .chips::-webkit-scrollbar{display:none}

  .chip{
    flex:0 0 auto;
    min-height:44px;
    padding:0 18px;
    border-radius:999px;
    border:1px solid var(--line);
    background:#f3f5fa;
    color:#202939;
    font-size:15px;
    font-weight:700;
    box-shadow:0 8px 18px rgba(17,24,39,.03);
    scroll-snap-align:start;
    transition:transform .16s ease,background .16s ease,border-color .16s ease,color .16s ease;
  }

  .chip:active{transform:scale(.98)}
  .chip.active{
    background:var(--accent-soft);
    border-color:#ffd7c5;
    color:#a24d2f;
  }

  .section{
    margin-top:14px;
  }

  .featured-card{
    position:relative;
    overflow:hidden;
    min-height:286px;
    border-radius:28px;
    box-shadow:var(--shadow);
    background:
      linear-gradient(180deg, rgba(0,0,0,.05) 0%, rgba(0,0,0,.42) 100%),
      url('https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
    border:1px solid rgba(255,255,255,.55);
    display:flex;
    align-items:flex-end;
    padding:20px;
  }

  .featured-card::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(180deg, rgba(255,255,255,.02) 0%, rgba(0,0,0,.45) 100%),
      radial-gradient(circle at top right, rgba(255,214,184,.18), transparent 24%);
  }

  .featured-content{
    position:relative;
    z-index:1;
    width:100%;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:14px;
  }

  .featured-title{
    max-width:72%;
    margin:0;
    color:#fff;
    font-size:26px;
    line-height:1.02;
    letter-spacing:-.05em;
    font-weight:850;
    text-shadow:0 8px 18px rgba(0,0,0,.25);
  }

  .time-badge{
    flex:0 0 auto;
    display:inline-flex;
    align-items:center;
    gap:8px;
    min-height:42px;
    padding:0 14px;
    border-radius:999px;
    background:rgba(20,33,61,.68);
    color:#fff;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    box-shadow:0 8px 22px rgba(0,0,0,.2);
    font-size:14px;
    font-weight:700;
  }

  .stories-list{
    display:grid;
    gap:12px;
    margin-top:0;
  }

  .story-card{
    display:grid;
    grid-template-columns:124px minmax(0,1fr) 30px;
    gap:14px;
    align-items:center;
    padding:14px;
    border-radius:24px;
    background:rgba(255,255,255,.9);
    border:1px solid rgba(255,255,255,.95);
    box-shadow:var(--shadow-soft);
    transition:transform .16s ease, box-shadow .16s ease;
  }

  .story-card:active{transform:scale(.992)}

  .story-thumb{
    width:124px;
    height:124px;
    border-radius:18px;
    overflow:hidden;
    position:relative;
    background:#e8eef7;
  }

  .story-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .story-body{
    min-width:0;
  }

  .story-title{
    margin:0;
    font-size:18px;
    line-height:1.08;
    letter-spacing:-.03em;
    color:#111827;
    font-weight:800;
  }

  .story-preview{
    margin:8px 0 10px;
    font-size:14px;
    line-height:1.42;
    color:#667085;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .meta{
    display:flex;
    align-items:center;
    gap:8px;
    color:#667085;
    font-size:14px;
    font-weight:600;
  }

  .bookmark{
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#8b96a8;
  }

  .bookmark.active{color:var(--accent)}

  .section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin:18px 0 10px;
  }

  .section-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:16px;
    font-weight:850;
    letter-spacing:-.03em;
    color:#111827;
  }

  .section-link{
    color:var(--accent);
    font-size:15px;
    font-weight:800;
    text-decoration:none;
  }

  .saved-list{
    display:grid;
    gap:10px;
  }

  .saved-card{
    display:grid;
    grid-template-columns:90px minmax(0,1fr) 22px;
    gap:14px;
    align-items:center;
    padding:12px;
    border-radius:22px;
    background:rgba(255,255,255,.88);
    border:1px solid rgba(255,255,255,.94);
    box-shadow:var(--shadow-soft);
  }

  .saved-thumb{
    width:90px;
    height:90px;
    border-radius:16px;
    overflow:hidden;
    background:#e8eef7;
  }

  .saved-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .saved-title{
    margin:0;
    font-size:16px;
    line-height:1.1;
    letter-spacing:-.02em;
    font-weight:800;
  }

  .saved-preview{
    margin:6px 0 8px;
    color:#667085;
    font-size:14px;
    line-height:1.42;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .saved-meta{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    color:#667085;
    font-size:13px;
    font-weight:600;
  }

  .dot{width:4px;height:4px;border-radius:999px;background:#c4ccd8}

  .empty-state{
    display:none;
    margin-top:14px;
    padding:26px 20px;
    border-radius:24px;
    text-align:center;
    background:rgba(255,255,255,.84);
    border:1px solid rgba(255,255,255,.94);
    box-shadow:var(--shadow-soft);
  }

  .empty-state.is-visible{display:block}

  .empty-state h3{
    margin:0;
    font-size:20px;
    letter-spacing:-.04em;
  }

  .empty-state p{
    margin:10px auto 0;
    max-width:320px;
    color:#667085;
    font-size:14px;
    line-height:1.5;
  }

  .clock-icon,
  .search-icon svg,
  .section-title svg,
  .bookmark svg,
  .menu-dots svg{
    width:100%;
    height:100%;
    display:block;
  }

  .clock-icon{
    width:18px;
    height:18px;
  }

  .section-title .download-icon{
    width:20px;
    height:20px;
    color:#111827;
  }

  .menu-dots{
    width:22px;
    height:22px;
    color:#98a2b3;
  }

  @media (max-width:640px){
    .page{padding:4px 14px 34px}

    .hero{
      min-height:auto;
      border-radius:0;
      padding:0;
    }

    .hero-copy{max-width:63%;padding-top:2px}

    .hero h1{font-size:30px}
    .hero p{font-size:14px}

    .search{height:54px;font-size:16px}

    .chip{min-height:40px;padding:0 16px;font-size:14px}

    .featured-card{
      min-height:240px;
      border-radius:24px;
      padding:16px;
    }

    .featured-title{font-size:22px;max-width:74%}

    .story-card{
      grid-template-columns:104px minmax(0,1fr) 24px;
      gap:12px;
      padding:12px;
      border-radius:20px;
    }

    .story-thumb{
      width:104px;
      height:104px;
      border-radius:15px;
    }

    .story-title{font-size:17px}
    .story-preview{font-size:13px}

    .saved-card{
      grid-template-columns:78px minmax(0,1fr) 18px;
      gap:12px;
      padding:10px;
      border-radius:18px;
    }

    .saved-thumb{width:78px;height:78px;border-radius:14px}
    .saved-title{font-size:15px}
    .saved-preview{font-size:13px}
  }
</style>
</head>

    function stripHTML(value) {
      var div = document.createElement('div');
      div.innerHTML = String(value || '');
      return collapseSpaces(div.textContent || div.innerText || '');
    }

    function getStoredSessionToken() {
      try {
        var raw = localStorage.getItem(AUTH_STORAGE_KEY);
        var parsed = null;
        if (!raw) return '';
        parsed = JSON.parse(raw);
        return (parsed && parsed.access_token) || (parsed && parsed.currentSession && parsed.currentSession.access_token) || (parsed && parsed.session && parsed.session.access_token) || '';
      } catch (_error) {
        return '';
      }
    }

    function getSavedSlugs() {
      try {
        var raw = localStorage.getItem(STORY_SAVE_KEY);
        var parsed = JSON.parse(raw || '[]');
        return Array.isArray(parsed) ? parsed : [];
      } catch (_error) {
        return [];
      }
    }

    function setSavedSlugs(slugs) {
      localStorage.setItem(STORY_SAVE_KEY, JSON.stringify(slugs));
    }

    function toggleSavedSlug(slug) {
      var current = getSavedSlugs();
      var next = current.indexOf(slug) >= 0 ? current.filter(function (item) { return item !== slug; }) : current.concat(slug);
      setSavedSlugs(next);
      render();
    }

    function getPreview(post) {
      var excerpt = stripHTML(post.excerpt);
      var content = stripHTML(post.content);
      if (excerpt) return excerpt;
      if (content) return content.slice(0, 150) + (content.length > 150 ? '…' : '');
      return t('open_guide');
    }

    function getReadingMinutes(post) {
      var source = collapseSpaces([post.title, post.excerpt, post.content].map(stripHTML).join(' '));
      var words = source ? source.split(' ').filter(Boolean).length : 0;
      return Math.max(3, Math.ceil(words / 180));
    }

    function normalizePost(row) {
      return {
        id: row.id,
        title: String(row.title || 'Untitled story').trim(),
        slug: String(row.slug || '').trim(),
        excerpt: row.excerpt || '',
        content: row.content || '',
        cover_image: row.cover_image || '',
        category: String(row.category || 'guide').toLowerCase(),
        readingMinutes: getReadingMinutes(row)
      };
    }

    function createHeaders() {
      var headers = { 'Content-Type': 'application/json' };
      var token = getStoredSessionToken();
      if (SUPABASE_ANON_KEY) {
        headers.apikey = SUPABASE_ANON_KEY;
        headers.Authorization = 'Bearer ' + SUPABASE_ANON_KEY;
      }
      if (token) headers.Authorization = 'Bearer ' + token;
      return headers;
    }

    function resolveStoryHref(slug) {
      var base = '';
      if (typeof window.FTG_BUILD_STORY_URL === 'function') return window.FTG_BUILD_STORY_URL(slug);
      if (window.FTG_STORY_BASE_PATH) {
        base = String(window.FTG_STORY_BASE_PATH);
        if (base.charAt(base.length - 1) === '/') base = base.slice(0, -1);
        return base + '/' + slug + '.html';
      }
      return '/stories/' + slug + '.html';
    }

    function getCardImage(post) {
      return post.cover_image || 'https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=900&q=80';
    }

    function getCategoryLabel(category) {
      return t(category) || category;
    }

    function applyStaticTranslations() {
      searchInput.placeholder = t('search');
      if (!posts.length) {
        emptyTitle.textContent = t('loading_title');
        emptyText.textContent = t('loading_text');
      }
      if (savedTitleNode) savedTitleNode.textContent = t('saved');
      savedSeeAll.textContent = t('see_all');
    }

    function buildChips() {
      var categories = Array.from(new Set(posts.map(function (post) { return post.category; }).filter(Boolean)));
      var ordered = ['guide', 'food', 'transport', 'tips', 'trails', 'villages'].filter(function (category) { return categories.indexOf(category) >= 0; });
      var finalCategories = ['all'].concat(ordered);
      chipsNav.innerHTML = finalCategories.map(function (category) {
        var active = category === activeFilter;
        var label = category === 'all' ? t('all') : getCategoryLabel(category);
        return '<button class="chip' + (active ? ' active' : '') + '" data-filter="' + escapeHTML(category) + '" type="button">' + escapeHTML(label) + '</button>';
      }).join('');
      Array.from(chipsNav.querySelectorAll('.chip')).forEach(function (chip) {
        chip.addEventListener('click', function () {
          activeFilter = chip.dataset.filter || 'all';
          render();
        });
      });
    }

    function storyCardMarkup(post) {
      var saved = getSavedSlugs().indexOf(post.slug) >= 0;
      return '<article class="story-card" data-slug="' + escapeHTML(post.slug) + '">' +
        '<div class="story-thumb"><img src="' + escapeHTML(getCardImage(post)) + '" alt="' + escapeHTML(post.title) + '" loading="lazy" /></div>' +
        '<div class="story-body">' +
          '<h3 class="story-title">' + escapeHTML(post.title) + '</h3>' +
          '<p class="story-preview">' + escapeHTML(getPreview(post)) + '</p>' +
          '<div class="meta">' +
            '<span class="clock-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span>' +
            '<span>' + post.readingMinutes + ' min</span>' +
          '</div>' +
        '</div>' +
        '<button class="bookmark' + (saved ? ' active' : '') + '" type="button" data-save-slug="' + escapeHTML(post.slug) + '" aria-label="Save story">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12a1 1 0 0 1 1 1v16l-7-4-7 4V5a1 1 0 0 1 1-1z"></path></svg>' +
        '</button>' +
      '</article>';
    }

    function savedCardMarkup(post) {
      return '<article class="saved-card" data-slug="' + escapeHTML(post.slug) + '">' +
        '<div class="saved-thumb"><img src="' + escapeHTML(getCardImage(post)) + '" alt="' + escapeHTML(post.title) + '" loading="lazy" /></div>' +
        '<div>' +
          '<h3 class="saved-title">' + escapeHTML(post.title) + '</h3>' +
          '<p class="saved-preview">' + escapeHTML(getPreview(post)) + '</p>' +
          '<div class="saved-meta">' +
            '<span class="clock-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span>' +
            '<span>' + post.readingMinutes + ' min</span>' +
            '<span class="dot"></span>' +
            '<span>' + escapeHTML(t('saved_state')) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="menu-dots" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></div>' +
      '</article>';
    }

    function renderFeatured(post) {
      if (!post) {
        featuredCard.style.display = 'none';
        return;
      }
      featuredCard.style.display = 'flex';
      featuredCard.style.backgroundImage = 'linear-gradient(180deg, rgba(0,0,0,.05) 0%, rgba(0,0,0,.42) 100%), url("' + getCardImage(post) + '")';
      featuredTitle.textContent = post.title;
      featuredTime.textContent = post.readingMinutes + ' min';
      featuredCard.onclick = function () { window.location.href = resolveStoryHref(post.slug); };
    }

    function render() {
      var query = String(searchInput.value || '').trim().toLowerCase();
      var filtered = posts.filter(function (post) {
        var filterOk = activeFilter === 'all' || post.category === activeFilter;
        var haystack = (post.title + ' ' + getPreview(post) + ' ' + getCategoryLabel(post.category)).toLowerCase();
        var searchOk = !query || haystack.indexOf(query) >= 0;
        return filterOk && searchOk;
      });
      var savedSlugs = getSavedSlugs();
      var savedPosts = posts.filter(function (post) { return savedSlugs.indexOf(post.slug) >= 0; });
      applyStaticTranslations();
      buildChips();
      renderFeatured(featuredPost);
      storiesList.innerHTML = filtered.map(storyCardMarkup).join('');
      if (filtered.length === 0) {
        emptyTitle.textContent = t('empty_title');
        emptyText.textContent = t('empty_text');
        emptyState.classList.add('is-visible');
      } else {
        emptyState.classList.remove('is-visible');
      }
      savedSection.hidden = savedPosts.length === 0;
      savedList.innerHTML = savedPosts.map(savedCardMarkup).join('');
      savedSeeAll.style.display = savedPosts.length > 2 ? 'inline' : 'none';
    }

    function useFallbackData() {
      posts = FALLBACK_POSTS.map(normalizePost).filter(function (post) { return post.slug && post.title; });
      featuredPost = posts[0] || null;
      render();
    }

    async function loadPosts() {
      var response = null;
      var rows = null;
      if (!SUPABASE_ANON_KEY) {
        useFallbackData();
        return;
      }
      try {
        response = await fetch(SUPABASE_URL + '/rest/v1/blog_posts?select=id,title,slug,excerpt,content,cover_image,category,status,published_at,created_at&status=eq.published&order=created_at.desc', { headers: createHeaders() });
        if (!response.ok) {
          useFallbackData();
          return;
        }
        rows = await response.json();
        posts = Array.isArray(rows) ? rows.map(normalizePost).filter(function (post) { return post.slug && post.title; }) : [];
        featuredPost = posts[0] || null;
        if (!posts.length) {
          useFallbackData();
          return;
        }
        render();
      } catch (_error) {
        useFallbackData();
      }
    }

    async function loadGlobalActionbarPartial() {
      var i = 0;
      var response = null;
      var html = '';
      var parser = null;
      var doc = null;
      var scripts = [];
      var links = [];
      var styles = [];

      if (typeof window.FTG_MOUNT_GLOBAL_ACTIONBAR === 'function') return true;

      for (i = 0; i < ACTIONBAR_PARTIAL_CANDIDATES.length; i += 1) {
        try {
          response = await fetch(ACTIONBAR_PARTIAL_CANDIDATES[i], { cache: 'no-store' });
          if (!response.ok) continue;
          html = await response.text();
          if (!html) continue;

          parser = new DOMParser();
          doc = parser.parseFromString(html, 'text/html');
          links = Array.from(doc.querySelectorAll('link[rel="stylesheet"]'));
          styles = Array.from(doc.querySelectorAll('style'));
          scripts = Array.from(doc.querySelectorAll('script'));

          links.forEach(function (link) {
            var href = link.getAttribute('href') || '';
            if (!href) return;
            if (document.querySelector('link[data-ftg-actionbar-link="' + href.replace(/"/g, '&quot;') + '"]')) return;
            var el = document.createElement('link');
            el.rel = 'stylesheet';
            el.href = href;
            el.setAttribute('data-ftg-actionbar-link', href);
            document.head.appendChild(el);
          });

          styles.forEach(function (style, index) {
            var key = 'ftg-actionbar-style-' + i + '-' + index;
            if (document.getElementById(key)) return;
            var el = document.createElement('style');
            el.id = key;
            el.textContent = style.textContent || '';
            document.head.appendChild(el);
          });

          for (var s = 0; s < scripts.length; s += 1) {
            var original = scripts[s];
            var src = original.getAttribute('src');
            await new Promise(function (resolve) {
              var scriptEl = document.createElement('script');
              var done = false;
              function finish() {
                if (done) return;
                done = true;
                resolve();
              }
              if (src) {
                scriptEl.src = src;
                scriptEl.onload = finish;
                scriptEl.onerror = finish;
              } else {
                scriptEl.textContent = original.textContent || '';
              }
              document.head.appendChild(scriptEl);
              if (!src) finish();
            });
          }

          if (typeof window.FTG_MOUNT_GLOBAL_ACTIONBAR === 'function') return true;
        } catch (_error) {
        }
      }

      return typeof window.FTG_MOUNT_GLOBAL_ACTIONBAR === 'function';
    }

    async function mountActionbar() {
      window.FTG_ACTIONBAR_CONFIG = {
        activePage: 'stories',
        language: currentLanguage,
        userName: 'Guest',
        isLoggedIn: false,
        androidAppHref: '#android',
        privacyHref: '#privacy',
        termsHref: '#terms',
        menuItems: [
          { id: 'map', labelKey: 'nav_map', label: 'Map', href: 'map.html' },
          { id: 'stories', labelKey: 'nav_stories', label: 'Stories', href: '#' },
          { id: 'sentieri', labelKey: 'nav_sentieri', label: 'Sentieri', href: '#sentieri' },
          { id: 'discounts', labelKey: 'nav_discounts', label: 'Local Discounts', href: '#discounts' },
          { id: 'trains', labelKey: 'nav_trains', label: 'Public Transport', href: '#trains' },
          { id: 'weather', labelKey: 'nav_weather', label: 'Weather', href: '#weather' }
        ],
        onLanguageChange: function (lang) { setLanguage(lang || 'en'); }
      };

      await loadGlobalActionbarPartial();

      if (typeof window.FTG_MOUNT_GLOBAL_ACTIONBAR === 'function') {
        window.FTG_MOUNT_GLOBAL_ACTIONBAR(rootActionbar, window.FTG_ACTIONBAR_CONFIG);
      } else {
        rootActionbar.innerHTML = '';
        console.warn('FTG_MOUNT_GLOBAL_ACTIONBAR not available');
      }
    }

    function setLanguage(lang) {
      currentLanguage = PAGE_TEXT[lang] ? lang : 'en';
      try { localStorage.setItem(LANGUAGE_STORAGE_KEY, currentLanguage); } catch (_error) {}
      applyStaticTranslations();
      render();
    }

    document.addEventListener('click', function (event) {
      var saveButton = event.target.closest('[data-save-slug]');
      var storyCard = null;
      if (saveButton) {
        event.preventDefault();
        event.stopPropagation();
        toggleSavedSlug(saveButton.getAttribute('data-save-slug'));
        return;
      }
      storyCard = event.target.closest('.story-card, .saved-card');
      if (storyCard && storyCard.dataset.slug) window.location.href = resolveStoryHref(storyCard.dataset.slug);
    });

    searchInput.addEventListener('input', render);
    savedSeeAll.addEventListener('click', function (event) {
      event.preventDefault();
      window.scrollTo({ top: savedSection.offsetTop - 16, behavior: 'smooth' });
    });

    applyStaticTranslations();
    buildChips();
    loadPosts();
    mountActionbar();
  }());
</script>
</body>
</html>
