<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5TerreGo</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
    }

    .video-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="video-wrapper">
    <video autoplay muted loop playsinline>
      <source src="1234.mp4" type="video/mp4" />
    </video>
  </div>
  <div class="overlay">
    <h1>
      <span class="blue">5Terre</span><span class="orange">Go</span><span class="blue">.com</span>
    </h1>
  </div>

  <style>
    .overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 2;
      pointer-events: none;
    }

    .overlay h1 {
      margin: 0;
      font-size: clamp(36px, 10vw, 100px);
      font-weight: 800;
      letter-spacing: -0.03em;
      font-family: Arial, sans-serif;
    }

    .blue {
      color: #2563eb;
    }

    .orange {
      color: #f97316;
    }
  </style>
  <audio id="bg-audio" src="audio.mp3" autoplay loop muted></audio>

  <script>
    // Unmute audio on first user interaction (required by most browsers)
    const audio = document.getElementById('bg-audio');
    const unlockAudio = () => {
      if (!audio) return;
      audio.muted = false;
      audio.play().catch(()=>{});
      window.removeEventListener('click', unlockAudio);
      window.removeEventListener('touchstart', unlockAudio);
    };
    window.addEventListener('click', unlockAudio);
    window.addEventListener('touchstart', unlockAudio);
  </script>
</body>
</html>
