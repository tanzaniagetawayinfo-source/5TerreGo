<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Campagna attività · 5TerreGo</title><link rel="stylesheet" href="/business-dashboard.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="shell"><div class="top"><a class="back" data-page="discounteditor.html">← Dashboard</a><a class="scanner" href="/partner.html">Scanner QR →</a></div><section class="hero"><div class="eyebrow">Campagna</div><h1 data-business-name>Attività</h1><p>Crea o modifica lo sconto, stabilisci i limiti e decidi quando deve comparire sulla mappa.</p><div id="switcher" class="switcher hidden"><label for="activitySelect">Attività</label><select id="activitySelect"></select></div></section><div id="status" class="status">Caricamento…</div><section id="content" class="panel hidden"><label class="offer-toggle"><span><strong>Offerta attiva e visibile sulla mappa</strong><br><small>Se disattivata la campagna resta salvata ma non genera QR.</small></span><input id="active" type="checkbox"></label><label class="field"><span>Sconto percentuale</span><input id="discount" type="number" min="0" max="100"></label><label class="field"><span>Titolo</span><input id="title" maxlength="120"></label><label class="field"><span>Descrizione e condizioni</span><textarea id="description" maxlength="1000"></textarea></label><div class="grid2"><label class="field"><span>Validità QR in ore</span><input id="hours" type="number" min="1" max="24"></label><label class="field"><span>Convalide massime al giorno</span><input id="maxDaily" type="number" min="0" max="10000"><small>0 = nessun limite</small></label></div><div class="grid2"><label class="field"><span>Valida dalle</span><input id="start" type="time"></label><label class="field"><span>Valida fino alle</span><input id="end" type="time"></label></div><div class="actions"><button id="save" class="btn primary" type="button">Salva campagna</button><button id="close" class="btn soft" type="button">Chiudi offerta</button><button id="delete" class="btn danger" type="button">Elimina campagna</button></div></section></main><script src="/business-dashboard-common.js"></script><script>
(async function(){var api=window.FTGBusiness,ctx,poi;try{ctx=await api.init();if(!ctx)return;poi=ctx.poi;var offer=api.decodeOffer(poi.discount_info),rules=offer.rules||{};document.getElementById('active').checked=Number(poi.discount||0)>0;document.getElementById('discount').value=Number(poi.discount||0);document.getElementById('title').value=offer.title;document.getElementById('description').value=offer.description;document.getElementById('hours').value=Math.max(1,Math.min(24,Number(rules.validity_hours||24)));document.getElementById('maxDaily').value=Math.max(0,Number(rules.max_daily_redemptions||0));document.getElementById('start').value=rules.daily_start||'00:00';document.getElementById('end').value=rules.daily_end||'23:59';document.getElementById('content').classList.remove('hidden');document.getElementById('save').onclick=async function(){var enabled=document.getElementById('active').checked,discount=Math.max(0,Math.min(100,Number(document.getElementById('discount').value||0))),title=document.getElementById('title').value.trim(),description=document.getElementById('description').value.trim();if(enabled&&discount<=0){api.setStatus('Inserisci uno sconto maggiore di zero.','error');return}var info=JSON.stringify({title:title,description:description,rules:{validity_hours:Math.max(1,Math.min(24,Number(document.getElementById('hours').value||24))),max_daily_redemptions:Math.max(0,Math.min(10000,Number(document.getElementById('maxDaily').value||0))),daily_start:document.getElementById('start').value||'00:00',daily_end:document.getElementById('end').value||'23:59'}});this.disabled=true;try{await api.updateDiscount(poi,enabled?discount:0,info);api.setStatus(enabled?'Campagna attiva e visibile sulla mappa.':'Campagna salvata ma chiusa.','ok')}catch(e){api.setStatus(e.message,'error')}finally{this.disabled=false}};document.getElementById('close').onclick=async function(){this.disabled=true;try{await api.updateDiscount(poi,0,poi.discount_info);document.getElementById('active').checked=false;api.setStatus('Offerta chiusa. La campagna resta modificabile.','ok')}catch(e){api.setStatus(e.message,'error')}finally{this.disabled=false}};document.getElementById('delete').onclick=async function(){this.disabled=true;try{await api.updateDiscount(poi,0,'');document.getElementById('active').checked=false;document.getElementById('discount').value=0;document.getElementById('title').value='';document.getElementById('description').value='';api.setStatus('Campagna eliminata.','ok')}catch(e){api.setStatus(e.message,'error')}finally{this.disabled=false}}}catch(e){api.setStatus(e.message,'error')}})();
</script></body></html>
