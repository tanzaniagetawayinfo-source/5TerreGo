<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>5TerreGo Public Transport</title>
  <style>
    :root{
      --bg:#f5f7fb;
      --surface:#ffffff;
      --text:#101828;
      --muted:#667085;
      --line:#dfe6f0;
      --accent:#ff7e57;
      --accent-soft:#fff1e7;
      --train:#ff8a17;
      --ok-bg:#e8f5de;
      --ok-text:#2f8f36;
      --warn-bg:#fff0df;
      --warn-text:#d97706;
      --neutral-bg:#efeff4;
      --neutral-text:#6b7280;
      --danger-bg:#ffe8e8;
      --danger-text:#dc2626;
      --shadow:0 18px 42px rgba(16,24,40,.08);
      --shadow-soft:0 10px 24px rgba(16,24,40,.05);
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
    body{
      max-width:100%;
      overflow-x:hidden;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top left, rgba(23,59,143,.05), transparent 28%),
        radial-gradient(circle at top right, rgba(255,126,87,.08), transparent 24%),
        linear-gradient(180deg,#fcfdff 0%,var(--bg) 100%);
    }

    body.ftg-actionbar-enabled{padding-top:0 !important}

    #ftg-global-actionbar-root{
      position:relative;
      z-index:80;
    }

    #ftg-global-actionbar-root .ftg-topbar{
      position:relative !important;
      top:auto !important;
      left:auto !important;
      right:auto !important;
      inset:auto !important;
      width:100% !important;
    }

    #ftg-global-actionbar-root .ftg-menu-panel{
      position:fixed !important;
    }

    button,input,select{font:inherit}
    button{border:none;background:none;padding:0;cursor:pointer}

    .page{
      width:min(100%,780px);
      max-width:780px;
      margin:0 auto;
      padding:12px 16px 34px;
      overflow-x:clip;
    }

    .transport-shell{
      display:grid;
      gap:14px;
      width:100%;
      min-width:0;
    }

    .selectors{
      width:100%;
      min-width:0;
      display:grid;
      grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);
      gap:10px;
      align-items:center;
    }

    .location-card,
    .datetime-card{
      min-width:0;
      min-height:74px;
      border-radius:20px;
      background:#fff;
      border:1px solid var(--line);
      box-shadow:var(--shadow-soft);
      padding:10px 12px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:6px;
    }

    .location-label,
    .input-label{
      font-size:12px;
      line-height:1;
      color:var(--muted);
      font-weight:700;
    }

    .location-value-row,
    .input-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      min-width:0;
    }

    .station-select,
    .date-input,
    .time-input{
      width:100%;
      min-width:0;
      border:none;
      outline:none;
      background:transparent;
      appearance:none;
      -webkit-appearance:none;
      -moz-appearance:none;
      font-size:17px;
      line-height:1.1;
      letter-spacing:-.03em;
      font-weight:800;
      color:#111827;
      padding:0;
    }

    .date-input,
    .time-input{
      cursor:pointer;
    }

    .select-arrow{
      width:14px;
      height:14px;
      flex:0 0 14px;
      color:#667085;
    }

    .swap-btn{
      width:44px;
      height:44px;
      border-radius:999px;
      border:1px solid var(--line);
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      justify-self:center;
      align-self:center;
      color:#111827;
      box-shadow:var(--shadow-soft);
    }

    .datetime-grid{
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      gap:10px;
    }

    .live-strip{
      width:100%;
      min-width:0;
      display:grid;
      grid-template-columns:minmax(0,1fr);
      gap:6px;
      padding:12px 14px;
      border-radius:18px;
      background:rgba(255,255,255,.88);
      border:1px solid rgba(255,255,255,.98);
      box-shadow:var(--shadow-soft);
    }

    .live-main{
      min-width:0;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .live-dot{
      width:10px;
      height:10px;
      border-radius:999px;
      flex:0 0 10px;
      background:#c1c7d1;
      box-shadow:0 0 0 4px rgba(193,199,209,.18);
    }

    .live-dot.is-live{
      background:#22c55e;
      box-shadow:0 0 0 4px rgba(34,197,94,.14);
    }

    .live-dot.is-error{
      background:#ef4444;
      box-shadow:0 0 0 4px rgba(239,68,68,.12);
    }

    .live-title{
      min-width:0;
      font-size:14px;
      line-height:1.2;
      font-weight:800;
      color:#111827;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .live-meta{
      min-width:0;
      font-size:13px;
      line-height:1.35;
      color:#667085;
      padding-left:20px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .best-card{
      width:100%;
      min-width:0;
      position:relative;
      overflow:hidden;
      border-radius:28px;
      background:linear-gradient(135deg,#fff9f5 0%,#fffefc 100%);
      border:1px solid #f6d7bf;
      box-shadow:var(--shadow);
      padding:16px;
    }

    .best-label{
      display:inline-flex;
      align-items:center;
      min-height:30px;
      padding:0 10px;
      border-radius:999px;
      background:#fff0e2;
      color:#ef6c14;
      font-size:13px;
      font-weight:900;
      letter-spacing:-.02em;
      margin-bottom:12px;
    }

    .best-grid{
      width:100%;
      min-width:0;
      display:grid;
      grid-template-columns:92px minmax(0,1fr) 108px;
      gap:14px;
      align-items:center;
    }

    .transport-badge{
      width:92px;
      height:92px;
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      box-shadow:0 14px 26px rgba(0,0,0,.14);
      background:linear-gradient(180deg,#ff9e2c 0%,#ff7e17 100%);
    }

    .best-main{min-width:0}
    .best-main h2{margin:0;font-size:24px;line-height:1;letter-spacing:-.05em;font-weight:900}

    .best-meta{
      margin-top:10px;
      display:flex;
      align-items:center;
      gap:8px;
      color:#475467;
      font-size:14px;
      font-weight:600;
    }

    .best-time{
      word-break:break-word;
      margin-top:8px;
      font-size:26px;
      line-height:1.02;
      letter-spacing:-.06em;
      font-weight:900;
    }

    .best-sub{
      margin-top:10px;
      display:flex;
      align-items:center;
      gap:8px;
      color:#475467;
      font-size:14px;
      font-weight:600;
    }

    .status-col{display:grid;justify-items:end;gap:12px}

    .status-badge{
      min-height:40px;
      padding:0 14px;
      border-radius:14px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      font-size:14px;
      white-space:nowrap;
    }

    .status-ok{background:var(--ok-bg);color:var(--ok-text)}
    .status-warn{background:var(--warn-bg);color:var(--warn-text)}
    .status-neutral{background:var(--neutral-bg);color:var(--neutral-text)}
    .status-danger{background:var(--danger-bg);color:var(--danger-text)}

    .duration-block{text-align:right}
    .duration-main{font-size:18px;line-height:1;font-weight:900;letter-spacing:-.04em}
    .duration-sub{margin-top:6px;font-size:14px;color:var(--muted);font-weight:600}

    .list{width:100%;min-width:0;display:grid;gap:10px}

    .departure-card,
    .empty-card{
      width:100%;
      min-width:0;
      padding:14px;
      border-radius:24px;
      background:rgba(255,255,255,.92);
      border:1px solid rgba(255,255,255,.98);
      box-shadow:var(--shadow-soft);
    }

    .departure-card{
      display:grid;
      grid-template-columns:70px 76px minmax(0,1fr) 110px;
      gap:14px;
      align-items:center;
    }

    .icon-round{width:58px;height:58px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--train)}
    .time-col{font-size:20px;line-height:1;font-weight:900;letter-spacing:-.05em;color:#111827}
    .route-title{min-width:0;font-size:18px;line-height:1.08;font-weight:900;letter-spacing:-.03em}
    .route-line{min-width:0;overflow-wrap:anywhere;margin-top:4px;font-size:14px;line-height:1.35;color:#475467;font-weight:500}
    .route-meta{min-width:0;overflow-wrap:anywhere;margin-top:8px;display:flex;align-items:center;gap:7px;color:#667085;font-size:14px;font-weight:600}
    .right-col{min-width:0;display:grid;justify-items:end;gap:10px}
    .arrival-time{font-size:14px;color:#344054;font-weight:700}
    .mini-duration{font-size:14px;color:#667085;font-weight:600}

    .empty-card{
      display:grid;
      gap:10px;
      text-align:left;
    }

    .empty-title{
      font-size:18px;
      line-height:1.1;
      font-weight:900;
      letter-spacing:-.03em;
      color:#111827;
    }

    .empty-copy{
      font-size:14px;
      line-height:1.5;
      color:#667085;
    }

    @media (max-width: 720px){
      .best-grid,
      .departure-card{
        grid-template-columns:1fr;
      }

      .status-col,
      .right-col{
        justify-items:start;
      }

      .datetime-grid,
      .selectors{
        grid-template-columns:1fr;
      }

      .swap-btn{
        justify-self:start;
      }
    }
  </style>
</head>
<body>
  <div id="ftg-global-actionbar-root"></div>

  <main class="page">
    <div class="transport-shell">
      <section class="selectors" aria-label="Route selectors">
        <label class="location-card" for="fromSelect">
          <span class="location-label">From</span>
          <span class="location-value-row">
            <select class="station-select" id="fromSelect" aria-label="Select departure station">
              <option>Monterosso</option>
              <option>Vernazza</option>
              <option>Corniglia</option>
              <option>Manarola</option>
              <option>Riomaggiore</option>
              <option>La Spezia</option>
              <option>Levanto</option>
            </select>
            <svg class="select-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m7 10 5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </span>
        </label>

        <button class="swap-btn" id="swapBtn" type="button" aria-label="Swap origin and destination">
          <svg viewBox="0 0 24 24" fill="none" width="22" height="22" aria-hidden="true"><path d="M7 7h11m0 0-3-3m3 3-3 3M17 17H6m0 0 3 3m-3-3 3-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </button>

        <label class="location-card" for="toSelect">
          <span class="location-label">To</span>
          <span class="location-value-row">
            <select class="station-select" id="toSelect" aria-label="Select destination station">
              <option>Vernazza</option>
              <option>Monterosso</option>
              <option>Corniglia</option>
              <option>Manarola</option>
              <option>Riomaggiore</option>
              <option>La Spezia</option>
              <option>Levanto</option>
            </select>
            <svg class="select-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m7 10 5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </span>
        </label>
      </section>

      <section class="datetime-grid" aria-label="Travel date and time">
        <label class="datetime-card" for="dateInput">
          <span class="input-label">Date</span>
          <span class="input-row">
            <input class="date-input" id="dateInput" type="date" aria-label="Travel date" />
          </span>
        </label>

        <label class="datetime-card" for="timeInput">
          <span class="input-label">Time</span>
          <span class="input-row">
            <input class="time-input" id="timeInput" type="time" aria-label="Travel time" />
          </span>
        </label>
      </section>

      <section class="live-strip" aria-label="Realtime train status">
        <div class="live-main">
          <span class="live-dot" id="liveDot"></span>
          <span class="live-title" id="liveTitle">Connecting live trains</span>
        </div>
        <div class="live-meta" id="liveMeta">Trying to load real departures</div>
      </section>

      <section class="best-card" aria-label="Best next option">
        <div class="best-label">BEST NEXT OPTION</div>
        <div class="best-grid">
          <div class="transport-badge" id="bestIconWrap">
            <svg viewBox="0 0 24 24" fill="none" width="42" height="42" aria-hidden="true"><rect x="6" y="3.5" width="12" height="12" rx="3" stroke="currentColor" stroke-width="1.8"></rect><path d="M8.5 18.5 7 21M15.5 18.5 17 21M8 10h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path><circle cx="9" cy="13" r="1" fill="currentColor" stroke="none"></circle><circle cx="15" cy="13" r="1" fill="currentColor" stroke="none"></circle></svg>
          </div>
          <div class="best-main">
            <h2 id="bestMode">Train</h2>
            <div class="best-meta"><span>◷</span><span><strong id="bestIn">Waiting for data</strong></span></div>
            <div class="best-time"><span id="bestDeparture">--:--</span> → <span id="bestArrival">--:--</span></div>
            <div class="best-sub"><span>⌁</span><span id="bestMeta">Only live departures are shown</span></div>
          </div>
          <div class="status-col">
            <span class="status-badge status-neutral" id="bestStatus">No data</span>
            <div class="duration-block">
              <div class="duration-main" id="bestDuration">—</div>
              <div class="duration-sub" id="bestDirect">No fallback</div>
            </div>
          </div>
        </div>
      </section>

      <section class="list" id="departuresList" aria-label="Live departures list"></section>
    </div>
  </main>

  <script>
  (function(){
    var ACTIONBAR_PAGE_URL = 'index.html';

    async function loadAndMountGlobalActionbar(){
      var root = document.getElementById('ftg-global-actionbar-root');
      if (!root) return;
      try {
        var response = await fetch(ACTIONBAR_PAGE_URL, { cache: 'no-store' });
        if (!response.ok) return;
        var html = await response.text();
        var parser = new DOMParser();
        var doc = parser.parseFromString(html, 'text/html');
        var scripts = Array.from(doc.querySelectorAll('script'));
        var links = Array.from(doc.querySelectorAll('link[rel="stylesheet"]'));
        var styles = Array.from(doc.querySelectorAll('style'));

        links.forEach(function(link, index){
          var href = link.getAttribute('href');
          if (!href) return;
          var key = 'ftg-actionbar-link-' + index + '-' + href;
          if (document.querySelector('link[data-ftg-actionbar-link="' + href + '"]')) return;
          var el = document.createElement('link');
          el.rel = 'stylesheet';
          el.href = href;
          el.setAttribute('data-ftg-actionbar-link', href);
          document.head.appendChild(el);
        });

        styles.forEach(function(style, index){
          var key = 'ftg-actionbar-style-' + index;
          if (document.getElementById(key)) return;
          var el = document.createElement('style');
          el.id = key;
          el.textContent = style.textContent || '';
          document.head.appendChild(el);
        });

        for (var i = 0; i < scripts.length; i += 1) {
          var original = scripts[i];
          var src = original.getAttribute('src');
          await new Promise(function(resolve){
            var scriptEl = document.createElement('script');
            var done = false;
            function finish(){
              if (done) return;
              done = true;
              resolve();
            }
            if (src) {
              scriptEl.src = src;
              scriptEl.onload = finish;
              scriptEl.onerror = finish;
            } else {
              scriptEl.textContent = original.textContent || '';
            }
            document.head.appendChild(scriptEl);
            if (!src) finish();
          });
        }

        if (typeof window.FTG_MOUNT_GLOBAL_ACTIONBAR === 'function') {
          document.body.classList.add('ftg-actionbar-enabled');
          root.innerHTML = '';
          window.FTG_MOUNT_GLOBAL_ACTIONBAR(root, window.FTG_ACTIONBAR_CONFIG || {});
        }
      } catch (_error) {
      }
    }

    loadAndMountGlobalActionbar();

    var modeIcon = '<svg viewBox="0 0 24 24" fill="none" width="26" height="26" aria-hidden="true"><rect x="6" y="3.5" width="12" height="12" rx="3" stroke="currentColor" stroke-width="1.8"></rect><path d="M8.5 18.5 7 21M15.5 18.5 17 21M8 10h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path><circle cx="9" cy="13" r="1" fill="currentColor" stroke="none"></circle><circle cx="15" cy="13" r="1" fill="currentColor" stroke="none"></circle></svg>';
    var statusClasses = { ok:'status-ok', warn:'status-warn', neutral:'status-neutral', danger:'status-danger' };
    var TRAIN_RT_ENDPOINTS = [
      window.FTG_TRAIN_RT_ENDPOINT,
      window.FTG_TRANSPORT_ENDPOINT,
      window.FTG_PUBLIC_TRANSPORT_ENDPOINT,
      window.__TRAIN_RT_ENDPOINT,
      '/api/trains/realtime',
      '/api/public-transport/trains',
      '/api/public-transport/realtime',
      '/api/transport/realtime'
    ].filter(Boolean);

    var ACTIVE_TRAIN_RT_ENDPOINT = '';
    var LAST_RT_ERROR = '';
    var REALTIME_REFRESH_MS = 30000;

    var fromSelect = document.getElementById('fromSelect');
    var toSelect = document.getElementById('toSelect');
    var swapBtn = document.getElementById('swapBtn');
    var dateInput = document.getElementById('dateInput');
    var timeInput = document.getElementById('timeInput');
    var departuresList = document.getElementById('departuresList');
    var bestMode = document.getElementById('bestMode');
    var bestIn = document.getElementById('bestIn');
    var bestDeparture = document.getElementById('bestDeparture');
    var bestArrival = document.getElementById('bestArrival');
    var bestMeta = document.getElementById('bestMeta');
    var bestStatus = document.getElementById('bestStatus');
    var bestDuration = document.getElementById('bestDuration');
    var bestDirect = document.getElementById('bestDirect');
    var bestIconWrap = document.getElementById('bestIconWrap');
    var liveDot = document.getElementById('liveDot');
    var liveTitle = document.getElementById('liveTitle');
    var liveMeta = document.getElementById('liveMeta');

    var realtimeDepartures = [];
    var refreshTimer = null;
    var liveState = {
      mode: TRAIN_RT_ENDPOINTS.length ? 'loading' : 'empty',
      updatedAt: '',
      message: TRAIN_RT_ENDPOINTS.length ? 'Connecting to realtime trains…' : 'No realtime endpoint configured'
    };

    function getItalianNow(){
      var parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Europe/Rome',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hourCycle: 'h23'
      }).formatToParts(new Date());
      var map = {};
      parts.forEach(function(part){ map[part.type] = part.value; });
      return {
        isoDate: map.year + '-' + map.month + '-' + map.day,
        time: map.hour + ':' + map.minute
      };
    }

    function toMinutes(value){
      var parts = String(value || '00:00').split(':');
      var hours = parseInt(parts[0], 10) || 0;
      var minutes = parseInt(parts[1], 10) || 0;
      return (hours * 60) + minutes;
    }

    function pad(value){
      return String(value).length === 1 ? '0' + value : String(value);
    }

    function normalizeTime(value){
      var raw = String(value || '').trim();
      if (!raw) return '';
      if (raw.indexOf(':') > -1) {
        var parts = raw.split(':');
        if (parts.length > 1) return pad(parts[0]) + ':' + String(parts[1]).slice(0, 2);
      }
      if (raw.length === 4 && !isNaN(parseInt(raw, 10))) return raw.slice(0, 2) + ':' + raw.slice(2);
      return '';
    }

    function inferDuration(departure, arrival){
      if (!departure || !arrival || arrival === '—') return '—';
      var diff = toMinutes(arrival) - toMinutes(departure);
      if (diff <= 0) return '—';
      if (diff < 60) return diff + ' min';
      return Math.floor(diff / 60) + 'h ' + (diff % 60) + 'm';
    }

    function leadTextFor(item){
      var selectedDate = dateInput.value;
      var selectedTime = normalizeTime(timeInput.value || '');
      var now = getItalianNow();
      if (selectedDate !== now.isoDate) return selectedDate;
      var diff = toMinutes(item.departure) - toMinutes(selectedTime || now.time);
      if (diff <= 0) return 'Now';
      return diff + ' min';
    }

    function normalizeRealtimeRow(row){
      var departure = normalizeTime(row.departure || row.departureTime || row.scheduledDeparture || row.orarioPartenza);
      var arrival = normalizeTime(row.arrival || row.arrivalTime || row.scheduledArrival || row.orarioArrivo) || '—';
      var platform = row.platform || row.binario || row.platformDeparture || row.platformCode || '';
      var rawDelay = row.delayMinutes != null ? row.delayMinutes : row.delay;
      var delay = parseInt(rawDelay, 10);
      var rawStatus = String(row.status || '').toLowerCase();
      var cancelled = !!(row.cancelled || row.canceled || row.suppressed || row.soppressed || rawStatus === 'cancelled');
      var status = 'ok';
      var statusLabel = 'On time';
      if (cancelled) {
        status = 'danger';
        statusLabel = 'Cancelled';
      } else if (!isNaN(delay) && delay > 0) {
        status = 'warn';
        statusLabel = '+' + delay + ' min';
      } else if (rawStatus === 'scheduled') {
        status = 'neutral';
        statusLabel = 'Scheduled';
      }
      return {
        id: row.id || row.trainId || row.number || row.trainNumber || departure,
        route: row.route || row.service || row.name || (row.trainNumber ? 'Train ' + row.trainNumber : 'Train'),
        from: row.from || row.origin || row.originName || row.partenza || fromSelect.value,
        to: row.to || row.destination || row.destinationName || row.arrivo || toSelect.value,
        departure: departure || '—',
        arrival: arrival,
        duration: row.duration || inferDuration(departure, arrival),
        status: status,
        statusLabel: statusLabel,
        meta: platform ? 'Platform ' + platform : (row.meta || 'Live update'),
        direct: row.direct || row.note || row.notes || 'Real time'
      };
    }

    function buildRealtimeUrl(endpoint){
      var base = endpoint || ACTIVE_TRAIN_RT_ENDPOINT;
      if (!base) return '';
      var url = new URL(base, window.location.origin);
      url.searchParams.set('from', fromSelect.value.trim());
      url.searchParams.set('to', toSelect.value.trim());
      url.searchParams.set('date', dateInput.value);
      url.searchParams.set('time', normalizeTime(timeInput.value || ''));
      return url.toString();
    }

    function refreshLiveState(mode, updatedAt, message){
      liveState = { mode: mode, updatedAt: updatedAt || '', message: message || '' };
    }

    function updateLiveStrip(){
      liveDot.classList.remove('is-live', 'is-error');
      if (liveState.mode === 'live') {
        liveDot.classList.add('is-live');
        liveTitle.textContent = 'Live trains connected';
        liveMeta.textContent = liveState.message || ('Updated ' + liveState.updatedAt + ' · refresh every 30s');
      } else if (liveState.mode === 'loading') {
        liveTitle.textContent = 'Connecting live trains';
        liveMeta.textContent = liveState.message || 'Looking for a realtime feed';
      } else if (liveState.mode === 'error') {
        liveDot.classList.add('is-error');
        liveTitle.textContent = 'Live trains unavailable';
        liveMeta.textContent = liveState.message || 'No real departures available right now';
      } else {
        liveTitle.textContent = 'No live trains available';
        liveMeta.textContent = liveState.message || 'No real departures found for this route and time';
      }
    }

    function getFilteredDepartures(){
      var from = fromSelect.value.trim();
      var to = toSelect.value.trim();
      var minMinutes = toMinutes(normalizeTime(timeInput.value || ''));
      return realtimeDepartures.filter(function(item){
        return item.from === from && item.to === to && item.departure !== '—' && toMinutes(item.departure) >= minMinutes;
      }).sort(function(a, b){
        return toMinutes(a.departure) - toMinutes(b.departure);
      });
    }

    function updateBestCard(items){
      bestIconWrap.innerHTML = modeIcon;
      if (!items.length) {
        bestMode.textContent = 'Train';
        bestIn.textContent = 'No live departure';
        bestDeparture.textContent = '--:--';
        bestArrival.textContent = '--:--';
        bestMeta.textContent = 'Only real departures are shown';
        bestStatus.className = 'status-badge status-neutral';
        bestStatus.textContent = 'No data';
        bestDuration.textContent = '—';
        bestDirect.textContent = 'No fallback';
        return;
      }
      var best = items[0];
      bestMode.textContent = 'Train';
      bestIn.textContent = leadTextFor(best);
      bestDeparture.textContent = best.departure;
      bestArrival.textContent = best.arrival;
      bestMeta.textContent = best.meta;
      bestStatus.className = 'status-badge ' + (statusClasses[best.status] || 'status-neutral');
      bestStatus.textContent = best.statusLabel;
      bestDuration.textContent = best.duration;
      bestDirect.textContent = best.direct;
    }

    function cardTemplate(item){
      return '<article class="departure-card">' +
        '<div class="icon-round">' + modeIcon + '</div>' +
        '<div class="time-col">' + item.departure + '</div>' +
        '<div>' +
          '<div class="route-title">' + item.route + '</div>' +
          '<div class="route-line">' + item.from + ' → ' + item.to + '</div>' +
          '<div class="route-meta">' + item.meta + '</div>' +
        '</div>' +
        '<div class="right-col">' +
          '<span class="status-badge ' + (statusClasses[item.status] || 'status-neutral') + '">' + item.statusLabel + '</span>' +
          '<div class="arrival-time">' + item.arrival + '</div>' +
          '<div class="mini-duration">' + item.duration + '</div>' +
        '</div>' +
      '</article>';
    }

    function renderEmptyState(){
      departuresList.innerHTML =
        '<article class="empty-card">' +
          '<div class="empty-title">No real departures found</div>' +
          '<div class="empty-copy">We only show live data from the train feed. Try a different time, reverse the route, or check again in a few seconds.</div>' +
        '</article>';
    }

    function render(){
      var items = getFilteredDepartures();
      updateLiveStrip();
      updateBestCard(items);
      if (!items.length) {
        renderEmptyState();
        return;
      }
      departuresList.innerHTML = items.map(cardTemplate).join('');
    }

    async function fetchRealtimeDepartures(silent){
      var response = null;
      var payload = null;
      var rows = [];
      var endpoints = ACTIVE_TRAIN_RT_ENDPOINT
        ? [ACTIVE_TRAIN_RT_ENDPOINT].concat(TRAIN_RT_ENDPOINTS.filter(function(item){ return item !== ACTIVE_TRAIN_RT_ENDPOINT; }))
        : TRAIN_RT_ENDPOINTS.slice();

      if (!endpoints.length) {
        realtimeDepartures = [];
        refreshLiveState('empty', '', 'No realtime endpoint configured in this page');
        render();
        return;
      }

      if (!silent && liveState.mode !== 'live') {
        refreshLiveState('loading', '', 'Trying ' + endpoints.length + ' realtime endpoint' + (endpoints.length > 1 ? 's' : ''));
        updateLiveStrip();
      }

      LAST_RT_ERROR = '';

      for (var i = 0; i < endpoints.length; i += 1) {
        try {
          response = await fetch(buildRealtimeUrl(endpoints[i]), { cache:'no-store' });
          if (!response.ok) throw new Error('HTTP ' + response.status);
          payload = await response.json();
          rows = Array.isArray(payload) ? payload : (payload.trains || payload.departures || payload.services || payload.data || []);
          realtimeDepartures = rows.map(normalizeRealtimeRow).filter(function(item){ return item && item.departure && item.departure !== '—'; });
          ACTIVE_TRAIN_RT_ENDPOINT = endpoints[i];
          if (realtimeDepartures.length) {
            refreshLiveState('live', getItalianNow().time, 'Updated ' + getItalianNow().time + ' · refresh every 30s');
          } else {
            refreshLiveState('empty', '', 'Live endpoint reached, but no real departures matched this route and time');
          }
          render();
          return;
        } catch (error) {
          LAST_RT_ERROR = error && error.message ? error.message : 'Unknown realtime fetch error';
        }
      }

      realtimeDepartures = [];
      refreshLiveState('error', '', LAST_RT_ERROR ? ('No working realtime endpoint found · ' + LAST_RT_ERROR) : 'No working realtime endpoint found');
      render();
    }

    function scheduleRefresh(){
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(function(){
        if (document.hidden) return;
        fetchRealtimeDepartures(true);
      }, REALTIME_REFRESH_MS);
    }

    function initDateTime(){
      var now = getItalianNow();
      dateInput.value = now.isoDate;
      dateInput.min = now.isoDate;
      timeInput.value = now.time;
    }

    initDateTime();
    render();
    fetchRealtimeDepartures(false);
    scheduleRefresh();

    swapBtn.addEventListener('click', function(){
      var from = fromSelect.value;
      fromSelect.value = toSelect.value;
      toSelect.value = from;
      render();
      fetchRealtimeDepartures(false);
    });

    fromSelect.addEventListener('change', function(){
      render();
      fetchRealtimeDepartures(false);
    });

    toSelect.addEventListener('change', function(){
      render();
      fetchRealtimeDepartures(false);
    });

    dateInput.addEventListener('change', function(){
      render();
      fetchRealtimeDepartures(false);
    });

    timeInput.addEventListener('change', function(){
      render();
      fetchRealtimeDepartures(false);
    });

    document.addEventListener('visibilitychange', function(){
      if (!document.hidden) fetchRealtimeDepartures(true);
    });
  }());
  </script>
</body>
</html>
