<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>5TerreGo | Dashboard visite</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#f7f9fd;
      --text:#17336d;
      --muted:#7083aa;
      --line:#dbe4f2;
      --primary:#163f95;
      --accent:#ff7e57;
      --ok:#16a34a;
      --danger:#cc3d3d;
    }

    *{box-sizing:border-box;}

    html,body{
      margin:0;
      padding:0;
      width:100%;
      max-width:100%;
      min-height:100%;
      overflow-x:hidden;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
    }

    body{
      padding:92px 10px 18px;
    }

    #ftg-actionbar-mount{
      position:relative;
      z-index:9999;
      width:100%;
    }

    .shell{
      width:100%;
      max-width:980px;
      margin:0 auto;
      display:grid;
      gap:14px;
      min-width:0;
    }

    .gate{
      padding:14px 2px;
      font-size:13px;
      color:var(--muted);
      border-bottom:1px solid var(--line);
    }

    .dashboard{
      display:grid;
      gap:16px;
      min-width:0;
    }

    .hidden{display:none !important;}

    .stats-strip{
      display:flex;
      align-items:flex-start;
      gap:14px;
      min-width:0;
      overflow-x:auto;
      overflow-y:hidden;
      padding:0 0 12px;
      scrollbar-width:none;
      -ms-overflow-style:none;
      border-bottom:1px solid var(--line);
    }

    .stats-strip::-webkit-scrollbar{
      display:none;
    }

    .stat{
      flex:0 0 auto;
      min-width:110px;
      max-width:140px;
      padding-right:14px;
      border-right:1px solid var(--line);
    }

    .stat:last-child{
      border-right:none;
      padding-right:0;
    }

    .stat-label{
      font-size:10px;
      line-height:1.15;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:#8ea0c3;
      margin-bottom:4px;
    }

    .stat-value{
      font-size:24px;
      line-height:1;
      font-weight:900;
      letter-spacing:-.05em;
      color:var(--text);
      word-break:break-word;
    }

    .toolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      min-width:0;
    }

    .toolbar-actions{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .btn{
      min-height:34px;
      padding:0 12px;
      border-radius:999px;
      border:1px solid var(--line);
      background:#fff;
      color:var(--text);
      font-size:13px;
      font-weight:800;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      white-space:nowrap;
    }

    .btn.primary{
      background:var(--primary);
      border-color:var(--primary);
      color:#fff;
    }

    .status-inline{
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
    }

    .status-inline.ok{
      color:var(--ok);
      font-weight:800;
    }

    .status-inline.error{
      color:var(--danger);
      font-weight:800;
    }

    .section{
      display:grid;
      gap:10px;
      min-width:0;
      padding-top:2px;
    }

    .section-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      min-width:0;
      border-bottom:1px solid var(--line);
      padding-bottom:8px;
    }

    .section-title{
      margin:0;
      font-size:17px;
      line-height:1;
      letter-spacing:-.03em;
      font-weight:900;
      color:var(--text);
    }

    .section-meta{
      font-size:12px;
      color:var(--muted);
    }

    .filters{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
    }

    .chip{
      min-height:30px;
      padding:0 10px;
      border-radius:999px;
      background:#fff;
      border:1px solid var(--line);
      font-size:12px;
      font-weight:800;
      color:var(--text);
      cursor:pointer;
    }

    .chip.active{
      border-color:var(--accent);
      color:#b65534;
      background:#fff8f4;
    }

    .split{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
      min-width:0;
    }

    .bars{
      display:grid;
      gap:10px;
      min-width:0;
    }

    .bar-row{
      display:grid;
      gap:5px;
      min-width:0;
    }

    .bar-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      font-size:13px;
      min-width:0;
    }

    .bar-top strong{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-weight:800;
    }

    .bar-track{
      height:8px;
      border-radius:999px;
      background:#eaf0fa;
      overflow:hidden;
    }

    .bar-fill{
      height:100%;
      border-radius:999px;
      background:linear-gradient(90deg,#1949ab 0%,#5f8ef0 100%);
    }

    .empty{
      font-size:13px;
      color:var(--muted);
      padding:4px 0;
    }

    .table-wrap{
      width:100%;
      min-width:0;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
    }

    table{
      width:100%;
      min-width:520px;
      border-collapse:collapse;
    }

    th,td{
      text-align:left;
      padding:10px 6px;
      border-bottom:1px solid var(--line);
      font-size:13px;
      vertical-align:top;
    }

    th{
      font-size:10px;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:#8ea0c3;
      font-weight:900;
    }

    .muted{color:var(--muted);}

    @media (max-width: 860px){
      .split{
        grid-template-columns:1fr;
        gap:16px;
      }
    }

    @media (max-width: 640px){
      body{
        padding:86px 7px 14px;
      }

      .shell{
        gap:12px;
      }

      .stats-strip{
        gap:10px;
        padding-bottom:10px;
      }

      .stat{
        min-width:88px;
        max-width:110px;
        padding-right:10px;
      }

      .stat-label{
        font-size:9px;
      }

      .stat-value{
        font-size:18px;
      }

      .btn{
        min-height:30px;
        padding:0 10px;
        font-size:12px;
      }

      .status-inline{
        font-size:11px;
      }

      .section-title{
        font-size:15px;
      }

      .section-meta{
        font-size:11px;
      }

      .chip{
        min-height:28px;
        padding:0 8px;
        font-size:11px;
      }

      .bar-top{
        font-size:12px;
      }

      th,td{
        padding:8px 4px;
        font-size:12px;
      }

      table{
        min-width:440px;
      }
    }

    @media (max-width: 420px){
      body{
        padding:82px 6px 12px;
      }

      .toolbar{
        align-items:flex-start;
      }

      .toolbar-actions{
        width:100%;
      }

      .stat{
        min-width:82px;
        max-width:96px;
      }

      .stat-value{
        font-size:16px;
      }

      .stat-label{
        font-size:8px;
      }
    }
  </style>
</head>
<body>
  <div id="ftg-actionbar-mount"></div>

  <main class="shell">
    <section id="gate" class="gate">Controllo sessione…</section>

    <section id="dashboard" class="dashboard hidden">
      <div class="stats-strip">
        <div class="stat">
          <div class="stat-label">Visitatori</div>
          <div id="uniqueVisitors" class="stat-value">—</div>
        </div>

        <div class="stat">
          <div class="stat-label">Ricariche pagina</div>
          <div id="totalVisits" class="stat-value">—</div>
        </div>

        <div class="stat">
          <div class="stat-label">Pagina top</div>
          <div id="topPage" class="stat-value" style="font-size:13px; line-height:1.15; letter-spacing:-.02em;">—</div>
        </div>
      </div>

      <div class="toolbar">
        <div class="toolbar-actions">
          <button id="refreshBtn" class="btn primary" type="button">Aggiorna</button>
          <a class="btn" href="map.html">Apri mappa</a>
        </div>
        <span id="status" class="status-inline">Caricamento…</span>
      </div>

      <section class="section">
        <div class="section-head">
          <h2 class="section-title">Intervallo</h2>
          <div class="filters" id="filters">
            <button class="chip active" type="button" data-days="7">7 giorni</button>
            <button class="chip" type="button" data-days="30">30 giorni</button>
            <button class="chip" type="button" data-days="90">90 giorni</button>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="split">
          <div class="section">
            <div class="section-head">
              <h2 class="section-title">Pagine più viste</h2>
              <div id="pageCount" class="section-meta">—</div>
            </div>
            <div id="pageBars" class="bars"></div>
          </div>

          <div class="section">
            <div class="section-head">
              <h2 class="section-title">Ultimi 14 giorni</h2>
              <div id="dailyCount" class="section-meta">—</div>
            </div>
            <div id="dailyBars" class="bars"></div>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2 class="section-title">Visite recenti</h2>
          <div id="recentMeta" class="section-meta">—</div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Quando</th>
                <th>Pagina</th>
                <th>Referrer</th>
                <th>Paese</th>
              </tr>
            </thead>
            <tbody id="recentTable"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script>
    async function injectHTMLWithScripts(target, html){
      const wrapper = document.createElement('div');
      wrapper.innerHTML = html;

      const nodes = Array.from(wrapper.childNodes);
      target.innerHTML = '';

      for(const node of nodes){
        if(node.nodeType === 1 && node.tagName.toLowerCase() === 'script'){
          const script = document.createElement('script');
          for(const attr of Array.from(node.attributes)){
            script.setAttribute(attr.name, attr.value);
          }
          script.textContent = node.textContent || '';
          target.appendChild(script);
        } else {
          target.appendChild(node.cloneNode(true));
        }
      }
    }

    async function mountGlobalActionbar(){
      const mount = document.getElementById('ftg-actionbar-mount');
      if(!mount) return;

      try{
        const res = await fetch('/global-actionbar.html?v=3', { cache: 'no-store' });
        if(!res.ok) throw new Error('Impossibile caricare global-actionbar.html');
        const html = await res.text();
        await injectHTMLWithScripts(mount, html);
      }catch(err){
        console.error('Global actionbar non montata:', err);
      }
    }

    mountGlobalActionbar();
  </script>

  <script>
    (function () {
      'use strict';

      var SUPABASE_URL = 'https://jpflcbktcnhmlvaibzcw.supabase.co';
      var SUPABASE_ANON_KEY = 'sb_publishable_vWugAbu_xtetgvrCh6yKYw_iA8bAXBa';
      var OWNER_EMAIL = '5terrego.info@gmail.com';
      var DAYS = 7;

      var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
      });

      var gate = document.getElementById('gate');
      var dashboard = document.getElementById('dashboard');
      var status = document.getElementById('status');
      var refreshBtn = document.getElementById('refreshBtn');
      var filters = document.getElementById('filters');

      var totalVisits = document.getElementById('totalVisits');
      var uniqueVisitors = document.getElementById('uniqueVisitors');
      var topPage = document.getElementById('topPage');

      var pageBars = document.getElementById('pageBars');
      var dailyBars = document.getElementById('dailyBars');
      var recentTable = document.getElementById('recentTable');

      var pageCount = document.getElementById('pageCount');
      var dailyCount = document.getElementById('dailyCount');
      var recentMeta = document.getElementById('recentMeta');

      function escapeHTML(value) {
        return String(value || '').replace(/[&<>"']/g, function (char) {
          return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[char];
        });
      }

      function formatPage(path) {
        if (!path) return '/';
        return path === '/' ? '/' : path.replace(/\/$/, '') || '/';
      }

      function formatReferrer(value) {
        if (!value) return 'Diretto';
        try { return new URL(value).hostname || 'Diretto'; }
        catch (_error) { return value; }
      }

      function formatDateTime(value) {
        var date = new Date(value);
        return date.toLocaleString('it-IT', {
          year:'numeric',
          month:'short',
          day:'numeric',
          hour:'2-digit',
          minute:'2-digit'
        });
      }

      function buildDailyBuckets(rows, bucketDays) {
        var map = {};
        var list = [];
        var i;

        for (i = bucketDays - 1; i >= 0; i -= 1) {
          var day = new Date();
          day.setHours(0,0,0,0);
          day.setDate(day.getDate() - i);
          var key = day.toISOString().slice(0,10);
          map[key] = 0;
          list.push({
            key:key,
            label: day.toLocaleDateString('it-IT', { month:'short', day:'numeric' }),
            count:0
          });
        }

        rows.forEach(function (row) {
          var key = String(row.created_at || '').slice(0,10);
          if (Object.prototype.hasOwnProperty.call(map, key)) map[key] += 1;
        });

        list.forEach(function (item) {
          item.count = map[item.key] || 0;
        });

        return list;
      }

      function aggregateBy(rows, getter) {
        var map = {};
        rows.forEach(function (row) {
          var key = getter(row) || 'Sconosciuto';
          map[key] = (map[key] || 0) + 1;
        });

        return Object.keys(map)
          .map(function (key) { return { key:key, count:map[key] }; })
          .sort(function (a,b) { return b.count - a.count; });
      }

      function renderBars(target, items, emptyText) {
        var max = items.length ? items[0].count : 0;

        if (!items.length) {
          target.innerHTML = '<div class="empty">' + escapeHTML(emptyText) + '</div>';
          return;
        }

        target.innerHTML = items.map(function (item) {
          var pct = max ? Math.max(6, Math.round((item.count / max) * 100)) : 0;
          return ''
            + '<div class="bar-row">'
            +   '<div class="bar-top">'
            +     '<strong>' + escapeHTML(item.key || item.label) + '</strong>'
            +     '<span class="muted">' + item.count + '</span>'
            +   '</div>'
            +   '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>'
            + '</div>';
        }).join('');
      }

      function renderRecent(rows) {
        if (!rows.length) {
          recentTable.innerHTML = '<tr><td colspan="4" class="muted">Nessuna visita disponibile.</td></tr>';
          return;
        }

        recentTable.innerHTML = rows.slice(0, 20).map(function (row) {
          return ''
            + '<tr>'
            +   '<td>' + escapeHTML(formatDateTime(row.created_at)) + '</td>'
            +   '<td><strong>' + escapeHTML(formatPage(row.page_path)) + '</strong></td>'
            +   '<td>' + escapeHTML(formatReferrer(row.referrer)) + '</td>'
            +   '<td>' + escapeHTML(row.country || '—') + '</td>'
            + '</tr>';
        }).join('');
      }

      async function ensureOwner() {
        var result = await supabase.auth.getSession();
        var session = result && result.data ? result.data.session : null;
        var email = session && session.user && session.user.email
          ? String(session.user.email).trim().toLowerCase()
          : '';

        if (!email) {
          gate.textContent = 'Non hai effettuato l’accesso.';
          status.textContent = 'Non autenticato';
          status.className = 'status-inline error';
          return false;
        }

        if (email !== OWNER_EMAIL) {
          gate.textContent = 'Accesso negato. Questa dashboard è riservata all’owner.';
          status.textContent = 'Accesso negato';
          status.className = 'status-inline error';
          return false;
        }

        gate.classList.add('hidden');
        dashboard.classList.remove('hidden');
        status.textContent = 'Accesso owner attivo';
        status.className = 'status-inline ok';
        return true;
      }

      async function loadRows() {
        var cutoff = new Date();
        cutoff.setDate(cutoff.getDate() - DAYS);

        var result = await supabase
          .from('site_visits')
          .select('created_at,page_path,referrer,country,session_id,ip_hash')
          .gte('created_at', cutoff.toISOString())
          .order('created_at', { ascending:false })
          .limit(5000);

        if (result.error) throw result.error;
        return Array.isArray(result.data) ? result.data : [];
      }

      async function refresh() {
        try {
          status.textContent = 'Caricamento…';
          status.className = 'status-inline';

          if (!(await ensureOwner())) return;

          var rows = await loadRows();
          var pageStats = aggregateBy(rows, function (row) { return formatPage(row.page_path); });
          var dailyStats = buildDailyBuckets(rows, 14);
          var unique = {};

          rows.forEach(function (row) {
            var key = row.session_id || row.ip_hash || '';
            if (key) unique[key] = true;
          });

          uniqueVisitors.textContent = String(Object.keys(unique).length || 0);
          totalVisits.textContent = String(rows.length);
          topPage.textContent = pageStats.length ? pageStats[0].key : '—';

          pageCount.textContent = pageStats.length + ' pagine';
          dailyCount.textContent = '14 giorni';
          recentMeta.textContent = rows.length
            ? ('Mostrate ' + Math.min(rows.length, 20) + ' di ' + rows.length + ' visite')
            : 'Nessuna visita';

          renderBars(pageBars, pageStats.slice(0, 8), 'Nessuna pagina vista in questo intervallo.');
          renderBars(
            dailyBars,
            dailyStats.map(function (item) { return { key:item.label, count:item.count }; }),
            'Nessun traffico negli ultimi giorni.'
          );
          renderRecent(rows);

          status.textContent = 'Aggiornato ora';
          status.className = 'status-inline ok';
        } catch (error) {
          gate.classList.remove('hidden');
          dashboard.classList.add('hidden');
          gate.textContent = error && error.message ? error.message : 'Impossibile caricare i dati.';
          status.textContent = 'Errore caricamento';
          status.className = 'status-inline error';
        }
      }

      filters.addEventListener('click', function (event) {
        var button = event.target.closest('[data-days]');
        if (!button) return;

        DAYS = Number(button.getAttribute('data-days') || 7);

        Array.prototype.forEach.call(filters.querySelectorAll('.chip'), function (chip) {
          chip.classList.toggle('active', chip === button);
        });

        refresh();
      });

      refreshBtn.addEventListener('click', refresh);
      refresh();
    }());
  </script>
</body>
</html>
