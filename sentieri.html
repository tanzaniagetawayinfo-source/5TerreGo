    function trailHref(t){return '/map.html?trail='+encodeURIComponent(t.id)+'&trailPreview=1';}
    function buildVillages(){Array.from(new Set(trails.map(function(t){return String(t.start_name||'').trim();}).filter(Boolean))).sort().forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent=v;el.village.appendChild(o);});}
    function matchesSearch(t,q){if(!q)return true;return [t.name,t.description,t.start_name,t.end_name,t.estimated_duration].join(' ').toLowerCase().indexOf(q)!==-1;}

    function scrollToFirstResult(){
      window.requestAnimationFrame(function(){
        window.requestAnimationFrame(function(){
          var firstCard=el.cards.querySelector('.trail-card');
          if(!firstCard)return;
          var actionbar=document.getElementById('ftg-global-actionbar-root');
          var actionbarChild=actionbar&&actionbar.firstElementChild;
          var actionbarHeight=0;
          if(actionbar){
            actionbarHeight=Math.max(actionbar.getBoundingClientRect().height,actionbarChild?actionbarChild.getBoundingClientRect().height:0);
          }
          var offset=Math.max(18,Math.min(actionbarHeight+14,130));
          var top=firstCard.getBoundingClientRect().top+window.pageYOffset-offset;
          window.scrollTo({top:Math.max(0,top),behavior:'smooth'});
        });
      });
    }
    function renderPagination(totalPages){
      el.pagination.innerHTML='';
      if(totalPages<=1)return;
      function addButton(label,page,disabled,active,ariaLabel){
        var button=document.createElement('button');
        button.type='button';
        button.className='page-btn'+(active?' active':'');
        button.textContent=label;
        button.disabled=!!disabled;
        if(ariaLabel)button.setAttribute('aria-label',ariaLabel);
        if(active)button.setAttribute('aria-current','page');
        button.addEventListener('click',function(){
          currentPage=page;
          render();
          scrollToFirstResult();
        });
        el.pagination.appendChild(button);
      }
      addButton('‹',Math.max(1,currentPage-1),currentPage===1,false,'Pagina precedente');
      var start=Math.max(1,currentPage-2),end=Math.min(totalPages,start+4);
      start=Math.max(1,end-4);
      for(var page=start;page<=end;page+=1)addButton(String(page),page,false,page===currentPage,'Pagina '+page);
      addButton('›',Math.min(totalPages,currentPage+1),currentPage===totalPages,false,'Pagina successiva');
    }
    function render(){
      var village=el.village.value,level=el.difficulty.value,q=String(el.search.value||'').trim().toLowerCase();
      filtered=trails.filter(function(t){return(!village||t.start_name===village)&&(!level||difficulty(t)===level)&&matchesSearch(t,q);});
      if(userLocation)filtered.sort(function(a,b){return haversine(userLocation,coordinates(a)[0])-haversine(userLocation,coordinates(b)[0]);});
      el.cards.innerHTML='';
      if(!filtered.length){
        el.cards.innerHTML='<div class="empty-card">Nessun sentiero corrisponde alla ricerca e ai filtri scelti.</div>';
        el.status.textContent='0 percorsi trovati';
        el.pagination.innerHTML='';
        return;
      }
      var totalPages=Math.ceil(filtered.length/PAGE_SIZE);
      if(currentPage>totalPages)currentPage=totalPages;
      if(currentPage<1)currentPage=1;
      var pageItems=filtered.slice((currentPage-1)*PAGE_SIZE,currentPage*PAGE_SIZE);
      pageItems.forEach(function(t){
        var levelName=difficulty(t),near=userLocation&&coordinates(t)[0]?haversine(userLocation,coordinates(t)[0]):null,article=document.createElement('article');
        article.className='trail-card level-'+levelName;
        article.innerHTML='<a class="trail-link" href="'+esc(trailHref(t))+'"><span class="trail-label">'+esc(trailCode(t))+' · '+esc(difficultyLabels[levelName])+'</span><h2>'+esc(t.name)+'</h2>'+(near!=null?'<div class="route-name">'+near.toFixed(1)+' km dalla tua posizione</div>':'')+'<p class="trail-excerpt">'+esc(t.description||'Apri la pagina del sentiero per tutti i dettagli del percorso.')+'</p><div class="quick-stats"><span>'+esc(Number(t.distance_km||0).toFixed(1))+' km</span><span>'+esc(t.estimated_duration||'—')+'</span><span>+'+esc(Math.round(Number(t.elevation_gain_m||0)))+' m</span><span>'+esc(shoeLabels[String(t.shoe_type||'').toLowerCase()]||'trekking')+'</span></div><span class="trail-arrow" aria-hidden="true">›</span></a>';
        el.cards.appendChild(article);
      });
      var first=(currentPage-1)*PAGE_SIZE+1,last=Math.min(currentPage*PAGE_SIZE,filtered.length);
      el.status.textContent='Risultati '+first+'–'+last+' di '+filtered.length;
      renderPagination(totalPages);
    }
    function useLocation(){if(!navigator.geolocation){setNote('La geolocalizzazione non è supportata dal browser.');return;}el.near.disabled=true;el.near.textContent='Posizione…';navigator.geolocation.getCurrentPosition(function(pos){userLocation=[pos.coords.latitude,pos.coords.longitude];el.near.disabled=false;el.near.textContent='✓ Ordinati per distanza';setNote('Sentieri ordinati dalla partenza più vicina. La posizione resta nel browser.');render();},function(){el.near.disabled=false;el.near.textContent='◎ Più vicino a me';setNote('Non è stato possibile leggere la posizione. Controlla i permessi del browser.');},{enableHighAccuracy:true,timeout:10000,maximumAge:300000});}
    function setNote(message){el.note.textContent=message;el.note.classList.add('visible');}
    function reset(){el.search.value='';el.village.value='';el.difficulty.value='';currentPage=1;userLocation=null;el.near.textContent='◎ Più vicino a me';el.note.classList.remove('visible');var url=new URL(location.href);url.searchParams.delete('trail');history.replaceState(null,'',url.pathname);render();}
    async function load(){try{var client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false}}),res=await client.from('trails').select(SAFE_COLUMNS).order('importance',{ascending:false});if(res.error)throw res.error;trails=(res.data||[]).filter(function(t){return coordinates(t).length>1;});buildVillages();var wanted=new URLSearchParams(location.search).get('trail'),legacy=wanted&&trails.find(function(t){return String(t.id)===wanted;});if(legacy){location.replace(trailHref(legacy));return;}render();}catch(error){console.error(error);el.status.textContent='Sentieri temporaneamente non disponibili';el.cards.innerHTML='<div class="empty-card">Non riusciamo a caricare i percorsi. Riprova tra poco.</div>';}}
    el.search.addEventListener('input',function(){currentPage=1;render();});el.village.addEventListener('change',function(){currentPage=1;render();});el.difficulty.addEventListener('change',function(){currentPage=1;render();});el.near.addEventListener('click',useLocation);el.reset.addEventListener('click',reset);load();
  }());
  </script>
